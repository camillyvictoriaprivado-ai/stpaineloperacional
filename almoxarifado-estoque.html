<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Almoxarifado</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

body{
    margin:0;
    font-family:'Orbitron', Arial, sans-serif;
    background:#f5f7fb;
    color:#111;
}

.header{
    background:#fff;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #ff7a00;
}

.btn{
    border:none;
    padding:10px 14px;
    border-radius:6px;
    cursor:pointer;
    font-family:'Orbitron', sans-serif;
}

.btn-dark-custom{ background:#111; color:#fff; }
.btn-yellow{ background:#ffcc00; color:#111; font-weight:600; }

.kpis{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    padding:20px;
}

.kpi{
    background:#fff;
    border-radius:12px;
    padding:18px;
}

.kpi p{
    font-size:28px;
    margin:10px 0 0;
    color:#ff7a00;
    font-weight:bold;
}

/* FILTERS */
.filters{
    display:flex;
    gap:10px;
    padding:0 20px 20px;
}

input, select{
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
    font-family:'Orbitron';
}

/* CHARTS */
.charts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    padding:0 20px 20px;
}

.chart-wide{
    grid-column:1 / span 2;
    min-height:750px;
}

.chart-wide canvas{
    height:700px !important;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:15px;
}

.card h4{
    margin:0 0 15px;
    color:#111;
    font-size:14px;
    font-weight:600;
}

/* TABLE */
.table{
    padding:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#111;
    color:#fff;
    padding:12px;
}

td{
    padding:12px;
    border-bottom:1px solid #eee;
}

.low{ color:#ff3b30; font-weight:bold; }
.ok{ color:#2ecc71; font-weight:bold; }

</style>
</head>

<body>

<div class="header">
    <h1>CONTROLE DE ALMOXARIFADO</h1>

    <div>
        <button class="btn btn-dark-custom" onclick="window.location.href='painel.html'">← Voltar ao Painel</button>
        <button class="btn btn-yellow" onclick="exportarExcel()">EXPORTAR</button>
    </div>
</div>

<div class="kpis">
    <div class="kpi"><h3>Total</h3><p id="total">0</p></div>
    <div class="kpi"><h3>Baixo</h3><p id="baixo">0</p></div>
    <div class="kpi"><h3>Saldo</h3><p id="saldo">0</p></div>
    <div class="kpi"><h3>Clusters</h3><p id="clusters">0</p></div>
</div>

<div class="charts">

    <div class="card">
        <h4>Pendências por Cluster</h4>
        <canvas id="chartCluster"></canvas>
    </div>

    <div class="card">
        <h4>Estoque por Cluster</h4>
        <canvas id="chartStatus"></canvas>
    </div>

    <div class="card chart-wide">
        <h4>Material Ofensor (Quantidade de IDs)</h4>
        <canvas id="chartMaterial"></canvas>
    </div>

</div>

<div class="filters">
    <input id="search" placeholder="Buscar material..." oninput="aplicar()">

    <select id="fCluster" onchange="aplicar()">
        <option value="">Todos clusters</option>
    </select>

    <select id="fStatus" onchange="aplicar()">
        <option value="">Status</option>
        <option value="BAIXO">Baixo</option>
        <option value="OK">OK</option>
    </select>

    <button class="btn btn-yellow" onclick="limparFiltro()">Limpar Filtros</button>
</div>

<div class="table">
<table>
<thead>
<tr>
    <th>Código</th>
    <th>Material</th>
    <th>Centro</th>
    <th>Cluster</th>
    <th>Depósito</th>
    <th>Saldo</th>
    <th>Status</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby-4fOy9HAEmCUMndlLrPWJC7Gq62K5kSd3VWlo3EHEcug_68A5Uyv8hzzbJHtxh0t-Ig/exec";

let dados = [];
let filtrados = [];

let c1,c2,c3;

let filtroClusterGrafico = "";
let filtroMaterialGrafico = "";

function num(v){ return Number(v||0); }
function status(s){ return num(s) < 10 ? "BAIXO" : "OK"; }

async function load(){

    const res = await fetch(API_URL);
    const data = await res.json();

    dados = data.almoxarifado || [];
    filtrados = [...dados];

    preencherClusters();
    render();
    kpis();
    charts();
}

function preencherClusters(){

    const c = [...new Set(dados.map(i=>i.cluster))];
    const sel = document.getElementById("fCluster");

    c.forEach(x=>{
        const o=document.createElement("option");
        o.value=x;
        o.innerText=x;
        sel.appendChild(o);
    });
}

function aplicar(){

    const t = document.getElementById("search").value.toLowerCase();
    const cl = document.getElementById("fCluster").value;
    const st = document.getElementById("fStatus").value;

    filtrados = dados.filter(i=>{

        const okT = (i.material||"").toLowerCase().includes(t);
        const okC = cl ? i.cluster === cl : true;
        const okS = st ? status(i.saldo) === st : true;

        const okGraficoCluster =
            filtroClusterGrafico ? (i.cluster || "") === filtroClusterGrafico : true;

        const okGraficoMaterial =
            filtroMaterialGrafico ? (i.material || "") === filtroMaterialGrafico : true;

        return okT && okC && okS && okGraficoCluster && okGraficoMaterial;
    });

    render();
    kpis();
    charts();
}

function kpis(){

    document.getElementById("total").innerText = filtrados.length;

    const baixo = filtrados.filter(i=>num(i.saldo)<10).length;
    document.getElementById("baixo").innerText = baixo;

    const saldo = filtrados.reduce((a,b)=>a+num(b.saldo),0);
    document.getElementById("saldo").innerText = saldo;

    document.getElementById("clusters").innerText =
        new Set(filtrados.map(i=>i.cluster)).size;
}

function charts(){

    /* =======================
       1. CLUSTER (PIE)
    ======================= */
    const cluster = {};
    filtrados.forEach(i=>{
        const c = i.cluster || "Sem Info";
        cluster[c] = (cluster[c] || 0) + 1;
    });

    if(c1) c1.destroy();
    c1 = new Chart(document.getElementById("chartCluster"),{
        type:"pie",
        data:{
            labels:Object.keys(cluster),
            datasets:[{
                data:Object.values(cluster),
                backgroundColor:[
                    "#ff7a00",
                    "#111",
                    "#2ecc71",
                    "#ff3b30",
                    "#3498db"
                ]
            }]
        },
        options:{
            onClick:(event,elements)=>{
                if(!elements.length) return;

                const index = elements[0].index;
                filtroClusterGrafico = Object.keys(cluster)[index];

                aplicar();
            }
        }
    });

    /* =======================
       2. ESTOQUE (BAR)
    ======================= */
    const estoque = {};
    filtrados.forEach(i=>{
        const c = i.cluster || "Sem Info";
        estoque[c] = (estoque[c] || 0) + num(i.saldo);
    });

    if(c2) c2.destroy();
    c2 = new Chart(document.getElementById("chartStatus"),{
        type:"bar",
        data:{
            labels:Object.keys(estoque),
            datasets:[{
                label:"Estoque",
                data:Object.values(estoque),
                backgroundColor:"#ff7a00"
            }]
        },
        options:{
            onClick:(event,elements)=>{
                if(!elements.length) return;

                const index = elements[0].index;
                filtroClusterGrafico = Object.keys(estoque)[index];

                aplicar();
            }
        }
    });

    /* =======================
       3. MATERIAL (BAR HORIZONTAL)
    ======================= */
    const material = {};
    filtrados.forEach(i=>{
        const m = i.material || "Sem Info";
        material[m] = (material[m] || 0) + 1;
    });

    const top = Object.entries(material)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,10);

    if(c3) c3.destroy();

    c3 = new Chart(document.getElementById("chartMaterial"),{
        type:"bar",
        data:{
            labels:top.map(i=>i[0]),
            datasets:[{
                label:"Qtd de IDs",
                data:top.map(i=>i[1]),
                backgroundColor:"#ff7a00",
                borderColor:"#d96600",
                borderWidth:1
            }]
        },
        options:{
            indexAxis:'y',
            responsive:true,
            maintainAspectRatio:false,

            onClick:(event,elements)=>{
                if(!elements.length) return;

                const index = elements[0].index;
                const materialSelecionado = top[index][0];

                document.getElementById("search").value = materialSelecionado;

                filtroMaterialGrafico = materialSelecionado;
                aplicar();
            }
        }
    });
}

function render(){

    const tb=document.getElementById("tbody");
    tb.innerHTML="";

    filtrados.forEach(i=>{

        const s = status(i.saldo);

        tb.innerHTML+=`
        <tr>
            <td>${i.codigo || i.cod || ""}</td>
            <td>${i.material || ""}</td>
            <td>${i.centro || ""}</td>
            <td>${i.cluster || ""}</td>
            <td>${i.deposito || ""}</td>
            <td>${num(i.saldo)}</td>
            <td class="${s==="BAIXO"?"low":"ok"}">${s}</td>
        </tr>`;
    });
}

function exportarExcel(){

    const ws=XLSX.utils.json_to_sheet(filtrados.map(i=>({
        Codigo:i.codigo,
        Material:i.material,
        Centro:i.centro,
        Cluster:i.cluster,
        Deposito:i.deposito,
        Saldo:num(i.saldo),
        Status:status(i.saldo)
    })));

    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"almox");
    XLSX.writeFile(wb,"almoxarifado.xlsx");
}

function limparFiltro(){

    document.getElementById("search").value = "";
    document.getElementById("fCluster").value = "";
    document.getElementById("fStatus").value = "";

    filtroClusterGrafico = "";
    filtroMaterialGrafico = "";

    filtrados = [...dados];

    render();
    kpis();
    charts();
}

load();

</script>

</body>
</html>
