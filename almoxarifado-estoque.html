<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Almoxarifado</title>

<script src="auth.js"></script>
<script>protegerPagina(["admin_sc", "usuario_sc"]);</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
    --indigo:#4f46e5;
    --violet:#7c3aed;
    --pink:#db2777;
    --orange:#f97316;
    --navy:#0f172a;
    --bg:#f1f5f9;
    --white:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --border-light:#f1f5f9;
    --success:#10b981;
    --danger:#f43f5e;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    opacity:0;
    transition:opacity .15s ease;
}

body.auth-ready{
    opacity:1;
}

/* HEADER */

.header{
    background:white;

    padding:0 24px;
    height:64px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 1px 0 var(--border);

    position:sticky;
    top:0;
    z-index:20;
}

.header h1{
    color:var(--navy);
    font-size:16px;
    font-weight:800;
    letter-spacing:.01em;
}

/* BOTÕES */

.btn{
    border:none;

    padding:10px 16px;

    border-radius:12px;

    cursor:pointer;

    font-family:'Inter',sans-serif;

    font-size:13px;

    font-weight:700;

    transition:.2s ease;
}

.btn-dark-custom{
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--border);
}

.btn-dark-custom:hover{
    border-color:var(--indigo);
    color:var(--indigo);
}

.btn-yellow{
    background:linear-gradient(135deg,var(--indigo),var(--violet));
    color:white;
    font-weight:700;
    box-shadow:0 4px 12px rgba(79,70,229,.25);
}

.btn-yellow:hover{
    opacity:.92;
    transform:translateY(-1px);
}

/* KPIS */

.kpis{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));

    gap:16px;

    padding:24px 24px 0;
}

.kpi{
    background:white;

    border:1px solid var(--border-light);

    border-radius:20px;

    padding:20px 22px;

    box-shadow:0 1px 2px rgba(15,23,42,.04);

    transition:.2s ease;
}

.kpi:hover{
    transform:translateY(-2px);

    box-shadow:0 10px 24px rgba(15,23,42,.08);

    border-color:transparent;
}

.kpi h3{
    color:var(--muted);
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.05em;
}

.kpi p{
    font-size:30px;

    margin-top:12px;

    color:var(--navy);

    font-weight:900;
}

/* FILTROS */

.filters{
    display:flex;

    flex-wrap:wrap;

    gap:12px;

    padding:20px 24px;
}

input,
select{
    padding:12px 14px;

    border:1px solid var(--border);

    border-radius:12px;

    background:white;

    font-family:'Inter',sans-serif;

    font-size:13px;

    color:var(--text);
}

input:focus,
select:focus{
    outline:none;

    border-color:var(--indigo);

    box-shadow:
        0 0 0 4px rgba(79,70,229,.12);
}

/* CHARTS */

.charts{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(450px,1fr));

    gap:16px;

    padding:0 24px 24px;
}

.card{
    background:white;

    border:1px solid var(--border-light);

    border-radius:20px;

    padding:22px;

    box-shadow:0 1px 2px rgba(15,23,42,.04);
}

.card h4{
    margin-bottom:16px;

    color:var(--navy);

    font-size:14px;

    font-weight:800;

    display:flex;
    align-items:center;
    gap:8px;
}

.card h4::before{
    content:"";
    width:4px;
    height:14px;
    border-radius:4px;
    background:linear-gradient(180deg,var(--indigo),var(--violet));
    display:inline-block;
}

/* GRÁFICO PRINCIPAL */

.chart-wide{
    grid-column:1 / -1;

    min-height:750px;
}

.chart-wide canvas{
    height:700px !important;
}

/* TABELA */

.table{
    padding:0 24px 24px;
}

table{
    width:100%;

    border-collapse:collapse;

    background:white;

    border-radius:16px;

    overflow:hidden;

    box-shadow:0 1px 2px rgba(15,23,42,.04);

    border:1px solid var(--border-light);
}

th{
    background:var(--navy);

    color:white;

    padding:14px;

    text-align:left;

    font-weight:700;

    font-size:12px;

    text-transform:uppercase;
    letter-spacing:.04em;
}

td{
    padding:14px;

    border-bottom:1px solid var(--border-light);

    font-size:13px;
}

tbody tr{
    transition:.15s;
}

tbody tr:hover{
    background:rgba(79,70,229,.06);
}

/* STATUS */

.low{
    color:var(--danger);
    font-weight:700;
}

.ok{
    color:var(--success);
    font-weight:700;
}

/* RESPONSIVO */

@media(max-width:992px){

    .charts{
        grid-template-columns:1fr;
    }

    .chart-wide{
        grid-column:auto;
        min-height:auto;
    }

    .chart-wide canvas{
        height:400px !important;
    }

}

@media(max-width:768px){

    .header{
        padding:0 16px;
    }

    .header h1{
        font-size:14px;
    }

    .kpis,
    .filters,
    .charts,
    .table{
        padding-left:16px;
        padding-right:16px;
    }

    .kpi p{
        font-size:26px;
    }

}
</style>
</head>

<body>

<div class="header">
    <div style="display:flex;align-items:center;gap:14px;">
        <div style="width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--orange),var(--indigo));color:white;font-weight:900;font-size:11px;">TLP</div>
        <h1>Controle de Almoxarifado</h1>
    </div>

    <div>
        <button class="btn btn-dark-custom" onclick="window.location.href='painel.html'">← Voltar ao Painel</button>
        <button class="btn btn-yellow" onclick="exportarExcel()">Exportar</button>
    </div>
</div>

<div class="kpis">
    <div class="kpi"><h3>Total</h3><p id="total">0</p></div>
    <div class="kpi"><h3>Baixo</h3><p id="baixo">0</p></div>
    <div class="kpi"><h3>Saldo</h3><p id="saldo">0</p></div>
    <div class="kpi"><h3>Clusters</h3><p id="clusters">0</p></div>
</div>

<div class="charts">

    <div class="card">
        <h4>Pendências por Cluster</h4>
        <canvas id="chartCluster"></canvas>
    </div>

    <div class="card">
        <h4>Estoque por Cluster</h4>
        <canvas id="chartStatus"></canvas>
    </div>

    <div class="card chart-wide">
        <h4>Material Ofensor (Quantidade de IDs)</h4>
        <canvas id="chartMaterial"></canvas>
    </div>

    <div class="card chart-wide">
        <h4>Itens por Centro de Custo</h4>
    <canvas id="chartCentro"></canvas>
</div>

</div>

<div id="modalCentro" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:9999;
">

    <div style="
    background:#fff;
    width:80%;
    max-width:900px;
    margin:50px auto;
    border-radius:12px;
    padding:20px;
    max-height:80vh;
    overflow:auto;
    ">

        <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:20px;
        ">

            <h2 id="tituloCentro"></h2>

            <button
                class="btn btn-dark-custom"
                onclick="fecharModalCentro()">
                Fechar
            </button>

        </div>

        <table>
            <thead>
                <tr>
                    <th>Material</th>
                    <th>Quantidade</th>
                </tr>
            </thead>

            <tbody id="tbodyCentro"></tbody>
        </table>

    </div>

</div>

<div class="filters">
    <input id="search" placeholder="Buscar material..." oninput="aplicar()">

    <input id="searchCodigo" placeholder="Buscar código..." oninput="aplicar()">

    <select id="fCluster" onchange="aplicar()">
        <option value="">Todos clusters</option>
    </select>

    <select id="fStatus" onchange="aplicar()">
        <option value="">Status</option>
        <option value="BAIXO">Baixo</option>
        <option value="OK">OK</option>
    </select>

    <select id="fDepos" onchange="aplicar()">
    <option value="">Todos depósitos</option>
    </select>

    <button class="btn btn-yellow" onclick="limparFiltro()">Limpar Filtros</button>
    </div>

<div class="table">
<table>
<thead>
<tr>
    <th>Código</th>
    <th>Material</th>
    <th>Centro</th>
    <th>Cluster</th>
    <th>Depósito</th>
    <th>Saldo</th>
    <th>Status</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwPe5hUMTqNdlbLAj3DhkgBeYlhwqb4p8AWfoRcO7XCoPXvUEbrzUQVVky2AZfqHPZr/exec";

let dados = [];
let filtrados = [];

let c1,c2,c3,c4;

let filtroClusterGrafico = "";
let filtroMaterialGrafico = "";
let filtroCentroGrafico = "";


function num(v){ return Number(v||0); }
function status(s){ return num(s) < 10 ? "BAIXO" : "OK"; }

function abrirModalCentro(centro, materiais){

    document.getElementById("tituloCentro").innerText =
        "Centro de Custo: " + centro;

    const tbody = document.getElementById("tbodyCentro");

    tbody.innerHTML = "";

    Object.entries(materiais)
        .sort((a,b)=>b[1]-a[1])
        .forEach(([material,qtd])=>{

            tbody.innerHTML += `
            <tr>
                <td>${material}</td>
                <td>${qtd}</td>
            </tr>`;
        });

    document.getElementById("modalCentro").style.display = "block";
}

function fecharModalCentro(){
    document.getElementById("modalCentro").style.display = "none";
}

async function load(){

    const res = await fetch(API_URL);
    const data = await res.json();

    dados = data.almoxarifado || [];
    filtrados = [...dados];

    preencherClusters();
    preencherDepositos();
    render();
    kpis();
    charts();
}

function preencherClusters(){

    const c = [...new Set(dados.map(i=>i.cluster))];
    const sel = document.getElementById("fCluster");

    c.forEach(x=>{
        const o=document.createElement("option");
        o.value=x;
        o.innerText=x;
        sel.appendChild(o);
    });
}

function preencherDepositos(){

    const depositos = [
        ...new Set(
            dados.map(i => i.deposito).filter(Boolean)
        )
    ];

    const sel = document.getElementById("fDepos");

    depositos.forEach(dep=>{
        const o = document.createElement("option");
        o.value = dep;
        o.innerText = dep;
        sel.appendChild(o);
    });
}

function aplicar(){

    const t = document.getElementById("search").value.toLowerCase();
    const codigo = document.getElementById("searchCodigo").value.toLowerCase();
    const cl = document.getElementById("fCluster").value;
    const st = document.getElementById("fStatus").value;
    const dep = document.getElementById("fDepos").value;

    filtrados = dados.filter(i=>{

        const okT = (i.material || "").toLowerCase().includes(t);
        const okD = dep ? (i.deposito || "") === dep : true;

        const okCodigo =
        String(i.codigo || i.cod || "")
        .toLowerCase()
        .includes(codigo);

        const okC = cl ? i.cluster === cl : true;
        const okS = st ? status(i.saldo) === st : true;

        const okGraficoCluster =
            filtroClusterGrafico ? (i.cluster || "") === filtroClusterGrafico : true;

        const okGraficoMaterial =
            filtroMaterialGrafico ? (i.material || "") === filtroMaterialGrafico : true;

        const okGraficoCentro =
            filtroCentroGrafico ? (i.centro || "") === filtroCentroGrafico : true;

        return okT &&
        okCodigo &&
        okC &&
        okD &&
        okS &&
        okGraficoCluster &&
        okGraficoMaterial &&
        okGraficoCentro;
    });

    render();
    kpis();
    charts();
}

function kpis(){

    document.getElementById("total").innerText = filtrados.length;

    const baixo = filtrados.filter(i=>num(i.saldo)<10).length;
    document.getElementById("baixo").innerText = baixo;

    const saldo = filtrados.reduce((a,b)=>a+num(b.saldo),0);
    document.getElementById("saldo").innerText = saldo;

    document.getElementById("clusters").innerText =
        new Set(filtrados.map(i=>i.cluster)).size;
}

function charts(){

    /* =======================
       1. CLUSTER (PIE)
    ======================= */
    const cluster = {};
    filtrados.forEach(i=>{
        const c = i.cluster || "Sem Info";
        cluster[c] = (cluster[c] || 0) + 1;
    });

    if(c1) c1.destroy();
    c1 = new Chart(document.getElementById("chartCluster"),{
        type:"pie",
        data:{
            labels:Object.keys(cluster),
            datasets:[{
                data:Object.values(cluster),
                backgroundColor:[
                    "#4f46e5",
                    "#7c3aed",
                    "#db2777",
                    "#f97316",
                    "#10b981"
                ]
            }]
        },
        options:{
            onClick:(event,elements)=>{
            if(!elements.length) return;

             const index = elements[0].index;
             const valor = Object.keys(cluster)[index];

             filtroClusterGrafico =
             filtroClusterGrafico === valor ? "" : valor;

    aplicar();
}
        }
    });

    /* =======================
       2. ESTOQUE (BAR)
    ======================= */
    const estoque = {};
    filtrados.forEach(i=>{
        const c = i.cluster || "Sem Info";
        estoque[c] = (estoque[c] || 0) + num(i.saldo);
    });

    if(c2) c2.destroy();
    c2 = new Chart(document.getElementById("chartStatus"),{
        type:"bar",
        data:{
            labels:Object.keys(estoque),
            datasets:[{
                label:"Estoque",
                data:Object.values(estoque),
                backgroundColor:"#4f46e5",
                borderRadius:8,
                maxBarThickness:48
            }]
        },
        options:{
            onClick:(event,elements)=>{
            if(!elements.length) return;

            const index = elements[0].index;
            const valor = Object.keys(estoque)[index];

            filtroClusterGrafico =
            filtroClusterGrafico === valor ? "" : valor;

             aplicar();
            }
        }
    });

    /* =======================
       3. MATERIAL (BAR HORIZONTAL)
    ======================= */
    const material = {};
    filtrados.forEach(i=>{
        const m = i.material || "Sem Info";
        material[m] = (material[m] || 0) + 1;
    });

    const top = Object.entries(material)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,10);

    if(c3) c3.destroy();

    c3 = new Chart(document.getElementById("chartMaterial"),{
        type:"bar",
        data:{
            labels:top.map(i=>i[0]),
            datasets:[{
                label:"Qtd de IDs",
                data:top.map(i=>i[1]),
                backgroundColor:"#7c3aed",
                borderColor:"#5b21b6",
                borderWidth:1,
                borderRadius:6
            }]
        },
        options:{
            indexAxis:'y',
            responsive:true,
            maintainAspectRatio:false,

            onClick:(event,elements)=>{
             if(!elements.length) return;

             const index = elements[0].index;
             const materialSelecionado = top[index][0];

             filtroMaterialGrafico =
             filtroMaterialGrafico === materialSelecionado
             ? ""
             : materialSelecionado;

             document.getElementById("search").value =
            filtroMaterialGrafico;

             aplicar();
          }
        }
    });

    /* =======================
   4. CENTRO DE CUSTO
======================= */

const centros = {};

filtrados.forEach(i => {
    const c = i.centro || "Sem Centro";
    centros[c] = (centros[c] || 0) + 1;
});

const centrosOrdenados = Object.entries(centros)
    .sort((a,b) => b[1] - a[1]);

if(c4) c4.destroy();

c4 = new Chart(document.getElementById("chartCentro"),{
    type:"bar",
    data:{
        labels: centrosOrdenados.map(i => i[0]),
        datasets:[{
            label:"Quantidade de Itens",
            data: centrosOrdenados.map(i => i[1]),
            backgroundColor:"#0f172a",
            borderRadius:6
        }]
    },
    options:{
        indexAxis:'y',
        responsive:true,
        maintainAspectRatio:false,

        onClick:(event,elements)=>{
            if(!elements.length) return;

            const index = elements[0].index;
            const centroSelecionado = centrosOrdenados[index][0];

            const materiais = {};

            dados
                .filter(i => (i.centro || "") === centroSelecionado)
                .forEach(i => {

                    const material = i.material || "Sem Material";

                    materiais[material] =
                        (materiais[material] || 0) + num(i.saldo);
                });

            const texto = Object.entries(materiais)
                .sort((a,b) => b[1] - a[1])
                .map(([material,qtd]) => `${material}: ${qtd}`)
                .join('\n');

            abrirModalCentro(
             centroSelecionado,
             materiais
            );

            filtroCentroGrafico =
            filtroCentroGrafico === centroSelecionado
            ? ""
            : centroSelecionado;

             aplicar();
        }
    }
});

}



function render(){

    const tb=document.getElementById("tbody");
    tb.innerHTML="";

    filtrados.forEach(i=>{

        const s = status(i.saldo);

        tb.innerHTML+=`
        <tr>
            <td>${i.codigo || i.cod || ""}</td>
            <td>${i.material || ""}</td>
            <td>${i.centro || ""}</td>
            <td>${i.cluster || ""}</td>
            <td>${i.deposito || ""}</td>
            <td>${num(i.saldo)}</td>
            <td class="${s==="BAIXO"?"low":"ok"}">${s}</td>
        </tr>`;
    });
}

function exportarExcel(){

    const ws=XLSX.utils.json_to_sheet(filtrados.map(i=>({
        Codigo:i.codigo,
        Material:i.material,
        Centro:i.centro,
        Cluster:i.cluster,
        Deposito:i.deposito,
        Saldo:num(i.saldo),
        Status:status(i.saldo)
    })));

    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"almox");
    XLSX.writeFile(wb,"almoxarifado.xlsx");
}

function limparFiltro(){

    document.getElementById("search").value = "";
    document.getElementById("searchCodigo").value = "";
    document.getElementById("fCluster").value = "";
    document.getElementById("fStatus").value = "";
    document.getElementById("fDepos").value = "";
    filtroCentroGrafico = "";
    filtroClusterGrafico = "";
    filtroMaterialGrafico = "";

    filtrados = [...dados];

    render();
    kpis();
    charts();
}

load();

</script>

</body>
</html>
