<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Almoxarifado</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

body{
    margin:0;
    font-family:'Orbitron', Arial, sans-serif;
    background:#f5f7fb;
    color:#111;
}

/* HEADER */
.header{
    background:#fff;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #ff7a00;
}

.header h1{
    margin:0;
    font-size:20px;
}

/* BOTÕES PADRÃO */
.header div{
    display:flex;
    gap:10px;
}

/* BOTÃO BASE */
.btn{
    border:none;
    padding:10px 14px;
    border-radius:6px;
    cursor:pointer;
    font-family:'Orbitron', sans-serif;
    transition:0.2s;
}

/* PRETO - VOLTAR */
.btn-dark-custom{
    background:#111;
    color:#fff;
}

.btn-dark-custom:hover{
    background:#333;
}

/* AMARELO - EXPORTAR */
.btn-yellow{
    background:#ffcc00;
    color:#111;
    font-weight:600;
}

.btn-yellow:hover{
    background:#ffd633;
}

/* KPIs */
.kpis{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    padding:20px;
}

.kpi{
    background:#fff;
    border:1px solid rgba(0,0,0,0.08);
    border-radius:12px;
    padding:18px;
}

.kpi h3{
    margin:0;
    font-size:14px;
}

.kpi p{
    font-size:28px;
    margin:10px 0 0;
    color:#ff7a00;
    font-weight:bold;
}

/* FILTER */
.filter{
    padding:0 20px 20px;
}

input{
    padding:10px;
    width:100%;
    max-width:300px;
    border:1px solid #ddd;
    border-radius:8px;
    font-family:'Orbitron', sans-serif;
}

/* CHART */
.chart{
    padding:20px;
    background:#fff;
    margin:20px;
    border-radius:12px;
    border:1px solid rgba(0,0,0,0.08);
}

/* TABLE */
.table{
    padding:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#111;
    color:#fff;
    padding:12px;
    text-align:left;
}

td{
    padding:12px;
    border-bottom:1px solid #eee;
}

.low{
    color:#ff3b30;
    font-weight:bold;
}

.ok{
    color:#2ecc71;
    font-weight:bold;
}

/* BACK BUTTON */
.back{
    padding: 15px 20px;
}

.back button{
    background: transparent;
    border: 1px solid #ff7a00;
    color: #ff7a00;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
}

.back button:hover{
    background:#ff7a00;
    color:#fff;
}

</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
    <h1>CONTROLE DE ALMOXARIFADO</h1>

    <div>
        <button class="btn btn-dark-custom" onclick="window.location.href='painel.html'">
            ← VOLTAR AO PAINEL
        </button>

        <button class="btn btn-yellow" onclick="exportarExcel()">
            EXPORTAR EXCEL
        </button>
    </div>
</div>

<!-- KPIs -->
<div class="kpis">

    <div class="kpi">
        <h3>Total Itens</h3>
        <p id="total">0</p>
    </div>

    <div class="kpi">
        <h3>Estoque Baixo</h3>
        <p id="baixo">0</p>
    </div>

    <div class="kpi">
        <h3>Saldo Total</h3>
        <p id="saldo">0</p>
    </div>

    <div class="kpi">
        <h3>Clusters</h3>
        <p id="clusters">0</p>
    </div>

</div>

<!-- FILTER -->
<div class="filter">
    <input id="search" onkeyup="filter()" placeholder="Buscar material...">
</div>

<!-- CHART -->
<div class="chart">
    <canvas id="chart"></canvas>
</div>

<!-- TABLE -->
<div class="table">
<table>
<thead>
<tr>
    <th>Material</th>
    <th>Cluster</th>
    <th>Depósito</th>
    <th>Saldo</th>
    <th>Status</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby-4fOy9HAEmCUMndlLrPWJC7Gq62K5kSd3VWlo3EHEcug_68A5Uyv8hzzbJHtxh0t-Ig/exec";

let chart;
let dadosGlobais = [];

function get(obj, key){
    return (obj[key] || obj[key.toLowerCase()] || "").toString();
}

async function load(){

    const res = await fetch(API_URL);
    const data = await res.json();

    const almox = data.almoxarifado || [];
    dadosGlobais = almox;

    document.getElementById("total").innerText = almox.length;

    const baixo = almox.filter(i =>
        Number(get(i,"saldo")) < 10
    ).length;
    document.getElementById("baixo").innerText = baixo;

    const saldo = almox.reduce((a,b)=>
        a + Number(get(b,"saldo") || 0)
    ,0);

    document.getElementById("saldo").innerText = saldo;

    const clusters = [...new Set(almox.map(i =>
        get(i,"cluster")
    ))];

    document.getElementById("clusters").innerText = clusters.length;

    renderTable(almox);

    const map = {};

    almox.forEach(i=>{
        const c = get(i,"cluster");
        const s = Number(get(i,"saldo") || 0);

        map[c] = (map[c] || 0) + s;
    });

    if(chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"),{
        type:"bar",
        data:{
            labels:Object.keys(map),
            datasets:[{
                data:Object.values(map),
                backgroundColor:"#ff7a00"
            }]
        },
        options:{
            plugins:{ legend:{ display:false } }
        }
    });
}

function renderTable(data){

    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    data.forEach(i=>{

        const material = get(i,"material");
        const cluster = get(i,"cluster");
        const deposito = get(i,"deposito");
        const saldo = Number(get(i,"saldo") || 0);

        tbody.innerHTML += `
        <tr>
            <td>${material}</td>
            <td>${cluster}</td>
            <td>${deposito}</td>
            <td>${saldo}</td>
            <td class="${saldo < 10 ? 'low' : 'ok'}">
                ${saldo < 10 ? 'Baixo' : 'OK'}
            </td>
        </tr>`;
    });
}

function filter(){

    const v = document.getElementById("search").value.toLowerCase();

    const filtrado = dadosGlobais.filter(i =>
        get(i,"material").toLowerCase().includes(v) ||
        get(i,"cluster").toLowerCase().includes(v) ||
        get(i,"codigo").toLowerCase().includes(v)
    );

    renderTable(filtrado);
}

function exportarExcel(){

    if(!dadosGlobais.length){
        alert("Nenhum dado para exportar");
        return;
    }

    const dados = dadosGlobais.map(i=>({
        Material: get(i,"material"),
        Cluster: get(i,"cluster"),
        Deposito: get(i,"deposito"),
        Saldo: Number(get(i,"saldo") || 0),
        Status: Number(get(i,"saldo") || 0) < 10 ? "Baixo" : "OK"
    }));

    const ws = XLSX.utils.json_to_sheet(dados);
    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, ws, "Almoxarifado");

    XLSX.writeFile(wb, "almoxarifado.xlsx");
}

load();

</script>

</body>
</html>
