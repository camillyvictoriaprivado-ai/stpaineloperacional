<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Dashboard</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
    --indigo:#4f46e5;
    --violet:#7c3aed;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    background:
        radial-gradient(circle at top left, rgba(124,58,237,.22), transparent 35%),
        radial-gradient(circle at bottom right, rgba(79,70,229,.45), transparent 40%),
        linear-gradient(135deg, #08111f, #0f1c31);
}

.box{
    width:100%;
    max-width:430px;
    padding:45px;
    border-radius:24px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 30px 80px rgba(0,0,0,.45);
}

h2{
    text-align:center;
    color:white;
    font-size:24px;
    font-weight:800;
    margin-bottom:8px;
}

p.sub{
    text-align:center;
    color:rgba(255,255,255,.55);
    font-size:13px;
    margin-bottom:26px;
}

input{
    width:100%;
    padding:15px 18px;
    margin-bottom:16px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.08);
    color:white;
    font-size:15px;
    font-family:'Inter',sans-serif;
    transition:.25s;
}

input::placeholder{ color:rgba(255,255,255,.55); }

input:focus{
    outline:none;
    background:rgba(255,255,255,.12);
    box-shadow:0 0 0 2px rgba(124,58,237,.55);
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg, var(--indigo), var(--violet));
    color:white;
    font-size:15px;
    font-weight:700;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    transition:.25s;
}

button:hover{ transform:translateY(-2px); box-shadow:0 15px 30px rgba(79,70,229,.4); }
button:active{ transform:scale(.98); }
button:disabled{ opacity:.6; cursor:not-allowed; transform:none; }

.msg{
    text-align:center;
    margin-top:15px;
    font-size:14px;
    font-weight:600;
    color:#fb7185;
}

.msg.ok{ color:#34d399; }

.footer{
    margin-top:25px;
    text-align:center;
    color:rgba(255,255,255,.45);
    font-size:12px;
}

.footer a{
    color:rgba(255,255,255,.75);
    font-weight:700;
    text-decoration:none;
}

.footer a:hover{ text-decoration:underline; }
</style>
</head>

<body>

<div class="box">

    <h2>Criar Conta</h2>
    <p class="sub">Seu acesso ficará pendente até ser aprovado pelo administrador.</p>

    <input type="text" id="nome" placeholder="Nome completo">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="senha" placeholder="Senha">
    <input type="password" id="confirmarSenha" placeholder="Confirmar senha">

    <button id="btnCadastrar" onclick="cadastrar()">Cadastrar</button>

    <div class="msg" id="msg"></div>

    <div class="footer">
        Já tem conta? <a href="index.html">Entrar</a>
    </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwPe5hUMTqNdlbLAj3DhkgBeYlhwqb4p8AWfoRcO7XCoPXvUEbrzUQVVky2AZfqHPZr/exec";

async function cadastrar(){

    const msg = document.getElementById("msg");
    const btn = document.getElementById("btnCadastrar");
    msg.className = "msg";
    msg.textContent = "";

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    const confirmarSenha = document.getElementById("confirmarSenha").value;

    if(!nome || !email || !senha || !confirmarSenha){
        msg.textContent = "Preencha todos os campos.";
        return;
    }

    if(senha !== confirmarSenha){
        msg.textContent = "As senhas não coincidem.";
        return;
    }

    if(senha.length < 6){
        msg.textContent = "A senha precisa ter no mínimo 6 caracteres.";
        return;
    }

    btn.disabled = true;
    btn.textContent = "Enviando...";

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "cadastrar", nome, email, senha })
        });

        const data = await res.json();

        if(data.ok){
            msg.className = "msg ok";
            msg.textContent = "Cadastro enviado! Aguarde a aprovação do administrador.";
            document.getElementById("nome").value = "";
            document.getElementById("email").value = "";
            document.getElementById("senha").value = "";
            document.getElementById("confirmarSenha").value = "";
        } else {
            msg.textContent = data.error || "Não foi possível concluir o cadastro.";
        }
    } catch (err) {
        console.error(err);
        msg.textContent = "Erro de conexão. Tente novamente.";
    } finally {
        btn.disabled = false;
        btn.textContent = "Cadastrar";
    }
}

</script>

</body>
</html>
