<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard Melhorias</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
    --indigo:#4f46e5;
    --violet:#7c3aed;
    --pink:#db2777;
    --orange:#f97316;
    --navy:#0f172a;
    --bg:#f1f5f9;
    --white:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --border-light:#f1f5f9;
}

body{
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
}

/* KPI CARDS */

.card-kpi{
    background:var(--white);

    border:1px solid var(--border-light);

    border-radius:20px;

    padding:10px;

    box-shadow:0 1px 2px rgba(15,23,42,.04);

    transition:.2s ease;
}

.card-kpi:hover{
    transform:translateY(-2px);

    box-shadow:0 10px 24px rgba(15,23,42,.08);

    border-color:transparent;
}

.kpi-value{
    font-size:30px;

    font-weight:900;

    color:var(--navy);
}

/* CHARTS */

.chart-card{
    background:var(--white);

    border:1px solid var(--border-light);

    border-radius:20px;

    padding:22px;

    box-shadow:0 1px 2px rgba(15,23,42,.04);
}

.chart-container{
    position:relative;
    height:320px;
}

canvas{
    max-height:100% !important;
}

/* TITULOS */

h2{
    color:var(--navy);
    font-weight:900;
}

h5{
    color:var(--navy);
    font-weight:800;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:8px;
}

h5::before{
    content:"";
    width:4px;
    height:14px;
    border-radius:4px;
    background:linear-gradient(180deg,var(--indigo),var(--violet));
    display:inline-block;
}

/* TABELAS */

.table{
    background:white;
    border-radius:12px;
    overflow:hidden;
}

.table thead th{
    background:var(--navy) !important;
    color:white;

    border:none;

    font-weight:700;

    font-size:12px;

    text-transform:uppercase;
    letter-spacing:.04em;
}

.table tbody td{
    vertical-align:middle;

    font-size:13px;
}

.table tbody tr{
    transition:.15s;
}

.table tbody tr:hover{
    background:rgba(79,70,229,.06);
}

/* BOTÕES */

.btn-dark{
    background:var(--bg);
    border:1px solid var(--border);

    color:var(--text);

    font-weight:700;
}

.btn-dark:hover{
    border-color:var(--indigo);
    color:var(--indigo);
}

.btn-warning{
    background:linear-gradient(135deg,var(--indigo),var(--violet));

    border:none;

    color:white;

    font-weight:700;

    box-shadow:0 4px 12px rgba(79,70,229,.25);
}

.btn-warning:hover{
    opacity:.92;
    color:white;
}

/* FILTROS E INPUTS */

.form-control,
.form-select{
    border:1px solid var(--border);

    border-radius:12px;

    padding:10px 14px;

    font-size:13px;
}

.form-control:focus,
.form-select:focus{
    border-color:var(--indigo);

    box-shadow:0 0 0 4px rgba(79,70,229,.12);
}

/* BADGES */

.badge{
    padding:8px 10px;
    border-radius:8px;
    font-weight:600;
}

/* SEÇÕES */

.section-card{
    background:white;

    border-radius:20px;

    padding:20px;

    border:1px solid var(--border-light);

    box-shadow:0 1px 2px rgba(15,23,42,.04);
}

/* RESPONSIVO */

@media(max-width:768px){

    .kpi-value{
        font-size:26px;
    }

    .chart-container{
        height:260px;
    }

}
</style>

</head>

<body>

<div class="container-fluid p-4">

<div class="d-flex align-items-center gap-3 mb-4">
    <div style="width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--orange),var(--indigo));color:white;font-weight:900;font-size:11px;">TLP</div>
    <h2 class="mb-0">Dashboard Melhorias (GPON / Rede)</h2>
</div>

<div class="d-flex justify-content-end gap-2 mb-3">
    <a href="painel.html" class="btn btn-dark px-4">← Voltar ao Painel</a>
    <button class="btn btn-warning px-4" onclick="exportarExcel()">Exportar Excel</button>
</div>

<!-- KPI -->
<div class="row g-3 mb-4">

    <div class="col-md-3">
        <div class="card card-kpi">
            <div class="card-body text-center">
                <div>Total</div>
                <div id="total" class="kpi-value">0</div>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card card-kpi">
            <div class="card-body text-center">
                <div>Executadas</div>
                <div id="executadas" class="kpi-value">0</div>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card card-kpi">
            <div class="card-body text-center">
                <div>Pendentes</div>
                <div id="pendentes" class="kpi-value">0</div>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card card-kpi">
            <div class="card-body text-center">
                <div>Campo</div>
                <div id="campo" class="kpi-value">0</div>
            </div>
        </div>
    </div>

</div>

</div>

<!-- GRÁFICOS -->
<div class="row g-4 mb-4">

<div class="col-lg-6">
<div class="card chart-card">
<h5>Empresa</h5>
<div class="chart-container">
<canvas id="empresaChart"></canvas>
</div>
</div>
</div>

<div class="col-lg-6">
<div class="card chart-card">
<h5>Armário</h5>
<div class="chart-container">
<canvas id="armarioChart"></canvas>
</div>
</div>
</div>

</div>

<div class="row g-4 mb-4">

<div class="col-lg-6">
<div class="card chart-card">
<h5>Status Campo</h5>
<div class="chart-container">
<canvas id="statusCampoChart"></canvas>
</div>
</div>
</div>

<div class="col-lg-6">
<div class="card chart-card">
<h5>Cluster</h5>
<div class="chart-container">
<canvas id="clusterChart"></canvas>
</div>
</div>
</div>

</div>

<div class="row g-4 mb-4">

<div class="col-lg-6">
<div class="card chart-card">
<h5>Custo Total por Cluster</h5>
<div class="chart-container">
<canvas id="custoChart"></canvas>
</div>
</div>
</div>

</div>

<!-- CONTROLES TABELA -->
<div class="d-flex gap-2 mb-3">

<select id="filtroCluster" class="form-select" style="max-width:250px" onchange="filtrarTabela()">
    <option value="">Todos os clusters</option>
</select>

<button class="btn btn-dark" onclick="ordenarCusto()">Ordenar por Custo ↓</button>
<button class="btn btn-warning" onclick="resetTabela()">Limpar Filtros</button>

</div>

<!-- TABELA -->
<div class="card chart-card">
<div class="card-body">

<h5 class="mb-3">Tabela</h5>

<div class="table-responsive">

<table class="table table-striped table-hover">

<thead>
<tr>
<th>ID Obra</th>
<th>Empresa</th>
<th>Cluster</th>
<th>Status Campo</th>
<th>Requisição</th>
<th>Custo Total</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

</div>

</div>
</div>

</div>

<script>

let dadosBase = [];
let dadosGlobais = [];
let ordemCusto = false;

let chartEmpresa;
let chartArmario;
let chartStatusCampo;
let chartCluster;
let chartCusto;

let filtroEmpresa = "";
let filtroArmario = "";
let filtroStatusCampo = "";
let filtroClusterGrafico = "";

const API_URL =
"https://script.google.com/macros/s/AKfycby-4fOy9HAEmCUMndlLrPWJC7Gq62K5kSd3VWlo3EHEcug_68A5Uyv8hzzbJHtxh0t-Ig/exec?type=melhorias";

function agrupar(lista, campo){
    const map = {};
    lista.forEach(i=>{
        const k = i[campo] || "Sem Info";
        map[k] = (map[k] || 0) + 1;
    });
    return map;
}

function parseCusto(v){
    return Number(String(v||"")
        .replace("R$","")
        .replace(/\./g,"")
        .replace(",",".")
    ) || 0;
}

async function carregar(){

    const res = await fetch(API_URL + "&cache=" + Date.now());
    const json = await res.json();

    const dados = json.melhorias || [];

    dadosBase = dados;
    dadosGlobais = dados;

    document.getElementById("total").innerText = dados.length;

    montarCards(dados);
    montarGraficos(dados);
    montarTabela(dados);
    popularFiltroCluster(dados);
}

function montarCards(dados){

    let exec = 0;
    let pend = 0;
    let campo = 0;

    dados.forEach(d => {

        const status =
            String(d["status campo"] || "")
            .trim()
            .toUpperCase();

        if(status.includes("EXEC")){
            exec++;
        } else {
            pend++;
        }

        if(status === "CAMPO"){
            campo++;
        }

    });

    document.getElementById("total").innerText = dados.length;
    document.getElementById("executadas").innerText = exec;
    document.getElementById("pendentes").innerText = pend;
    document.getElementById("campo").innerText = campo;
}

function montarGraficos(dados){

        if(chartEmpresa) chartEmpresa.destroy();
        if(chartArmario) chartArmario.destroy();
        if(chartStatusCampo) chartStatusCampo.destroy();
        if(chartCluster) chartCluster.destroy();
        if(chartCusto) chartCusto.destroy();

    // EMPRESA (PIE)
    const empresa = agrupar(dados,"empresa");
    chartEmpresa = new Chart(document.getElementById("empresaChart"),{
    type:"pie",
    data:{
        labels:Object.keys(empresa),
        datasets:[{
            data:Object.values(empresa),
            backgroundColor:[
                "#4f46e5",
                "#7c3aed",
                "#db2777",
                "#f97316",
                "#10b981",
                "#0f172a",
                "#0ea5e9"
            ]
        }]
    },
    options:{
        responsive:true,
        maintainAspectRatio:false,

        onClick:(evt,elements)=>{

            if(!elements.length) return;

            const index = elements[0].index;

            filtroEmpresa =
                Object.keys(empresa)[index];

            aplicarFiltrosGraficos();
        },

        plugins:{
            legend:{ position:"bottom" }
        }
    }
});

    // ARMÁRIO (BAR)
    // ARMÁRIO (BAR)
const armario = agrupar(dados,"armario");

chartArmario = new Chart(document.getElementById("armarioChart"), {
    type:"bar",
    data:{
        labels:Object.keys(armario),
        datasets:[{
            data:Object.values(armario),
            backgroundColor:"#4f46e5",
            borderRadius:6
        }]
    },
    options:{
        responsive:true,
        maintainAspectRatio:false,

        onClick:(evt,elements)=>{

            if(!elements.length) return;

            const valor =
                Object.keys(armario)[elements[0].index];

            filtroArmario =
                filtroArmario === valor ? "" : valor;

            aplicarFiltrosGraficos();
        },

        plugins:{
            legend:{display:false}
        }
    }
});

    // STATUS CAMPO (PIE)
    // STATUS CAMPO (PIE)
const status = agrupar(dados,"status campo");

chartStatusCampo = new Chart(
    document.getElementById("statusCampoChart"),
    {
        type:"pie",
        data:{
            labels:Object.keys(status),
            datasets:[{
                data:Object.values(status),
                backgroundColor:[
                    "#4f46e5",
                    "#7c3aed",
                    "#db2777",
                    "#f97316",
                    "#10b981",
                    "#0f172a"
                ]
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false,

            onClick:(evt,elements)=>{

                if(!elements.length) return;

                const valor =
                    Object.keys(status)[elements[0].index];

                filtroStatusCampo =
                    filtroStatusCampo === valor ? "" : valor;

                aplicarFiltrosGraficos();
            },

            plugins:{
                legend:{position:"bottom"}
            }
        }
    }
);

    // CLUSTER (BAR)
    // CLUSTER (BAR)
const cluster = agrupar(dados,"cluster");

chartCluster = new Chart(
    document.getElementById("clusterChart"),
    {
        type:"bar",
        data:{
            labels:Object.keys(cluster),
            datasets:[{
                data:Object.values(cluster),
                backgroundColor:"#0f172a",
                borderRadius:6
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false,

            onClick:(evt,elements)=>{

                if(!elements.length) return;

                const valor =
                    Object.keys(cluster)[elements[0].index];

                filtroClusterGrafico =
                    filtroClusterGrafico === valor ? "" : valor;

                aplicarFiltrosGraficos();
            },

            plugins:{
                legend:{display:false}
            },

            scales:{
                x:{
                    ticks:{
                        maxRotation:45,
                        minRotation:45
                    }
                }
            }
        }
    }
);

    // CUSTO TOTAL (BAR)
    // CUSTO TOTAL (BAR)

const custo = {};

dados.forEach(d=>{

    const k = d.cluster || "Sem Info";

    custo[k] =
        (custo[k] || 0) +
        parseCusto(d["custo total"]);
});

chartCusto = new Chart(
    document.getElementById("custoChart"),
    {
        type:"bar",
        data:{
            labels:Object.keys(custo),
            datasets:[{
                data:Object.values(custo),
                backgroundColor:"#f97316",
                borderRadius:6
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false,

            onClick:(evt,elements)=>{

                if(!elements.length) return;

                const valor =
                    Object.keys(custo)[elements[0].index];

                filtroClusterGrafico =
                    filtroClusterGrafico === valor ? "" : valor;

                aplicarFiltrosGraficos();
            },

            plugins:{
                legend:{display:false}
            },

            scales:{
                x:{
                    ticks:{
                        maxRotation:45,
                        minRotation:45
                    }
                }
            }
        }
    }
);
}

function montarTabela(dados){

    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    dados.forEach(d=>{
        tbody.innerHTML += `
        <tr>
            <td>${d["id obra"]||""}</td>
            <td>${d.empresa||""}</td>
            <td>${d.cluster||""}</td>
            <td>${d["status campo"]||""}</td>
            <td>${d.requicao||""}</td>
            <td>${d["custo total"]||""}</td>
        </tr>`;
    });
}

function popularFiltroCluster(dados){

    const select = document.getElementById("filtroCluster");
    const clusters = [...new Set(dados.map(d=>d.cluster||"Sem Info"))];

    clusters.forEach(c=>{
        const opt = document.createElement("option");
        opt.value = c;
        opt.innerText = c;
        select.appendChild(opt);
    });
}

function filtrarTabela(){
    aplicarFiltrosGraficos();
}

function ordenarCusto(){

    ordemCusto = !ordemCusto;

    const dados = [...dadosBase].sort((a,b)=>{
        return ordemCusto
            ? parseCusto(b["custo total"]) - parseCusto(a["custo total"])
            : parseCusto(a["custo total"]) - parseCusto(b["custo total"]);
    });

    montarTabela(dados);
}

function resetTabela(){

    filtroEmpresa = "";
    filtroArmario = "";
    filtroStatusCampo = "";
    filtroClusterGrafico = "";

    document.getElementById("filtroCluster").value = "";

    aplicarFiltrosGraficos();
}

function exportarExcel(){
    const ws = XLSX.utils.json_to_sheet(dadosGlobais);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "melhorias");
    XLSX.writeFile(wb, "melhorias.xlsx");
}

carregar();

function aplicarFiltrosGraficos(){

    let dados = [...dadosBase];

    if(filtroEmpresa){
        dados = dados.filter(i =>
            (i.empresa || "Sem Info") === filtroEmpresa
        );
    }

    if(filtroArmario){
        dados = dados.filter(i =>
            (i.armario || "Sem Info") === filtroArmario
        );
    }

    if(filtroStatusCampo){
        dados = dados.filter(i =>
            (i["status campo"] || "Sem Info") === filtroStatusCampo
        );
    }

    if(filtroClusterGrafico){
        dados = dados.filter(i =>
            (i.cluster || "Sem Info") === filtroClusterGrafico
        );
    }

    const clusterSelect =
        document.getElementById("filtroCluster").value;

    if(clusterSelect){
        dados = dados.filter(i =>
            (i.cluster || "Sem Info") === clusterSelect
        );
    }

    montarCards(dados);
    montarTabela(dados);
    montarGraficos(dados);
}

</script>

</body>
</html>
