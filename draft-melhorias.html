<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório Gerencial — Melhorias de Rede</title>

<script src="auth.js"></script>
<script>protegerPagina(["admin_sc", "usuario_sc"]);</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
    --navy:#0f172a;
    --navy-2:#1e293b;
    --navy-3:#334155;
    --blue:#3b82f6;
    --indigo:#6366f1;
    --violet:#8b5cf6;
    --pink:#ec4899;
    --orange:#f97316;
    --sky:#0ea5e9;
    --green:#10b981;
    --amber:#f59e0b;
    --red:#ef4444;
    --bg:#f1f5f9;
    --white:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --muted-2:#94a3b8;
    --border:#e2e8f0;
    --border-light:#f1f5f9;

    /* Paleta do site (painel.html) — usada no cabeçalho e botões */
    --primary:#4f46e5;
    --primary-dark:#4338ca;
    --secondary:#7c3aed;
    --accent:#db2777;
    --text-faint:#94a3b8;
}

*{ box-sizing:border-box; }

body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    opacity:0;
    transition:opacity .15s ease;
}

body.auth-ready{
    opacity:1;
}

.wrap{
    max-width:1440px;
    margin:0 auto;
    padding:24px 24px 32px;
}

/* HEADER — mesmo estilo do painel.html (fundo branco, título maiúsculo, botões gradiente) */
.header{
    height:75px;
    background:var(--white);
    border-bottom:1px solid var(--border-light);
    padding:0 30px;
    display:flex;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}
.header-inner{
    max-width:1440px;
    margin:0 auto;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
}
.logo-row{ display:flex; align-items:center; gap:12px; }
.title-main{
    color:var(--text);
    font-weight:900;
    font-size:16px;
    text-transform:uppercase;
    letter-spacing:.06em;
}
.title-main::before{
    content:"";
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    margin-right:10px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    vertical-align:middle;
}
.title-sub{ color:var(--text-faint); font-size:12px; margin-left:18px; margin-top:2px; }
.header-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.status-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
.status-line{ color:var(--text-faint); font-size:12px; display:flex; align-items:center; }
.btn-refresh{
    color:white;
    border:none;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    box-shadow:0 4px 14px rgba(79,70,229,.25);
    padding:10px 20px;
    border-radius:12px;
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.05em;
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    transition:.2s;
    text-decoration:none;
}
.btn-refresh:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(79,70,229,.35); color:white; }
.btn-refresh:active{ transform:scale(.98); }
.btn-refresh.btn-outline{
    background:var(--white);
    color:var(--text);
    border:1px solid var(--border);
    box-shadow:none;
}
.btn-refresh.btn-outline:hover{ border-color:var(--primary); color:var(--primary); box-shadow:none; transform:none; }
.spin{ animation:spin 1s linear infinite; }
@keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

/* KPI */
.kpi-bar{ display:flex; flex-wrap:wrap; gap:12px; }
.kpi-card{
    background:white;
    border-radius:16px;
    padding:16px 20px;
    border:1px solid var(--border);
    box-shadow:0 1px 3px rgba(15,23,42,.05);
    flex:1;
    min-width:140px;
    position:relative;
    overflow:hidden;
}
.kpi-card::before{
    content:"";
    position:absolute; top:0; left:0;
    width:3px; height:100%;
    border-radius:16px 0 0 16px;
    background:var(--accent,#6366f1);
}
.kpi-label{ font-size:11px; font-weight:700; color:var(--muted-2); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
.kpi-value{ font-size:28px; font-weight:900; color:var(--navy); letter-spacing:-.03em; }
.kpi-sub{ font-size:11px; color:var(--muted-2); margin-top:2px; }

/* STATUS BREAKDOWN (contabilização Campo / Draft / Medição) */
.status-breakdown-bar{ display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; }
.status-breakdown-card{
    background:white; border-radius:16px; padding:16px 20px; border:1px solid var(--border);
    box-shadow:0 1px 3px rgba(15,23,42,.05); flex:1; min-width:260px;
}
.status-breakdown-title{
    font-size:11px; font-weight:800; color:var(--navy); text-transform:uppercase;
    letter-spacing:.06em; margin-bottom:12px; display:flex; align-items:center; gap:8px;
}
.status-breakdown-title::before{
    content:""; width:3px; height:12px; border-radius:2px; background:var(--accent,#6366f1); display:inline-block;
}
.status-count-row{ display:flex; align-items:flex-start; gap:10px; padding:5px 0; }
.status-count-label{
    flex:0 0 40%; font-size:12px; color:#374151; font-weight:600;
    white-space:normal; overflow-wrap:break-word; word-break:break-word; line-height:1.3;
    padding-top:1px;
}
.status-count-track{ flex:1; height:6px; border-radius:3px; background:var(--border-light); overflow:hidden; margin-top:6px; align-self:flex-start; }
.status-count-fill{ height:100%; border-radius:3px; }
.status-count-val{ flex:0 0 28px; text-align:right; font-size:12px; font-weight:800; color:var(--navy); font-family:monospace; padding-top:1px; }

/* TABS */
.tabs{ display:flex; gap:4px; margin:24px 0 20px; border-bottom:1px solid var(--border); }
.tab-btn{
    padding:10px 20px;
    font-size:13px;
    font-weight:600;
    border:none;
    background:transparent;
    cursor:pointer;
    border-bottom:2px solid transparent;
    color:var(--muted);
    margin-bottom:-1px;
    font-family:inherit;
    transition:.15s;
}
.tab-btn.active{ color:var(--blue); border-bottom-color:var(--blue); }
.tab-content{ display:none; }
.tab-content.active{ display:block; }

/* BANNERS (fila) */
.banners{ display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
.banner{ border-radius:12px; padding:14px 20px; flex:1; min-width:160px; border:1px solid; }
.banner-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; display:flex; align-items:center; gap:4px; }
.banner-value{ font-size:32px; font-weight:900; letter-spacing:-.03em; }
.banner-sub{ font-size:11px; }
.banner.red{ background:#fef2f2; border-color:#fecaca; }
.banner.red .banner-label{ color:#dc2626; } .banner.red .banner-value{ color:#7f1d1d; } .banner.red .banner-sub{ color:#ef4444; }
.banner.amber{ background:#fffbeb; border-color:#fde68a; }
.banner.amber .banner-label{ color:#b45309; } .banner.amber .banner-value{ color:#78350f; } .banner.amber .banner-sub{ color:#f59e0b; }
.banner.green{ background:#f0fdf4; border-color:#bbf7d0; }
.banner.green .banner-label{ color:#15803d; } .banner.green .banner-value{ color:#14532d; } .banner.green .banner-sub{ color:#16a34a; }
.banner.blue{ background:#eff6ff; border-color:#bfdbfe; }
.banner.blue .banner-label{ color:#1d4ed8; } .banner.blue .banner-value{ color:#1e3a8a; } .banner.blue .banner-sub{ color:#3b82f6; }

/* FILTERS */
.filters-row{ display:flex; gap:8px; margin-bottom:16px; align-items:center; flex-wrap:wrap; }
.chip{
    padding:7px 16px; border-radius:8px; border:1px solid var(--border);
    font-size:12px; font-weight:700; cursor:pointer; background:white; color:#475569;
    transition:.15s; font-family:inherit;
}
.chip.active{ background:var(--navy); border-color:var(--navy); color:white; }
.search-input{
    margin-left:auto; padding:7px 14px; border-radius:8px; border:1px solid var(--border);
    font-size:12px; outline:none; width:260px; color:var(--navy); font-family:inherit;
}
.select-input{
    padding:8px 12px; border-radius:8px; border:1px solid var(--border);
    font-size:12px; outline:none; color:#374151; font-family:inherit; background:white;
}
.text-input{
    padding:8px 14px; border-radius:8px; border:1px solid var(--border);
    font-size:12px; width:240px; outline:none; font-family:inherit;
}
.btn-plain{
    padding:8px 14px; border-radius:8px; border:1px solid var(--border);
    font-size:12px; background:white; cursor:pointer; color:var(--muted); font-family:inherit;
}
.btn-dark{
    padding:8px 16px; border-radius:8px; border:none; font-size:12px; font-weight:700;
    background:var(--navy); color:white; cursor:pointer; display:flex; align-items:center; gap:6px; font-family:inherit;
}

/* TABLE CARD */
.table-card{ background:white; border-radius:16px; border:1px solid var(--border); overflow:hidden; box-shadow:0 1px 3px rgba(15,23,42,.04); }
table.data{ width:100%; border-collapse:collapse; font-size:13px; }
table.data thead tr{ background:var(--navy); }
table.data th{
    padding:10px 14px; text-align:left; font-size:11px; font-weight:700; color:var(--muted-2);
    text-transform:uppercase; letter-spacing:.05em; border-right:1px solid var(--navy-2); white-space:nowrap;
}
table.data th.sortable{ cursor:pointer; user-select:none; }
table.data td{ padding:10px 14px; border-bottom:1px solid var(--border-light); color:#374151; vertical-align:middle; }
table.data tbody tr:hover{ background:#eff6ff; }
.empty-msg{ text-align:center; padding:40px 0; color:var(--muted-2); font-size:13px; }

/* badges */
.badge{ border-radius:6px; padding:3px 8px; font-size:11px; font-weight:700; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
.badge-green{ background:#dcfce7; color:#15803d; }
.badge-amber{ background:#fef9c3; color:#a16207; }
.badge-red{ background:#fee2e2; color:#dc2626; }
.badge-blue{ background:#dbeafe; color:#1d4ed8; }
.badge-yellow{ background:#fef3c7; color:#b45309; }
.badge-gray{ background:#f1f5f9; color:#64748b; }

/* expand row */
.expand-row td{ padding:0 0 0 48px; background:#f8fafc; border-bottom:2px solid var(--border); }
.expand-inner{ padding:12px 20px 12px 0; }
.expand-title{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
.warn-box{ background:#fef9c3; border:1px solid #fde68a; border-radius:8px; padding:8px 14px; margin-bottom:10px; font-size:12px; color:#854d0e; }
table.mini{ width:100%; border-collapse:collapse; font-size:12px; }
table.mini th{ padding:6px 12px; text-align:left; font-size:10px; font-weight:700; color:var(--muted-2); text-transform:uppercase; letter-spacing:.05em; background:#f8fafc; }
table.mini td{ padding:8px 12px; color:#374151; vertical-align:middle; border-top:1px solid var(--border); }
.mono{ font-family:monospace; }

/* progress bar */
.progress-track{ height:6px; border-radius:3px; background:var(--border); width:60px; overflow:hidden; display:inline-block; vertical-align:middle; }
.progress-fill{ height:100%; transition:width .4s; }

/* charts grid */
.charts-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.chart-card{ background:white; border-radius:16px; padding:20px; border:1px solid var(--border); box-shadow:0 1px 3px rgba(15,23,42,.04); }
.chart-title{ font-size:12px; font-weight:800; color:var(--navy); text-transform:uppercase; letter-spacing:.06em; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.chart-title::before{ content:""; width:3px; height:14px; border-radius:2px; background:linear-gradient(180deg,var(--blue),var(--indigo)); display:inline-block; }
.chart-container{ position:relative; height:280px; }
.donut-wrap{ display:flex; align-items:center; gap:16px; height:220px; }
.donut-canvas-box{ flex-shrink:0; width:180px; height:180px; }
.donut-legend{ flex:1; display:flex; flex-direction:column; gap:6px; overflow:auto; max-height:220px; }
.legend-row{ display:flex; align-items:center; gap:8px; }
.legend-dot{ width:10px; height:10px; border-radius:2px; flex-shrink:0; }
.legend-name{ flex:1; font-size:12px; color:#374151; line-height:1.3; }
.legend-val{ font-size:12px; font-weight:700; color:var(--navy); font-family:monospace; }
.legend-pct{ font-size:10px; font-weight:700; border-radius:4px; padding:1px 5px; margin-left:6px; }

/* totals row */
.totals-row{ display:flex; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.total-chip{ background:#f8fafc; border-radius:8px; padding:8px 14px; border:1px solid var(--border); }
.total-chip .lbl{ font-size:10px; color:var(--muted-2); font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
.total-chip .val{ font-size:14px; font-weight:800; color:var(--navy); font-family:monospace; }

/* pagination */
.pagination{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-top:1px solid var(--border); background:#f8fafc; flex-wrap:wrap; gap:8px; }
.pag-info{ font-size:12px; color:var(--muted); }
.pag-btns{ display:flex; gap:4px; }
.pag-btn{
    padding:4px 10px; border-radius:6px; border:1px solid var(--border); font-size:12px;
    cursor:pointer; background:white; color:#374151; font-family:inherit;
}
.pag-btn.active{ background:var(--navy); border-color:var(--navy); color:white; font-weight:700; }
.pag-btn:disabled{ cursor:not-allowed; color:#cbd5e1; }

.loading-box, .error-box{ text-align:center; padding:80px 0; }
.loading-box{ color:var(--muted); }
.error-box{ color:var(--red); }

/* MODAL DE IMPORTAÇÃO */
.modal-overlay{
    position:fixed; inset:0; background:rgba(15,23,42,.55);
    display:flex; align-items:center; justify-content:center;
    z-index:1000; padding:20px;
}
.modal-box{
    background:white; border-radius:16px; width:100%; max-width:640px;
    max-height:85vh; overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px; border-bottom:1px solid var(--border);
}
.modal-title{ font-size:15px; font-weight:800; color:var(--navy); }
.modal-close{
    border:none; background:transparent; font-size:16px; color:var(--muted);
    cursor:pointer; padding:4px 8px; border-radius:6px;
}
.modal-close:hover{ background:var(--border-light); }
.modal-body{ padding:22px; overflow-y:auto; }
.modal-footer{
    display:flex; justify-content:flex-end; gap:10px;
    padding:16px 22px; border-top:1px solid var(--border); background:#f8fafc;
}
.drop-zone{
    border:2px dashed var(--border); border-radius:14px; padding:40px 20px;
    text-align:center; cursor:pointer; transition:.15s; color:var(--muted);
}
.drop-zone:hover, .drop-zone.dragover{ border-color:var(--blue); background:#eff6ff; }
.import-error{
    margin-top:14px; background:#fef2f2; border:1px solid #fecaca; color:#dc2626;
    border-radius:8px; padding:10px 14px; font-size:12px;
}
.import-summary{
    display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap;
}
.import-stat{
    background:#f8fafc; border:1px solid var(--border); border-radius:10px;
    padding:10px 16px; flex:1; min-width:120px;
}
.import-stat .lbl{ font-size:10px; color:var(--muted-2); font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
.import-stat .val{ font-size:20px; font-weight:900; color:var(--navy); }
.preview-table{ width:100%; border-collapse:collapse; font-size:11px; }
.preview-table th{
    background:#f1f5f9; padding:6px 8px; text-align:left; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; position:sticky; top:0;
}
.preview-table td{ padding:6px 8px; border-top:1px solid var(--border-light); white-space:nowrap; color:#374151; }
.preview-scroll{ max-height:220px; overflow:auto; border:1px solid var(--border); border-radius:10px; }
.import-progress{ text-align:center; padding:30px 0; }
.import-success{ text-align:center; padding:20px 0; color:#15803d; }
.import-fail{ text-align:center; padding:20px 0; color:#dc2626; }
.spinner{
    width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--blue);
    border-radius:50%; margin:0 auto 12px; animation:spin 0.8s linear infinite;
}

/* FORMULÁRIO DE INCLUSÃO */
.form-section-title{
    font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase;
    letter-spacing:.06em; margin:18px 0 10px; display:flex; align-items:center; gap:8px;
}
.form-section-title::before{
    content:""; width:3px; height:12px; border-radius:2px;
    background:linear-gradient(180deg,var(--primary),var(--secondary)); display:inline-block;
}
.form-section-title:first-child{ margin-top:0; }
.form-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.form-field{ display:flex; flex-direction:column; gap:4px; }
.form-field label{ font-size:11px; font-weight:700; color:var(--muted); }
.form-field.required label::after{ content:" *"; color:var(--red); }
.form-field input, .form-field select{
    padding:8px 12px; border-radius:8px; border:1px solid var(--border);
    font-size:13px; outline:none; font-family:inherit; color:var(--text); background:white;
}
.form-field input:focus, .form-field select:focus{
    border-color:var(--primary); box-shadow:0 0 0 3px rgba(79,70,229,.12);
}
.form-field input[readonly]{ background:#f8fafc; color:var(--muted); }

/* MODAL DE DETALHES (comentários e anexos) */
.id-obra-link{ cursor:pointer; text-decoration:underline; text-decoration-style:dotted; text-underline-offset:2px; }
.id-obra-link:hover{ color:var(--primary); }
.detalhe-section-title{
    font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase;
    letter-spacing:.06em; margin:20px 0 10px; display:flex; align-items:center; gap:8px;
}
.detalhe-section-title:first-child{ margin-top:0; }
.detalhe-section-title::before{
    content:""; width:3px; height:12px; border-radius:2px;
    background:linear-gradient(180deg,var(--primary),var(--secondary)); display:inline-block;
}
.comment-form{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
.comment-form input, .comment-form textarea{
    padding:8px 12px; border-radius:8px; border:1px solid var(--border);
    font-size:13px; outline:none; font-family:inherit; color:var(--text); background:white; resize:vertical;
}
.comment-form input:focus, .comment-form textarea:focus{ border-color:var(--primary); box-shadow:0 0 0 3px rgba(79,70,229,.12); }
.comment-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }
.comment-item{ background:#f8fafc; border:1px solid var(--border); border-radius:10px; padding:10px 14px; }
.comment-item-head{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:4px; }
.comment-item-name{ font-size:12px; font-weight:800; color:var(--navy); }
.comment-item-date{ font-size:10px; color:var(--muted-2); white-space:nowrap; }
.comment-item-text{ font-size:13px; color:#374151; white-space:pre-wrap; line-height:1.45; }
.comment-item-del{ border:none; background:transparent; color:var(--muted-2); cursor:pointer; font-size:11px; margin-top:6px; padding:0; }
.comment-item-del:hover{ color:var(--red); }
.empty-mini{ font-size:12px; color:var(--muted-2); padding:6px 0 14px; }

.attach-drop{
    border:2px dashed var(--border); border-radius:12px; padding:20px;
    text-align:center; cursor:pointer; transition:.15s; color:var(--muted); font-size:12px; margin-bottom:12px;
}
.attach-drop:hover{ border-color:var(--blue); background:#eff6ff; }
.attach-list{ display:flex; flex-direction:column; gap:6px; }
.attach-item{
    display:flex; align-items:center; gap:10px; background:#f8fafc; border:1px solid var(--border);
    border-radius:8px; padding:8px 12px;
}
.attach-item-icon{ font-size:16px; flex-shrink:0; }
.attach-item-name{ flex:1; font-size:12px; font-weight:600; color:#374151; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.attach-item-size{ font-size:10px; color:var(--muted-2); flex-shrink:0; }
.attach-item-actions{ display:flex; gap:6px; flex-shrink:0; }
.attach-item-actions button, .attach-item-actions a{
    border:none; background:transparent; cursor:pointer; font-size:12px; color:var(--muted); padding:2px 4px;
    text-decoration:none; display:inline-block;
}
.attach-item-actions button:hover, .attach-item-actions a:hover{ color:var(--primary); }

<script>
/* ==========================================================
   CONFIG
   ========================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycby-4fOy9HAEmCUMndlLrPWJC7Gq62K5kSd3VWlo3EHEcug_68A5Uyv8hzzbJHtxh0t-Ig/exec?type=melhorias";
// URL base do Apps Script (sem query string), usada pra montar as chamadas
// de comentários e anexos (type=comentarios / type=anexos).
const SCRIPT_EXEC_URL = API_URL.split("?")[0];

let dadosGlobais = [];
let loading = true;
let hasError = false;
let lastUpdate = null;
let activeTab = "fila";

/* Estado - Fila de Aprovação */
const filaState = { filter: "todos", search: "", expanded: new Set() };

/* Estado - Tabela Detalhada */
const tabelaState = {
    search: "", cluster: "", statusCampo: "", statusDraft: "",
    sortKey: null, sortAsc: true, page: 0, perPage: 30,
};

/* ==========================================================
   HELPERS
   ========================================================== */
function norm(s){
    return String(s || "").trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function normDisplay(s){
    return String(s || "Sem Info").trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function parseCusto(v){
    return Number(String(v || "").replace("R$", "").replace(/\./g, "").replace(",", ".").trim()) || 0;
}
// Tenta várias chaves possíveis para o mesmo valor (o backend pode nomear a coluna
// de formas diferentes: "valor mo" vs "custo mo", etc). Retorna a primeira que tiver valor.
function pickCusto(d, keys){
    for(const k of keys){
        const val = parseCusto(d[k]);
        if(val) return val;
    }
    return 0;
}
// Mapa: nome da coluna (usado em sort/exportação) -> lista de chaves possíveis no backend
const COST_FIELD_MAP = {
    "custo mo": ["valor mo", "custo mo"],
    "custo material": ["valor material", "custo material"],
    "custo total": ["valor total orcado", "custo total"],
};
function displayCusto(d, keys){
    const v = pickCusto(d, keys);
    return v ? fmtBRL(v) : "—";
}
function fmtBRL(v){
    return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function fmtBRLPlain(v){
    return "R$ " + v.toLocaleString("pt-BR", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function esc(v){
    return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function getCampoStatus(s){
    const n = norm(s);
    if (n === "CONCLUIDO" || n === "APROVADO") return "concluido";
    if (n.includes("EXECU")) return "execucao";
    return "pendente";
}
function getDraftStatus(s){
    const n = norm(s);
    if (n === "APROVADO") return "aprovado";
    if (n === "BLOQUEADO") return "bloqueado";
    return "pendente";
}
const CAMPO_BADGE = {
    concluido: { cls: "badge-green", label: "Concluído" },
    execucao: { cls: "badge-amber", label: "Em Execução" },
    pendente: { cls: "badge-red", label: "Pendente" },
};
const DRAFT_BADGE = {
    aprovado: { cls: "badge-blue", icon: "✓" },
    pendente: { cls: "badge-yellow", icon: "⏱" },
    bloqueado: { cls: "badge-red", icon: "✕" },
};
const COLORS = ["#3b82f6","#6366f1","#8b5cf6","#ec4899","#f97316","#10b981","#0ea5e9","#f59e0b","#ef4444"];
const DRAFT_COLORS = ["#10b981","#f59e0b","#ef4444","#6366f1","#3b82f6","#8b5cf6"];
// Paleta semântica do gráfico Status Campo: verde = concluído, amarelo = em execução, vermelho = pendente
const STATUS_CAMPO_COLOR_MAP = { CONCLUIDO:"#22c55e", APROVADO:"#22c55e", EXECUCAO:"#f5a623", PENDENTE:"#ef4444" };
function getStatusCampoColor(label){
    const n = norm(label);
    if(n === "CONCLUIDO" || n === "APROVADO") return STATUS_CAMPO_COLOR_MAP.CONCLUIDO;
    if(n.includes("EXECU")) return STATUS_CAMPO_COLOR_MAP.EXECUCAO;
    return STATUS_CAMPO_COLOR_MAP.PENDENTE;
}

/* ==========================================================
   FETCH
   ========================================================== */
function normalizeMelhoria(d){
    // A API pode devolver "id obra" e outros campos como number (JSON),
    // mas todo o app compara/usa esses valores como string (Set, .toLowerCase(), etc).
    // Sem essa normalização, comparações de tipo (number !== string) quebram
    // funcionalidades como abrir/fechar o ID Obra na Fila de Aprovação.
    const out = {};
    Object.keys(d).forEach(k => {
        const v = d[k];
        out[k] = (v === null || v === undefined) ? "" : String(v);
    });
    return out;
}

async function carregar(){
    loading = true;
    hasError = false;
    renderHeaderStatus();
    document.getElementById("refreshIcon").classList.add("spin");
    try{
        const res = await fetch(API_URL + "&cache=" + Date.now());
        const json = await res.json();
        dadosGlobais = (json.melhorias || []).map(normalizeMelhoria);
        lastUpdate = new Date();
    }catch(e){
        hasError = true;
    }finally{
        loading = false;
        document.getElementById("refreshIcon").classList.remove("spin");
        renderAll();
    }
}

/* ==========================================================
   RENDER: HEADER STATUS
   ========================================================== */
function renderHeaderStatus(){
    const el = document.getElementById("statusLine");
    if(!lastUpdate){ el.innerHTML = ""; return; }
    const dotColor = hasError ? "#ef4444" : "#10b981";
    const hora = lastUpdate.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" });
    el.innerHTML = `<span class="status-dot" style="background:${dotColor}"></span>Atualizado às ${hora}`;
}

/* ==========================================================
   RENDER: KPI BAR
   ========================================================== */
function renderKPIBar(){
    const dados = dadosGlobais;
    const total = dados.length;
    let campoConcluido=0, campoExecucao=0, campoPendente=0;
    let draftAprovado=0, draftPendente=0;
    let custoMO=0, custoMat=0, custoTotal=0;

    dados.forEach(d=>{
        const sc = norm(d["status campo"]);
        const sd = norm(d["status draft"]);
        if(sc==="CONCLUIDO"||sc==="APROVADO") campoConcluido++;
        else if(sc.includes("EXECU")) campoExecucao++;
        else campoPendente++;

        if(sd==="APROVADO") draftAprovado++;
        else if(sd==="PENDENTE"||sd==="") draftPendente++;

        custoMO += pickCusto(d, ["valor mo", "custo mo"]);
        custoMat += pickCusto(d, ["valor material", "custo material"]);
        custoTotal += pickCusto(d, ["valor total orcado", "custo total"]);
    });

    const cards = [
        { label:"Total Melhorias", value:total, accent:"#6366f1" },
        { label:"Campo Concluído", value:campoConcluido, sub:`${total?Math.round(campoConcluido/total*100):0}% do total`, accent:"#10b981" },
        { label:"Em Execução", value:campoExecucao, accent:"#f59e0b" },
        { label:"Custo MO", value:fmtBRL(custoMO), accent:"#8b5cf6" },
        { label:"Custo Material", value:fmtBRL(custoMat), accent:"#0ea5e9" },
        { label:"Custo Total", value:fmtBRL(custoTotal), accent:"#0f172a" },
    ];

    document.getElementById("kpiBar").innerHTML = cards.map(c => `
        <div class="kpi-card" style="--accent:${c.accent}">
            <div class="kpi-label">${c.label}</div>
            <div class="kpi-value" style="filter:${loading?'blur(4px)':'none'}">${c.value}</div>
            ${c.sub ? `<div class="kpi-sub">${c.sub}</div>` : ""}
        </div>
    `).join("");
}

/* ==========================================================
   RENDER: CONTABILIZAÇÃO POR STATUS (Campo / Draft / Medição)
   ========================================================== */
const STATUS_BREAKDOWN_FIELDS = [
    { key:"status campo", title:"Status Campo", accent:"#ef4444" },
    { key:"status draft", title:"Status Draft", accent:"#3b82f6" },
    { key:"status medicao", title:"Status Medição", accent:"#f97316" },
];

function renderStatusBreakdown(){
    const dados = dadosGlobais;
    const total = dados.length;

    const html = STATUS_BREAKDOWN_FIELDS.map(f => {
        const counts = new Map();
        dados.forEach(d => {
            const raw = (d[f.key] || "").toString().trim();
            const label = raw || "Sem Status";
            counts.set(label, (counts.get(label) || 0) + 1);
        });
        const rows = [...counts.entries()].sort((a,b) => b[1]-a[1]);

        const rowsHtml = rows.map(([label, count]) => {
            const pct = total ? Math.round(count/total*100) : 0;
            return `
            <div class="status-count-row">
                <div class="status-count-label" title="${esc(label)}">${esc(label)}</div>
                <div class="status-count-track"><div class="status-count-fill" style="width:${pct}%;background:${f.accent};"></div></div>
                <div class="status-count-val">${count}</div>
            </div>`;
        }).join("");

        return `
        <div class="status-breakdown-card" style="--accent:${f.accent}">
            <div class="status-breakdown-title">${f.title}</div>
            ${rowsHtml || '<div style="font-size:12px;color:var(--muted-2);padding:8px 0;">Sem dados</div>'}
        </div>`;
    }).join("");

    document.getElementById("statusBreakdown").innerHTML = html;
}

/* ==========================================================
   RENDER: CUSTOS — STATUS MEDIÇÃO = APROVADO HQ (por Cluster / Primária)
   ========================================================== */
function renderAprovadoHqCusto(){
    const dadosAprovadoHQ = dadosGlobais.filter(d => norm(d["status medicao"]) === "APROVADO HQ");
    // "Resumo" considera todos os registros, independente do status (Campo/Draft/Medição)
    const dadosTodos = dadosGlobais;

    function agruparCustoOriginal(list, key){
        const map = new Map();
        list.forEach(d => {
            const label = (d[key] || "").toString().trim() || "Sem Info";
            if(!map.has(label)) map.set(label, { orcado:0, medido:0 });
            const g = map.get(label);
            g.orcado += parseCusto(d["valor total orcado"]);
            g.medido += parseCusto(d["valor total medido"]);
        });
        return [...map.entries()].map(([label, v]) => ({ label, ...v })).sort((a,b) => b.medido - a.medido);
    }

    function tabelaHtmlOriginal(titulo, rows, colLabel){
        const totalOrcado = rows.reduce((s,r)=>s+r.orcado,0);
        const totalMedido = rows.reduce((s,r)=>s+r.medido,0);
        const bodyRows = rows.length ? rows.map(r => `
            <tr>
                <td>${esc(r.label)}</td>
                <td class="mono" style="text-align:right;">${fmtBRL(r.orcado)}</td>
                <td class="mono" style="text-align:right;font-weight:700;">${fmtBRL(r.medido)}</td>
            </tr>`).join("") : `<tr><td colspan="3" style="text-align:center;color:var(--muted-2);padding:16px;">Sem dados</td></tr>`;
        return `
        <div class="table-card">
            <div style="padding:16px 20px 0;font-size:11px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px;">
                <span style="width:3px;height:12px;border-radius:2px;background:#f97316;display:inline-block;"></span>
                ${titulo} — Aprovado HQ
            </div>
            <div style="max-height:340px;overflow:auto;margin-top:12px;">
                <table class="data">
                    <thead>
                        <tr>
                            <th>${colLabel}</th>
                            <th style="text-align:right;">Valor Total Orçado</th>
                            <th style="text-align:right;">Valor Total Medido</th>
                        </tr>
                    </thead>
                    <tbody style="filter:${loading?'blur(4px)':'none'}">${bodyRows}</tbody>
                    <tfoot>
                        <tr style="background:#f8fafc;font-weight:800;">
                            <td>Total</td>
                            <td class="mono" style="text-align:right;">${fmtBRL(totalOrcado)}</td>
                            <td class="mono" style="text-align:right;">${fmtBRL(totalMedido)}</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>`;
    }

    function agruparCustoResumo(list, key){
        const map = new Map();
        list.forEach(d => {
            const label = (d[key] || "").toString().trim() || "Sem Info";
            if(!map.has(label)) map.set(label, { orcado:0, medido:0, faturado:0 });
            const g = map.get(label);
            g.orcado += parseCusto(d["valor total orcado"]);
            g.medido += parseCusto(d["valor total medido"]);
            g.faturado += parseCusto(d["valor faturado total"]);
        });
        return [...map.entries()].map(([label, v]) => ({ label, ...v })).sort((a,b) => b.faturado - a.faturado);
    }

    function tabelaHtmlResumo(titulo, rows, colLabel){
        const totalOrcado = rows.reduce((s,r)=>s+r.orcado,0);
        const totalMedido = rows.reduce((s,r)=>s+r.medido,0);
        const totalFaturado = rows.reduce((s,r)=>s+r.faturado,0);
        const bodyRows = rows.length ? rows.map(r => `
            <tr>
                <td>${esc(r.label)}</td>
                <td class="mono" style="text-align:right;">${fmtBRL(r.orcado)}</td>
                <td class="mono" style="text-align:right;">${fmtBRL(r.medido)}</td>
                <td class="mono" style="text-align:right;font-weight:700;">${fmtBRL(r.faturado)}</td>
            </tr>`).join("") : `<tr><td colspan="4" style="text-align:center;color:var(--muted-2);padding:16px;">Sem dados</td></tr>`;
        return `
        <div class="table-card">
            <div style="padding:16px 20px 0;font-size:11px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px;">
                <span style="width:3px;height:12px;border-radius:2px;background:#f97316;display:inline-block;"></span>
                ${titulo}
            </div>
            <div style="max-height:340px;overflow:auto;margin-top:12px;">
                <table class="data">
                    <thead>
                        <tr>
                            <th>${colLabel}</th>
                            <th style="text-align:right;">Valor Total Orçado</th>
                            <th style="text-align:right;">Valor Total Medido</th>
                            <th style="text-align:right;">Valor Faturado Total</th>
                        </tr>
                    </thead>
                    <tbody style="filter:${loading?'blur(4px)':'none'}">${bodyRows}</tbody>
                    <tfoot>
                        <tr style="background:#f8fafc;font-weight:800;">
                            <td>Total</td>
                            <td class="mono" style="text-align:right;">${fmtBRL(totalOrcado)}</td>
                            <td class="mono" style="text-align:right;">${fmtBRL(totalMedido)}</td>
                            <td class="mono" style="text-align:right;">${fmtBRL(totalFaturado)}</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>`;
    }

    const porClusterOriginal = agruparCustoOriginal(dadosAprovadoHQ, "cluster");
    const porClusterResumo = agruparCustoResumo(dadosTodos, "cluster");

    document.getElementById("aprovadoHqBar").innerHTML =
        tabelaHtmlOriginal("Valor Medido", porClusterOriginal, "Cluster") +
        tabelaHtmlResumo("Resumo", porClusterResumo, "Cluster");
}

/* ==========================================================
   TAB SWITCH
   ========================================================== */
function switchTab(tab){
    activeTab = tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab===tab));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    document.getElementById("tab" + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add("active");
    renderActiveTab();
}

function renderActiveTab(){
    if(activeTab==="fila") renderFila();
    else if(activeTab==="graficos") renderGraficos();
    else if(activeTab==="tabela") renderTabela();
}

/* ==========================================================
   RENDER: STATUS AREA (loading / error)
   ========================================================== */
function renderStatusArea(){
    const el = document.getElementById("statusArea");
    if(loading && dadosGlobais.length===0){
        el.innerHTML = `<div class="loading-box"><div style="font-size:14px;">Carregando dados...</div></div>`;
        document.querySelectorAll(".tab-content").forEach(c=>c.innerHTML="");
        return true;
    }
    if(hasError && dadosGlobais.length===0){
        el.innerHTML = `<div class="error-box"><div style="font-size:14px;font-weight:600;">Erro ao conectar com a fonte de dados</div><div style="font-size:13px;color:var(--muted);margin-top:4px;">Verifique a URL e tente novamente</div></div>`;
        document.querySelectorAll(".tab-content").forEach(c=>c.innerHTML="");
        return true;
    }
    el.innerHTML = "";
    return false;
}

function renderAll(){
    renderHeaderStatus();
    renderKPIBar();
    renderStatusBreakdown();
    renderAprovadoHqCusto();
    const blocked = renderStatusArea();
    if(!blocked) renderActiveTab();
}

/* ==========================================================
   FILA DE APROVAÇÃO
   ========================================================== */
function buildObras(dados){
    const map = new Map();
    dados.forEach(d=>{
        const id = d["id obra"] || "SEM_ID";
        if(!map.has(id)) map.set(id, []);
        map.get(id).push(d);
    });

    return Array.from(map.entries()).map(([id, armarios])=>{
        const campoStatuses = armarios.map(a=>getCampoStatus(a["status campo"]));
        const campoOk = campoStatuses.every(s=>s==="concluido");
        const aprovadosCount = campoStatuses.filter(s=>s==="concluido").length;
        const pendingArmarios = armarios.filter(a=>getCampoStatus(a["status campo"])!=="concluido").map(a=>a.armario||"?");
        const canAdvanceDraft = campoOk;
        const draftStatusRaw = (armarios[0] && armarios[0]["status draft"]) || "";
        const draftStatus = getDraftStatus(draftStatusRaw);
        const cluster = (armarios[0] && armarios[0].cluster) || "";
        const primarias = (armarios[0] && armarios[0].primarias) || "";
        const totalCusto = armarios.reduce((s,a)=>s+pickCusto(a, COST_FIELD_MAP["custo total"]),0);
        return { id, armarios, campoOk, canAdvanceDraft, draftStatus, draftStatusRaw, cluster, primarias, totalCusto, pendingArmarios, aprovadosCount };
    });
}

function renderFila(){
    const obras = buildObras(dadosGlobais);

    const counts = {
        prontos: obras.filter(o=>o.canAdvanceDraft && o.draftStatus==="pendente").length,
        bloqueados: obras.filter(o=>!o.canAdvanceDraft).length,
        parciais: obras.filter(o=>o.aprovadosCount>0 && !o.canAdvanceDraft).length,
    };

    let list = obras;
    if(filaState.filter==="prontos") list = list.filter(o=>o.canAdvanceDraft && o.draftStatus==="pendente");
    else if(filaState.filter==="bloqueados") list = list.filter(o=>!o.canAdvanceDraft);
    else if(filaState.filter==="parciais") list = list.filter(o=>o.aprovadosCount>0 && !o.canAdvanceDraft);

    if(filaState.search.trim()){
        const s = filaState.search.trim().toLowerCase();
        list = list.filter(o =>
            o.id.toLowerCase().includes(s) ||
            o.cluster.toLowerCase().includes(s) ||
            o.primarias.toLowerCase().includes(s)
        );
    }

    list = [...list].sort((a,b)=>{
        const priority = o => {
            if(!o.canAdvanceDraft && o.aprovadosCount>0) return 0;
            if(!o.canAdvanceDraft) return 1;
            if(o.canAdvanceDraft && o.draftStatus==="pendente") return 2;
            return 3;
        };
        return priority(a) - priority(b);
    });

    const html = `
    <div class="banners">
        <div class="banner red">
            <div class="banner-label">⚠ Bloqueados (campo incompleto)</div>
            <div class="banner-value">${counts.bloqueados}</div>
            <div class="banner-sub">ID OBRAs com armários pendentes</div>
        </div>
        <div class="banner amber">
            <div class="banner-label">⏱ Parcialmente aprovados</div>
            <div class="banner-value">${counts.parciais}</div>
            <div class="banner-sub">Alguns armários aprovados mas não todos</div>
        </div>
        <div class="banner green">
            <div class="banner-label">✓ Prontos p/ avançar Draft</div>
            <div class="banner-value">${counts.prontos}</div>
            <div class="banner-sub">Campo 100% — Draft aguardando</div>
        </div>
        <div class="banner blue">
            <div class="banner-label">Total ID OBRAs</div>
            <div class="banner-value">${obras.length}</div>
            <div class="banner-sub">${dadosGlobais.length} splitter-armários no total</div>
        </div>
    </div>

    <div class="filters-row">
        <button class="chip ${filaState.filter==='todos'?'active':''}" onclick="setFilaFilter('todos')">Todos</button>
        <button class="chip ${filaState.filter==='bloqueados'?'active':''}" onclick="setFilaFilter('bloqueados')">Bloqueados (${counts.bloqueados})</button>
        <button class="chip ${filaState.filter==='parciais'?'active':''}" onclick="setFilaFilter('parciais')">Parciais (${counts.parciais})</button>
        <button class="chip ${filaState.filter==='prontos'?'active':''}" onclick="setFilaFilter('prontos')">Prontos (${counts.prontos})</button>
        <input class="search-input" id="filaSearch" placeholder="Buscar ID Obra, Cluster, Primária..." value="${esc(filaState.search)}" oninput="setFilaSearch(this.value)">
    </div>

    <div class="table-card">
        <div style="overflow-x:auto;">
        <table class="data">
            <thead>
                <tr>
                    <th></th>
                    <th>ID Obra</th>
                    <th>Cluster</th>
                    <th>Primárias</th>
                    <th>Armários</th>
                    <th>Campo ✓</th>
                    <th>Status Draft</th>
                    <th>Pode Avançar?</th>
                    <th style="text-align:right;">Custo Total</th>
                </tr>
            </thead>
            <tbody>
                ${list.map((o,idx)=>renderObraRows(o, idx)).join("")}
            </tbody>
        </table>
        </div>
        ${list.length===0 ? '<div class="empty-msg">Nenhum ID Obra encontrado com esses filtros.</div>' : ''}
    </div>
    <div class="footer-note">Exibindo ${list.length} de ${obras.length} ID OBRAs</div>
    `;

    document.getElementById("tabFila").innerHTML = html;
}

function renderObraRows(o, idx){
    const isExp = filaState.expanded.has(o.id);
    const rowBg = idx % 2 === 0 ? "white" : "#fafafa";
    const alertBg = (!o.canAdvanceDraft && o.aprovadosCount>0) ? "#fffbeb"
        : (!o.canAdvanceDraft) ? "#fff5f5"
        : (o.draftStatus==="pendente") ? "#f0fdf4"
        : rowBg;

    const db = DRAFT_BADGE[o.draftStatus];
    const pct = (o.aprovadosCount / o.armarios.length) * 100;
    const barColor = o.campoOk ? "#10b981" : "#f59e0b";

    const mainRow = `
    <tr style="background:${alertBg};cursor:pointer;" onclick="toggleObra('${esc(o.id)}')">
        <td style="width:32px;color:var(--muted-2);">${isExp ? "▾" : "▸"}</td>
        <td style="font-weight:700;color:var(--navy);font-family:monospace;font-size:12px;"><span class="id-obra-link" onclick="event.stopPropagation();openDetalheModal('${esc(o.id)}')" title="Ver comentários e anexos">${esc(o.id)}</span></td>
        <td>${o.cluster || '<span style="color:var(--muted-2);">—</span>'}</td>
        <td>${o.primarias || '<span style="color:var(--muted-2);">—</span>'}</td>
        <td><span style="font-weight:700;color:var(--blue);">${o.armarios.length}</span><span style="color:var(--muted-2);font-size:11px;"> armários</span></td>
        <td>
            <span class="progress-track"><span class="progress-fill" style="width:${pct}%;background:${barColor};"></span></span>
            <span style="font-size:11px;color:#475569;font-weight:600;margin-left:6px;">${o.aprovadosCount}/${o.armarios.length}</span>
        </td>
        <td><span class="badge ${db.cls}">${db.icon} ${esc(o.draftStatusRaw || "Sem Status")}</span></td>
        <td>
            ${o.canAdvanceDraft
                ? `<span style="color:#15803d;font-weight:700;font-size:12px;">✓ Sim</span>`
                : `<span style="color:#dc2626;font-weight:700;font-size:12px;">✕ Não${o.pendingArmarios.length ? ` <span style="color:var(--muted-2);font-weight:400;">(${o.pendingArmarios.length} pendente${o.pendingArmarios.length>1?"s":""})</span>` : ""}</span>`
            }
        </td>
        <td style="text-align:right;font-family:monospace;font-size:12px;font-weight:700;color:var(--navy);">${o.totalCusto>0 ? fmtBRL(o.totalCusto) : '<span style="color:var(--muted-2);">—</span>'}</td>
    </tr>`;

    if(!isExp) return mainRow;

    const miniRows = o.armarios.map(a=>{
        const cs = getCampoStatus(a["status campo"]);
        const ds = getDraftStatus(a["status draft"]);
        const cb = CAMPO_BADGE[cs];
        const db2 = DRAFT_BADGE[ds];
        return `
        <tr>
            <td class="mono" style="font-weight:700;">${esc(a.armario || "—")}</td>
            <td class="mono">${esc(a.primarias || "—")}</td>
            <td>${esc(a.empresa || "—")}</td>
            <td><span class="badge ${cb.cls}">${cb.label}</span></td>
            <td><span class="badge ${db2.cls}">${db2.icon} ${esc(a["status draft"] || "—")}</span></td>
            <td><span style="font-size:11px;font-weight:600;color:#475569;">${esc(a["status medicao"] || "—")}</span></td>
            <td class="mono">${displayCusto(a, COST_FIELD_MAP["custo mo"])}</td>
            <td class="mono">${displayCusto(a, COST_FIELD_MAP["custo material"])}</td>
            <td class="mono" style="text-align:right;font-weight:700;">${displayCusto(a, COST_FIELD_MAP["custo total"])}</td>
        </tr>`;
    }).join("");

    const expandRow = `
    <tr class="expand-row">
        <td colspan="9">
            <div class="expand-inner">
                <div class="expand-title">Splitter-Armários do ID ${esc(o.id)}</div>
                ${o.pendingArmarios.length ? `<div class="warn-box">⚠ <strong>Armários bloqueando avanço:</strong> ${esc(o.pendingArmarios.join(", "))}</div>` : ""}
                <table class="mini">
                    <thead>
                        <tr>
                            <th>Armário</th><th>Primárias</th><th>Empresa</th><th>Status Campo</th><th>Status Draft</th>
                            <th>Status Medição</th><th>Custo MO</th><th>Custo Material</th><th style="text-align:right;">Custo Total</th>
                        </tr>
                    </thead>
                    <tbody>${miniRows}</tbody>
                </table>
            </div>
        </td>
    </tr>`;

    return mainRow + expandRow;
}

function setFilaFilter(f){ filaState.filter = f; renderFila(); }
function setFilaSearch(v){
    filaState.search = v;
    renderFila();
    const el = document.getElementById("filaSearch");
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
function toggleObra(id){
    if(filaState.expanded.has(id)) filaState.expanded.delete(id);
    else filaState.expanded.add(id);
    renderFila();
}

let chartInstances = {};

function agrupar(dados, campo){
    const map = {};
    dados.forEach(d=>{
        const k = normDisplay(d[campo]);
        map[k] = (map[k]||0)+1;
    });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([name,value])=>({name,value}));
}

function renderGraficos(){
    const dados = dadosGlobais;

    const statusCampo = agrupar(dados, "status campo");
    const statusDraft = agrupar(dados, "status draft");
    const clusters = agrupar(dados, "cluster");

    const custoMap = {};
    dados.forEach(d=>{
        const k = normDisplay(d.cluster);
        if(!custoMap[k]) custoMap[k] = { mo:0, mat:0, total:0 };
        custoMap[k].mo += pickCusto(d, COST_FIELD_MAP["custo mo"]);
        custoMap[k].mat += pickCusto(d, COST_FIELD_MAP["custo material"]);
        custoMap[k].total += pickCusto(d, COST_FIELD_MAP["custo total"]);
    });
    const custoPorCluster = Object.entries(custoMap).sort((a,b)=>b[1].total-a[1].total).map(([name,v])=>({name,...v}));

    document.getElementById("tabGraficos").innerHTML = `
    <div class="charts-grid">
        <div class="chart-card">
            <div class="chart-title">Status Campo</div>
            <div class="donut-wrap">
                <div class="donut-canvas-box"><canvas id="chartStatusCampo"></canvas></div>
                <div class="donut-legend" id="legendStatusCampo"></div>
            </div>
        </div>
        <div class="chart-card">
            <div class="chart-title">Status Draft</div>
            <div class="donut-wrap">
                <div class="donut-canvas-box"><canvas id="chartStatusDraft"></canvas></div>
                <div class="donut-legend" id="legendStatusDraft"></div>
            </div>
        </div>
        <div class="chart-card">
            <div class="chart-title">Armários em Fila — por Status Campo</div>
            <div class="chart-container"><canvas id="chartFilaCampo"></canvas></div>
        </div>
        <div class="chart-card">
            <div class="chart-title">Armários em Fila — por Status Draft</div>
            <div class="chart-container"><canvas id="chartFilaDraft"></canvas></div>
        </div>
        <div class="chart-card">
            <div class="chart-title">Custo Total por Cluster</div>
            <div class="chart-container"><canvas id="chartCustoCluster"></canvas></div>
        </div>
        <div class="chart-card">
            <div class="chart-title">Quantidade por Cluster</div>
            <div class="chart-container"><canvas id="chartQtdCluster"></canvas></div>
        </div>
    </div>
    `;

    Object.values(chartInstances).forEach(c => c && c.destroy());
    chartInstances = {};

    const statusCampoColors = statusCampo.map(d => getStatusCampoColor(d.name));
    chartInstances.statusCampo = renderDonut("chartStatusCampo", "legendStatusCampo", statusCampo, statusCampoColors);
    chartInstances.statusDraft = renderDonut("chartStatusDraft", "legendStatusDraft", statusDraft, DRAFT_COLORS);
    chartInstances.filaCampo = renderHBar("chartFilaCampo", statusCampo, statusCampoColors);
    chartInstances.filaDraft = renderHBar("chartFilaDraft", statusDraft, DRAFT_COLORS);
    chartInstances.custoCluster = renderCustoStacked("chartCustoCluster", custoPorCluster);
    chartInstances.qtdCluster = renderHBar("chartQtdCluster", clusters, ["#6366f1"], true);
}

function renderDonut(canvasId, legendId, data, colors){
    const total = data.reduce((s,d)=>s+d.value,0);
    const ctx = document.getElementById(canvasId);
    const chart = new Chart(ctx, {
        type: "doughnut",
        data: {
            labels: data.map(d=>d.name),
            datasets: [{ data: data.map(d=>d.value), backgroundColor: data.map((_,i)=>colors[i%colors.length]), borderWidth:0 }]
        },
        options: {
            responsive: true, maintainAspectRatio: false, cutout: "62%",
            plugins: {
                legend: { display:false },
                tooltip: { callbacks: { label: c => `${c.label}: ${c.parsed} registros — ${total?((c.parsed/total)*100).toFixed(1):0}%` } }
            }
        }
    });

    document.getElementById(legendId).innerHTML = data.map((d,i)=>{
        const pct = total ? ((d.value/total)*100).toFixed(1) : "0";
        const color = colors[i%colors.length];
        return `
        <div class="legend-row">
            <div class="legend-dot" style="background:${color}"></div>
            <div class="legend-name">${esc(d.name)}</div>
            <span class="legend-val">${d.value}</span>
            <span class="legend-pct" style="background:${color}22;color:${color};">${pct}%</span>
        </div>`;
    }).join("");

    return chart;
}

function renderHBar(canvasId, data, colors, singleColor){
    const ctx = document.getElementById(canvasId);
    return new Chart(ctx, {
        type: "bar",
        data: {
            labels: data.map(d=>d.name),
            datasets: [{
                data: data.map(d=>d.value),
                backgroundColor: singleColor ? colors[0] : data.map((_,i)=>colors[i%colors.length]),
                borderRadius: 4,
            }]
        },
        options: {
            indexAxis: "y",
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display:false }, tooltip: { callbacks: { label: c => `${c.parsed.x} registros` } } },
            scales: {
                x: { beginAtZero:true, ticks: { precision:0, font:{size:11}, color:"#64748b" } },
                y: { ticks: { font:{size:11}, color:"#64748b" } }
            }
        }
    });
}

function renderCustoStacked(canvasId, data){
    const ctx = document.getElementById(canvasId);
    return new Chart(ctx, {
        type: "bar",
        data: {
            labels: data.map(d=>d.name),
            datasets: [
                { label: "Custo MO", data: data.map(d=>d.mo), backgroundColor: "#8b5cf6", stack:"a", borderRadius:3 },
                { label: "Custo Material", data: data.map(d=>d.mat), backgroundColor: "#3b82f6", stack:"a", borderRadius:3 },
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: { position:"bottom", labels:{ font:{size:11} } },
                tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmtBRLPlain(c.parsed.y)}` } }
            },
            scales: {
                x: { ticks: { font:{size:11}, color:"#64748b", maxRotation:45, minRotation:45 } },
                y: { ticks: { font:{size:11}, color:"#64748b", callback: v => "R$ " + (v/1000).toFixed(0)+"k" } }
            }
        }
    });
}

function renderTabela(){
    const dados = dadosGlobais;
    const clusters = [...new Set(dados.map(d=>d.cluster||""))].filter(Boolean).sort();
    const statusCampoOpts = [...new Set(dados.map(d=>d["status campo"]||""))].filter(Boolean).sort();
    const statusDraftOpts = [...new Set(dados.map(d=>d["status draft"]||""))].filter(Boolean).sort();

    let list = dados;
    if(tabelaState.search.trim()){
        const s = tabelaState.search.trim().toLowerCase();
        list = list.filter(d =>
            (d["id obra"]||"").toLowerCase().includes(s) ||
            (d.empresa||"").toLowerCase().includes(s) ||
            (d.armario||"").toLowerCase().includes(s) ||
            (d.primarias||"").toLowerCase().includes(s)
        );
    }
    if(tabelaState.cluster) list = list.filter(d=>d.cluster===tabelaState.cluster);
    if(tabelaState.statusCampo) list = list.filter(d=>d["status campo"]===tabelaState.statusCampo);
    if(tabelaState.statusDraft) list = list.filter(d=>d["status draft"]===tabelaState.statusDraft);

    if(tabelaState.sortKey){
        const key = tabelaState.sortKey;
        list = [...list].sort((a,b)=>{
            const av = a[key] || "", bv = b[key] || "";
            if(key==="custo total" || key==="custo mo" || key==="custo material"){
                const keys = COST_FIELD_MAP[key];
                return tabelaState.sortAsc ? pickCusto(a,keys)-pickCusto(b,keys) : pickCusto(b,keys)-pickCusto(a,keys);
            }
            return tabelaState.sortAsc ? String(av).localeCompare(String(bv),"pt-BR") : String(bv).localeCompare(String(av),"pt-BR");
        });
    }

    const totalPages = Math.max(1, Math.ceil(list.length / tabelaState.perPage));
    if(tabelaState.page >= totalPages) tabelaState.page = Math.max(0, totalPages-1);
    const paginated = list.slice(tabelaState.page*tabelaState.perPage, (tabelaState.page+1)*tabelaState.perPage);

    const totalCusto = list.reduce((s,d)=>s+pickCusto(d, ["valor total orcado", "custo total"]),0);
    const totalMO = list.reduce((s,d)=>s+pickCusto(d, ["valor mo", "custo mo"]),0);
    const totalMat = list.reduce((s,d)=>s+pickCusto(d, ["valor material", "custo material"]),0);

    function sortIcon(key){ return tabelaState.sortKey===key ? (tabelaState.sortAsc ? "↑" : "↓") : "↕"; }
    function th(key,label){ return `<th class="sortable" onclick="toggleSort('${key}')">${label} <span style="opacity:${tabelaState.sortKey===key?1:.3}">${sortIcon(key)}</span></th>`; }

    const STATUS_CAMPO_CLS = { CONCLUIDO:"badge-green", APROVADO:"badge-green", PENDENTE:"badge-red" };
    const STATUS_DRAFT_CLS = { APROVADO:"badge-blue", PENDENTE:"badge-yellow", BLOQUEADO:"badge-red" };
    function statusBadge(value, map){
        const n = norm(value);
        const cls = map[n] || "badge-gray";
        return `<span class="badge ${cls}">${esc(value || "—")}</span>`;
    }

    const rowsHtml = paginated.map(d => `
        <tr>
            <td class="mono" style="font-weight:700;color:var(--navy);">${d["id obra"] ? `<span class="id-obra-link" onclick="openDetalheModal('${esc(d["id obra"])}')" title="Ver comentários e anexos">${esc(d["id obra"])}</span>` : "—"}</td>
            <td>${esc(d.empresa||"—")}</td>
            <td class="mono">${esc(d.armario||"—")}</td>
            <td>${esc(d.cluster||"—")}</td>
            <td>${esc(d.primarias||"—")}</td>
            <td>${statusBadge(d["status campo"], STATUS_CAMPO_CLS)}</td>
            <td>${statusBadge(d["status draft"], STATUS_DRAFT_CLS)}</td>
            <td><span style="font-size:11px;font-weight:600;color:#475569;">${esc(d["status medicao"]||"—")}</span></td>
            <td class="mono" style="text-align:right;">${displayCusto(d, COST_FIELD_MAP["custo mo"])}</td>
            <td class="mono" style="text-align:right;">${displayCusto(d, COST_FIELD_MAP["custo material"])}</td>
            <td class="mono" style="text-align:right;font-weight:700;">${displayCusto(d, COST_FIELD_MAP["custo total"])}</td>
            <td style="color:var(--muted);">${esc(d.requicao||"—")}</td>
        </tr>`).join("");

    const pageNumbers = Array.from({length: Math.min(5,totalPages)}, (_,i)=>{
        return Math.min(Math.max(tabelaState.page-2,0)+i, totalPages-1);
    });
    const uniquePages = [...new Set(pageNumbers)];

    document.getElementById("tabTabela").innerHTML = `
    <div class="filters-row">
        <input class="text-input" placeholder="Buscar ID Obra, Empresa, Armário..." value="${esc(tabelaState.search)}" oninput="setTabelaSearch(this.value)">
        <select class="select-input" onchange="setTabelaCluster(this.value)">
            <option value="">Todos os Clusters</option>
            ${clusters.map(c=>`<option value="${esc(c)}" ${tabelaState.cluster===c?"selected":""}>${esc(c)}</option>`).join("")}
        </select>
        <select class="select-input" onchange="setTabelaStatusCampo(this.value)">
            <option value="">Status Campo</option>
            ${statusCampoOpts.map(s=>`<option value="${esc(s)}" ${tabelaState.statusCampo===s?"selected":""}>${esc(s)}</option>`).join("")}
        </select>
        <select class="select-input" onchange="setTabelaStatusDraft(this.value)">
            <option value="">Status Draft</option>
            ${statusDraftOpts.map(s=>`<option value="${esc(s)}" ${tabelaState.statusDraft===s?"selected":""}>${esc(s)}</option>`).join("")}
        </select>
        <button class="btn-plain" onclick="resetTabela()">Limpar</button>
        <button class="btn-dark" style="margin-left:auto;" onclick="exportCSV()">⬇ Exportar CSV</button>
    </div>

    <div class="totals-row">
        <div class="total-chip"><div class="lbl">Registros filtrados</div><div class="val">${list.length}</div></div>
        <div class="total-chip"><div class="lbl">Custo MO</div><div class="val">${fmtBRL(totalMO)}</div></div>
        <div class="total-chip"><div class="lbl">Custo Material</div><div class="val">${fmtBRL(totalMat)}</div></div>
        <div class="total-chip"><div class="lbl">Custo Total</div><div class="val">${fmtBRL(totalCusto)}</div></div>
    </div>

    <div class="table-card">
        <div style="overflow-x:auto;">
        <table class="data">
            <thead>
                <tr>
                    ${th("id obra","ID Obra")}
                    ${th("empresa","Empresa")}
                    ${th("armario","Armário")}

function getFilteredTabelaData(){

function exportCSV(){
    const dados = getFilteredTabelaData();
    const headers = ["ID Obra","Empresa","Armário","Cluster","Primárias","Status Campo","Status Draft","Status Medição","Custo MO","Custo Material","Custo Total","Requisição"];
    const rows = dados.map(d => [
        d["id obra"], d.empresa, d.armario, d.cluster, d.primarias,
        d["status campo"], d["status draft"], d["status medicao"],
        pickCusto(d, COST_FIELD_MAP["custo mo"]) || "", pickCusto(d, COST_FIELD_MAP["custo material"]) || "", pickCusto(d, COST_FIELD_MAP["custo total"]) || "", d.requicao,
    ].map(v => `"${String(v||"").replace(/"/g,'""')}"`).join(","));

    const csv = [headers.join(","), ...rows].join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `melhorias_${new Date().toISOString().split("T")[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
}

function attachDropZoneEvents(){

        e.preventDefault(); zone.classList.remove("dragover");
    }));
    zone.addEventListener("drop", e=>{
        if(e.dataTransfer.files.length) handleFileInput(e.dataTransfer.files);
    });
}

function handleFileInput(files){
    if(!files || !files.length) return;
    const file = files[0];
    importState.fileName = file.name;
    parseImportFile(file);
}

function excelSerialToDateStr(serial){
    if(typeof serial !== "number" || isNaN(serial)) return String(serial || "");
    const date = new Date(Math.round((serial - 25569) * 86400 * 1000));
    if(isNaN(date.getTime())) return String(serial);
    return date.toLocaleDateString("pt-BR");
}

function formatCustoBRL(v){
    if(v === "" || v == null) return "R$ 0,00";
    if(typeof v === "string" && v.trim().startsWith("R$")) return v.trim();
    const n = typeof v === "number" ? v : parseCusto(v);
    return n.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
}

function parseImportFile(file){
    const reader = new FileReader();
    reader.onload = function(e){
        try{
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type:"array" });
            const sheetName = wb.SheetNames[0];
            const sheet = wb.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(sheet, { header:1, raw:true, defval:"" });

            if(!rows.length){ showImportError("A planilha está vazia."); return; }

            const headers = rows[0].map(h => String(h || "").trim().toLowerCase());
            const dataRows = rows.slice(1).filter(r => r.some(v => v !== "" && v != null));

            const parsed = dataRows.map(r => {
                const obj = {};
                headers.forEach((h,i) => {
                    let v = r[i];
                    if(IMPORT_MONEY_COLS.has(h)){
                        v = formatCustoBRL(v);
                    }else if(IMPORT_DATE_COLS.has(h) && typeof v === "number"){
                        v = excelSerialToDateStr(v);
                    }else if(v == null){
                        v = "";
                    }else if(typeof v === "number"){
                        v = String(v);
                    }else{
                        v = String(v).trim();
                    }
                    obj[h] = v;
                });
                return obj;
            });

            if(!parsed.length){ showImportError("Nenhuma linha com dados foi encontrada."); return; }

            importState.data = parsed;
            renderImportPreview(headers, parsed);
        }catch(err){
            showImportError("Não foi possível ler o arquivo. Confira se o formato é .xlsx, .xlsb, .xls ou .csv.");
        }
    };
    reader.onerror = function(){ showImportError("Falha ao ler o arquivo."); };
    reader.readAsArrayBuffer(file);
}

    const box = document.getElementById("importError");

        <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Pré-visualização (${previewRows.length} de ${parsed.length})</div>

async function postMelhorias(lista){
    // Content-Type text/plain evita preflight CORS no Apps Script.
    // O doPost() do seu Apps Script deve ler e.postData.contents e
    // fazer JSON.parse() para obter { action, melhorias }.
    const res = await fetch(IMPORT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "importar_melhorias", melhorias: lista }),
    });
    const json = await res.json().catch(() => ({}));
    if(!res.ok || json.error){
        throw new Error(json.error || `Erro HTTP ${res.status}`);
    }
    return json;
}

function renderAddField(f){
    const id = fieldId(f.key);
    const reqCls = f.required ? "required" : "";
    let input;
    if(f.type === "select"){
        input = `<select id="${id}">
            <option value="">Selecione...</option>
            ${f.options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join("")}
        </select>`;
    }else if(f.type === "date"){
        input = `<input type="date" id="${id}">`;
    }else if(f.type === "number"){
        input = `<input type="number" step="0.01" id="${id}" ${f.readonly ? "readonly" : ""} placeholder="0,00">`;
    }else{
        input = `<input type="text" id="${id}" placeholder="${esc(f.placeholder || "")}">`;
    }
    return `<div class="form-field ${reqCls}"><label>${esc(f.label)}</label>${input}</div>`;
}

function renderAddForm(){
    const groups = [...new Set(ADD_FIELDS.map(f => f.group))];
    let html = "";
    groups.forEach(g => {
        html += `<div class="form-section-title">${esc(g)}</div><div class="form-grid">`;
        ADD_FIELDS.filter(f => f.group === g).forEach(f => { html += renderAddField(f); });
        html += `</div>`;
    });
    document.getElementById("addBody").innerHTML = html;
    document.getElementById("addFooter").style.display = "flex";

    const btn = document.getElementById("btnConfirmAdd");
    btn.disabled = false;
    btn.textContent = "Salvar";

    // Custo Total = Custo MO + Custo Material (calculado automaticamente)
    const mo = document.getElementById(fieldId("custo mo"));
    const mat = document.getElementById(fieldId("custo material"));
    const total = document.getElementById(fieldId("custo total"));
    function recalcTotal(){
        const v = (parseFloat(mo.value) || 0) + (parseFloat(mat.value) || 0);
        total.value = v ? v.toFixed(2) : "";
    }
    if(mo && mat && total){
        mo.addEventListener("input", recalcTotal);
        mat.addEventListener("input", recalcTotal);
    }
}

function dateInputToBR(v){

function fmtBytes(n){
    if(n < 1024) return n + " B";
    if(n < 1024*1024) return (n/1024).toFixed(1) + " KB";
    return (n/(1024*1024)).toFixed(1) + " MB";
}
function fmtDataHora(iso){

    return d.toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
}

}
async function postDetalheAction(action, payload){
    const res = await fetch(IMPORT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action, ...payload }),
    });
    const json = await res.json().catch(() => ({}));
    if(!res.ok || json.error){
        throw new Error(json.error || `Erro HTTP ${res.status}`);
    }
    return json;
}

function openDetalheModal(idObra){
    detalheState.idObra = idObra;
    document.getElementById("detalheIdLabel").textContent = idObra;
    document.getElementById("detalheOverlay").style.display = "flex";
    renderDetalheModal();
}
function closeDetalheModal(){
    document.getElementById("detalheOverlay").style.display = "none";
    detalheState.idObra = null;
}

async function renderDetalheModal(){
    const idObra = detalheState.idObra;
    const body = document.getElementById("detalheBody");
    body.innerHTML = `<div style="text-align:center;padding:30px 0;color:var(--muted);font-size:13px;">Carregando...</div>`;

    let comentarios = [], anexos = [], erro = null;
    try{
        const [rc, ra] = await Promise.all([
            fetchDetalheGet("comentarios", idObra),
            fetchDetalheGet("anexos", idObra),
        ]);
        comentarios = rc.comentarios || [];
        anexos = ra.anexos || [];
    }catch(e){
        erro = e.message || "Erro desconhecido";
    }

    comentarios.sort((a,b) => new Date(b.data) - new Date(a.data));
    anexos.sort((a,b) => new Date(b.data) - new Date(a.data));

    const comentariosHtml = comentarios.length ? comentarios.map(c => `
        <div class="comment-item">
            <div class="comment-item-head">
                <span class="comment-item-name">${esc(c.nome)}</span>
                <span class="comment-item-date">${fmtDataHora(c.data)}</span>
            </div>
            <div class="comment-item-text">${esc(c.texto)}</div>
            <button class="comment-item-del" onclick="excluirComentario('${esc(c.id)}')">✕ excluir</button>
        </div>
    `).join("") : `<div class="empty-mini">Nenhum comentário ainda.</div>`;

    const anexosHtml = anexos.length ? anexos.map(a => `
        <div class="attach-item">
            <div class="attach-item-icon">📎</div>
            <div class="attach-item-name" title="${esc(a.nome)}">${esc(a.nome)}</div>
            <div class="attach-item-size">${fmtBytes(Number(a.tamanho)||0)}</div>
            <div class="attach-item-actions">
                <a href="${esc(a.url)}" target="_blank" rel="noopener" title="Baixar">⬇</a>
                <button class="del" onclick="excluirAnexo('${esc(a.id)}')" title="Remover">✕</button>
            </div>
        </div>
    `).join("") : `<div class="empty-mini">Nenhum arquivo anexado ainda.</div>`;

    body.innerHTML = `
        ${erro ? `<div class="import-error" style="display:block;margin-bottom:14px;">⚠ Não foi possível carregar os dados: ${esc(erro)}</div>` : ""}
        <div class="detalhe-section-title">💬 Comentários</div>
        <div class="comment-form">
            <input type="text" id="comentNome" placeholder="Seu nome">
            <textarea id="comentTexto" rows="3" placeholder="Escreva um comentário..."></textarea>
            <button class="btn-dark" id="btnSalvarComentario" style="align-self:flex-end;" onclick="salvarComentario()">Salvar comentário</button>
        </div>
        <div class="comment-list">${comentariosHtml}</div>

        <div class="detalhe-section-title">📎 Anexos</div>
        <div class="attach-drop" onclick="document.getElementById('anexoInput').click()">
            Clique para selecionar um ou mais arquivos (até 15MB cada)
            <input type="file" id="anexoInput" multiple style="display:none;" onchange="handleAnexoInput(this.files)">
        </div>
        <div id="anexoStatus"></div>
        <div class="attach-list">${anexosHtml}</div>
    `;
}

async function salvarComentario(){
    const idObra = detalheState.idObra;
    const nomeEl = document.getElementById("comentNome");
    const textoEl = document.getElementById("comentTexto");
    const nome = nomeEl.value.trim();
    const texto = textoEl.value.trim();
    if(!nome || !texto){
        alert("Preencha seu nome e o comentário.");
        return;
    }
    const btn = document.getElementById("btnSalvarComentario");
    btn.disabled = true;
    btn.textContent = "Salvando...";
    try{
        await postDetalheAction("salvar_comentario", { idObra, nome, texto });
        renderDetalheModal();
    }catch(e){
        alert("Erro ao salvar comentário: " + e.message);
        btn.disabled = false;
        btn.textContent = "Salvar comentário";
    }
}
async function excluirComentario(id){
    if(!confirm("Excluir este comentário para todo mundo?")) return;
    try{
        await postDetalheAction("excluir_comentario", { id });
        renderDetalheModal();
    }catch(e){
        alert("Erro ao excluir comentário: " + e.message);
    }
}

function fileToBase64(file){
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
    });
}

async function handleAnexoInput(fileList){
    const idObra = detalheState.idObra;
    const files = Array.from(fileList || []);
    const statusEl = document.getElementById("anexoStatus");
    document.getElementById("anexoInput").value = "";
    if(!files.length) return;

    for(const file of files){
        if(file.size > ANEXO_MAX_BYTES){
            alert(`"${file.name}" tem ${fmtBytes(file.size)} — o limite é 15MB por arquivo. Esse foi pulado.`);
            continue;
        }
        if(statusEl) statusEl.innerHTML = `<div style="font-size:12px;color:var(--muted);margin:6px 0;">Enviando ${esc(file.name)}...</div>`;
        try{
            const conteudoBase64 = await fileToBase64(file);
            await postDetalheAction("salvar_anexo", {
                idObra, nome: file.name, tipo: file.type, tamanho: file.size, conteudoBase64,
            });
        }catch(e){
            alert(`Erro ao enviar "${file.name}": ` + e.message);
        }
    }
    renderDetalheModal();
}
async function excluirAnexo(id){
    if(!confirm("Remover este anexo para todo mundo?")) return;
    try{
        await postDetalheAction("excluir_anexo", { id });
        renderDetalheModal();
    }catch(e){
        alert("Erro ao excluir anexo: " + e.message);
    }
}

/* ==========================================================
   INIT
   ========================================================== */
carregar();
</script>
