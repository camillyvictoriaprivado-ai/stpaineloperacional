<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Operacional ST</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
    --primary:#4f46e5;
    --primary-dark:#4338ca;
    --secondary:#7c3aed;
    --accent:#db2777;
    --bg:#f1f5f9;
    --white:#ffffff;
    --text:#0f172a;
    --text-light:#6b7a99;
    --text-faint:#94a3b8;
    --border:#e2e8f0;
    --border-light:#f1f5f9;

    --emerald:#10b981;
    --emerald-bg:#f0fdf4;
    --emerald-text:#059669;
    --amber:#f97316;
    --amber-bg:#fffbeb;
    --amber-text:#d97706;
    --rose:#f43f5e;
    --rose-bg:#fff1f2;
    --rose-text:#e11d48;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);

    opacity:0;
    transition:opacity .15s ease;
}

body.auth-ready{
    opacity:1;
}

/* HEADER */

.header{
    height:75px;
    padding:0 30px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:var(--white);
    border-bottom:1px solid var(--border-light);

    position:sticky;
    top:0;
    z-index:100;
}

.header h1{
    font-size:18px;
    font-weight:900;
    color:var(--text);
    text-transform:uppercase;
    letter-spacing:.06em;
}

.header h1::before{
    content:"";
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    margin-right:10px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    vertical-align:middle;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

/* BOTÕES */

.btn{
    color:white;

    border:none;

    padding:11px 22px;

    border-radius:12px;

    font-weight:800;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.05em;

    cursor:pointer;

    background:linear-gradient(135deg,var(--primary),var(--secondary));

    box-shadow:0 4px 14px rgba(79,70,229,.25);

    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(79,70,229,.35);
}

.btn:active{
    transform:scale(.98);
}

.btn-kanban{
    color:white;
    border:none;
    padding:11px 22px;
    border-radius:12px;
    font-weight:800;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.05em;
    cursor:pointer;
    background:linear-gradient(135deg,#db2777,#7c3aed);
    box-shadow:0 4px 14px rgba(219,39,119,.25);
    transition:.2s;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
}

.btn-kanban:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(219,39,119,.35);
    color:white;
}

.btn-kanban:active{
    transform:scale(.98);
}

/* CONTAINER */

.container{
    padding:25px 30px 40px;
    max-width:1400px;
    margin:0 auto;
}

/* STATUS */

.status{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(250px,1fr));

    gap:18px;

    margin-bottom:22px;
}

.box{
    position:relative;
    background:white;

    border-radius:20px;

    padding:22px 24px;

    border:1px solid var(--border-light);

    box-shadow:0 1px 3px rgba(15,23,42,.04);

    transition:.2s;

    overflow:hidden;
}

.box::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:4px;
    background:var(--box-accent,linear-gradient(90deg,var(--primary),var(--secondary)));
}

.box:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 28px rgba(15,23,42,.08);
    border-color:transparent;
}

.box .label{
    display:block;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:var(--text-faint);
}

.box span.value{
    display:block;

    margin-top:10px;

    font-size:34px;

    font-weight:900;

    color:var(--text);

    letter-spacing:-.02em;

    font-variant-numeric:tabular-nums;
}

.box span.value.is-loading{
    color:var(--text-faint);
}

.updated-at{
    display:block;
    margin-top:8px;
    font-size:11px;
    font-weight:600;
    color:var(--text-faint);
}

.box.box-rose{ --box-accent:linear-gradient(90deg,var(--rose),#fb7185); }
.box.box-rose .value{ color:var(--rose-text); }

.box.box-amber{ --box-accent:linear-gradient(90deg,var(--amber),#fbbf24); }
.box.box-amber .value{ color:var(--amber-text); }

.box.box-emerald{ --box-accent:linear-gradient(90deg,var(--emerald),#34d399); }
.box.box-emerald .value{ color:var(--emerald-text); }

/* PROGRESSO */

.progress-card{
    background:white;
    border-radius:20px;
    padding:20px 24px;
    border:1px solid var(--border-light);
    box-shadow:0 1px 3px rgba(15,23,42,.04);
    margin-bottom:28px;
}

.progress{
    width:100%;
    height:12px;

    background:#eef1f6;

    border-radius:50px;

    overflow:hidden;

    margin-bottom:14px;
}

.bar{
    height:100%;

    width:0%;

    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--secondary)
        );

    border-radius:50px;

    transition:width .6s ease;
}

#percent{
    color:var(--text-light);

    font-weight:700;

    font-size:13px;
    letter-spacing:.01em;
}

#percent b{
    color:var(--text);
    font-weight:800;
}

/* TÍTULOS */

.section-title{
    margin:32px 0 16px;

    display:flex;
    align-items:center;
    gap:10px;

    color:var(--text);

    font-size:13px;

    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.08em;
}

.section-title::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--border);
}

.section-title .region-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:3px 10px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.06em;
}

.section-title .region-tag::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:currentColor;
}

.region-tag.tag-sc{ background:#eef2ff; color:var(--primary-dark); }
.region-tag.tag-rs{ background:var(--emerald-bg); color:var(--emerald-text); }

/* GRID */

.grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(260px,1fr));

    gap:16px;

    margin-bottom:20px;
}

/* CARDS */

.card{
    background:white;

    padding:22px;

    border-radius:18px;

    cursor:pointer;

    border:1px solid var(--border-light);

    transition:.2s;

    box-shadow:0 1px 3px rgba(15,23,42,.04);

    display:flex;
    align-items:center;
    gap:14px;

    text-decoration:none;
    color:inherit;

    width:100%;
    font-family:inherit;
    text-align:left;
}

.card:hover{
    transform:translateY(-4px);
    border-color:transparent;
    box-shadow:0 14px 30px rgba(79,70,229,.12);
}

.card:active{
    transform:translateY(-1px) scale(.99);
}

.card:focus-visible{
    outline:2px solid var(--primary);
    outline-offset:2px;
}

.card.card-disabled{
    cursor:not-allowed;
    opacity:.55;
}

.card.card-disabled:hover{
    transform:none;
    border-color:var(--border-light);
    box-shadow:0 1px 3px rgba(15,23,42,.04);
}

.card-soon{
    margin-left:auto;
    flex-shrink:0;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--text-faint);
    background:var(--border-light);
    padding:3px 9px;
    border-radius:20px;
}

.card-icon{
    flex-shrink:0;
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    background:linear-gradient(135deg,#eef2ff,#f5f3ff);
    color:var(--primary);
}

.card-icon.kanban-icon{
    background:linear-gradient(135deg,#fdf2f8,#f5f3ff);
}

.card-body{
    min-width:0;
}

.card h3{
    font-size:15px;

    color:var(--text);

    font-weight:800;

    margin-bottom:3px;
}

.card p{
    color:var(--text-light);

    font-size:12.5px;

    font-weight:500;
}

.card-external{
    margin-left:auto;
    flex-shrink:0;
    font-size:11px;
    color:var(--text-faint);
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
}

/* RESPONSIVO */

@media(max-width:768px){

    .header{
        padding:15px;
        height:auto;
        gap:15px;
        flex-direction:column;
    }

    .header h1{
        font-size:15px;
        text-align:center;
    }

    .header-actions{
        flex-wrap:wrap;
        justify-content:center;
    }

    .container{
        padding:15px;
    }

    .box span.value{
        font-size:28px;
    }
}
</style>

</head>

<script>
async function checkLogin() {

    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "index.html";
        return;
    }

    const url = "https://script.google.com/macros/s/AKfycby-4fOy9HAEmCUMndlLrPWJC7Gq62K5kSd3VWlo3EHEcug_68A5Uyv8hzzbJHtxh0t-Ig/exec?acao=checkLogin&token=" + encodeURIComponent(token);

    try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.valid) {
            window.location.href = "index.html";
            return;
        }

        document.body.classList.add("auth-ready");

    } catch (err) {
        console.error("Não foi possível validar o login:", err);
        window.location.href = "index.html";
    }
}

checkLogin();
</script>

<body>

<div class="header">
    <h1>Painel Operacional ST</h1>
    <div class="header-actions">
        <a class="btn-kanban" href="https://projetokanban.vercel.app/" target="_blank">
            🗂️ Projeto Kanban ↗
        </a>
        <button class="btn" onclick="carregar()">Atualizar</button>
    </div>
</div>

<div class="container">

    <div class="status">

        <div class="box box-amber">
            <span class="label">Aguardando Fechamento</span>
            <span class="value" id="aguardandoFechamento">0</span>
        </div>

        <div class="box box-rose">
            <span class="label">Eps / Baixa de Material Incorreta</span>
            <span class="value" id="eps">0</span>
        </div>

        <div class="box box-emerald">
            <span class="label">Supervisor Cidade</span>
            <span class="value" id="concluidos">0</span>
        </div>

    </div>

    <div class="progress-card">
        <div class="progress">
            <div id="bar" class="bar"></div>
        </div>
        <p id="percent">0%</p>
        <p class="updated-at" id="updatedAt"></p>
    </div>

    <h2 class="section-title">Manutenção Emergencial <span class="region-tag tag-sc">SC</span></h2>

    <div class="grid">

        <button type="button" class="card" onclick="go('dashboard.html')">
            <div class="card-icon">📊</div>
            <div class="card-body">
                <h3>Dashboard</h3>
                <p>Acompanhamento diário</p>
            </div>
        </button>

        <button type="button" class="card" onclick="go('almoxarifado-estoque.html')">
            <div class="card-icon">📦</div>
            <div class="card-body">
                <h3>Almoxarifado</h3>
                <p>Controle de estoque</p>
            </div>
        </button>

        <button type="button" class="card" onclick="go('almoxarifado-pendencias.html')">
            <div class="card-icon">📋</div>
            <div class="card-body">
                <h3>Almoxarifado</h3>
                <p>Controle de pendências</p>
            </div>
        </button>

        <button type="button" class="card" onclick="go('historico-ano.html')">
            <div class="card-icon">🎯</div>
            <div class="card-body">
                <h3>Monitoramento</h3>
                <p>Controle de desempenho anual</p>
            </div>
        </button>

    </div>

    <h2 class="section-title">Implantação/Manutenção SC <span class="region-tag tag-sc">SC</span></h2>

    <div class="grid">

        <button type="button" class="card" onclick="go('draft-melhorias.html')">
            <div class="card-icon">🛠️</div>
            <div class="card-body">
                <h3>Draft</h3>
                <p>Primárias Ofensoras</p>
            </div>
        </button>

        <button type="button" class="card" onclick="go('draft-b2b.html')">
            <div class="card-icon">🏢</div>
            <div class="card-body">
                <h3>Draft</h3>
                <p>B2B</p>
            </div>
        </button>

        <button type="button" class="card card-disabled" disabled aria-disabled="true">
            <div class="card-icon">🌐</div>
            <div class="card-body">
                <h3>Draft</h3>
                <p>Site</p>
            </div>
            <span class="card-soon">Em breve</span>
        </button>

        <button type="button" class="card" onclick="go('desligue-cobre.html')">
            <div class="card-icon">🔌</div>
            <div class="card-body">
                <h3>Desligue Cobre</h3>

            </div>
        </button>

        <button type="button" class="card" onclick="go('prumada-sc.html')">
            <div class="card-icon">🏗️</div>
            <div class="card-body">
                <h3>Draft</h3>
                <p>Prumada</p>
            </div>
        </button>

        <button type="button" class="card card-disabled" disabled aria-disabled="true">
            <div class="card-icon">🗄️</div>
            <div class="card-body">
                <h3>Draft</h3>
                <p>Armário</p>
            </div>
            <span class="card-soon">Em breve</span>
        </button>

        <button type="button" class="card card-disabled" disabled aria-disabled="true">
            <div class="card-icon">🛍️</div>
            <div class="card-body">
                <h3>Draft</h3>
                <p>Adequação Shopping</p>
            </div>
            <span class="card-soon">Em breve</span>
        </button>
        

    </div>

    <h2 class="section-title">Implantação/Manutenção RS <span class="region-tag tag-rs">RS</span></h2>

    <div class="grid">

        <button type="button" class="card" onclick="go('draft-melhorias-rs.html')">
            <div class="card-icon">🛠️</div>
            <div class="card-body">
                <h3>Draft</h3>
                <p>Primárias Ofensoras</p>
            </div>
        </button>

        <button type="button" class="card" onclick="go('draft-b2b-rs.html')">
            <div class="card-icon">🏢</div>
            <div class="card-body">
                <h3>Draft</h3>
                <p>B2B</p>
            </div>
        </button>

    </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby-4fOy9HAEmCUMndlLrPWJC7Gq62K5kSd3VWlo3EHEcug_68A5Uyv8hzzbJHtxh0t-Ig/exec";

function go(page) {
    window.location.href = page;
}

function norm(v){
    return (v || "").toString().trim().toUpperCase().replace(/\s+/g, "");
}

async function carregar() {

    const valores = ["aguardandoFechamento", "eps", "concluidos"];
    valores.forEach(id => document.getElementById(id).classList.add("is-loading"));

    const btnAtualizar = document.querySelector(".btn");
    const textoOriginal = btnAtualizar.innerText;
    btnAtualizar.innerText = "Atualizando...";
    btnAtualizar.disabled = true;

    try {
        const res = await fetch(API_URL + "?v=" + Date.now());
        const data = await res.json();

        const base = data.base || [];

    const aguardandoFechamento = new Set(
        base
            .filter(i => norm(i.status) === norm("Aguardando Fechamento"))
            .map(i => i.id)
    ).size;

    const supervisorCidade = new Set(
        base
            .filter(i => norm(i.status) === norm("Supervisor Cidade"))
            .map(i => i.id)
    ).size;

    const eps = new Set(
        base
            .filter(i => norm(i.status) === norm("Eps/Baixa de Material Incorreta"))
            .map(i => i.id)
    ).size;

        document.getElementById("aguardandoFechamento").innerText = aguardandoFechamento;
        document.getElementById("eps").innerText = eps;
        document.getElementById("concluidos").innerText = supervisorCidade;

        const metaMes = 1400;
        const idsUnicos = new Set(base.map(item => item.id)).size;
        const hoje = new Date();
        const diaAtual = hoje.getDate();
        const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
        const mediaDia = idsUnicos / diaAtual;
        const previsaoMes = Math.round(mediaDia * diasNoMes);
        const faltam = Math.max(0, previsaoMes - idsUnicos);
        const percent = Math.min(Math.round((idsUnicos / metaMes) * 100), 100);

        document.getElementById("percent").innerHTML =
            `Atual: <b>${idsUnicos}</b> &nbsp;|&nbsp; Previsão: <b>${previsaoMes}</b> &nbsp;|&nbsp; Faltam: <b>${faltam}</b>`;

        document.getElementById("bar").style.width = percent + "%";

        const agora = new Date();
        const hora = agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
        document.getElementById("updatedAt").innerText = `Atualizado às ${hora}`;

    } catch (err) {
        console.error("Erro ao carregar dados:", err);
        document.getElementById("updatedAt").innerText =
            "Não foi possível atualizar os dados agora. Tente novamente em instantes.";
    } finally {
        valores.forEach(id => document.getElementById(id).classList.remove("is-loading"));
        btnAtualizar.innerText = textoOriginal;
        btnAtualizar.disabled = false;
    }
}

carregar();

</script>
