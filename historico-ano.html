<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histórico Anual — Chamados de Rede</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
    --navy:#0f172a;
    --navy-2:#1e293b;
    --navy-3:#334155;
    --blue:#3b82f6;
    --indigo:#6366f1;
    --violet:#8b5cf6;
    --pink:#ec4899;
    --orange:#f97316;
    --sky:#0ea5e9;
    --green:#10b981;
    --amber:#f59e0b;
    --red:#ef4444;
    --bg:#f1f5f9;
    --white:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --muted-2:#94a3b8;
    --border:#e2e8f0;
    --border-light:#f1f5f9;

    /* Paleta do site (painel.html / draft-melhorias.html) */
    --primary:#4f46e5;
    --primary-dark:#4338ca;
    --secondary:#7c3aed;
    --accent:#db2777;
    --text-faint:#94a3b8;
}

*{ box-sizing:border-box; }

body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
}

.wrap{ max-width:1440px; margin:0 auto; padding:24px 24px 40px; }

/* HEADER — mesmo padrão do painel.html / draft-melhorias.html */
.header{
    height:75px; background:var(--white); border-bottom:1px solid var(--border-light);
    padding:0 30px; display:flex; align-items:center; position:sticky; top:0; z-index:100;
}
.header-inner{
    max-width:1440px; margin:0 auto; width:100%; display:flex; align-items:center;
    justify-content:space-between; flex-wrap:wrap; gap:12px;
}
.title-main{ color:var(--text); font-weight:900; font-size:16px; text-transform:uppercase; letter-spacing:.06em; }
.title-main::before{
    content:""; display:inline-block; width:8px; height:8px; border-radius:50%;
    margin-right:10px; background:linear-gradient(135deg,var(--primary),var(--secondary)); vertical-align:middle;
}
.title-sub{ color:var(--text-faint); font-size:12px; margin-left:18px; margin-top:2px; }
.header-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.status-line{ color:var(--text-faint); font-size:12px; display:flex; align-items:center; }
.btn-refresh{
    color:white; border:none; background:linear-gradient(135deg,var(--primary),var(--secondary));
    box-shadow:0 4px 14px rgba(79,70,229,.25); padding:10px 20px; border-radius:12px;
    font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    display:flex; align-items:center; gap:6px; cursor:pointer; transition:.2s; text-decoration:none;
}
.btn-refresh:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(79,70,229,.35); color:white; }
.btn-refresh:active{ transform:scale(.98); }
.btn-refresh.btn-outline{ background:var(--white); color:var(--text); border:1px solid var(--border); box-shadow:none; }
.btn-refresh.btn-outline:hover{ border-color:var(--primary); color:var(--primary); box-shadow:none; transform:none; }
.spin{ animation:spin 1s linear infinite; }
@keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

.badge-periodo{
    background:linear-gradient(135deg,rgba(79,70,229,.1),rgba(124,58,237,.1));
    border:1px solid rgba(79,70,229,.25); color:var(--primary);
    padding:8px 16px; border-radius:10px; font-size:12px; font-weight:800;
    display:flex; align-items:center; gap:6px;
}

/* Filtro de meta de SLA */
.meta-row{ display:flex; align-items:center; gap:10px; margin:18px 0 20px; flex-wrap:wrap; }
.meta-label{ font-size:12px; font-weight:700; color:var(--muted); }
.meta-chip{
    padding:7px 16px; border-radius:8px; border:1px solid var(--border);
    font-size:12px; font-weight:700; cursor:pointer; background:white; color:#475569; transition:.15s;
}
.meta-chip.active{ background:var(--navy); border-color:var(--navy); color:white; }

/* KPI */
.kpi-bar{ display:flex; flex-wrap:wrap; gap:12px; }
.kpi-card{
    background:white; border-radius:16px; padding:18px 20px; border:1px solid var(--border);
    box-shadow:0 1px 3px rgba(15,23,42,.05); flex:1; min-width:220px; position:relative; overflow:hidden;
}
.kpi-card::before{ content:""; position:absolute; top:0; left:0; width:3px; height:100%; border-radius:16px 0 0 16px; }
.kpi-card.c-indigo::before{ background:var(--indigo); }
.kpi-card.c-green::before{ background:var(--green); }
.kpi-card.c-sky::before{ background:var(--sky); }
.kpi-card.c-violet::before{ background:var(--violet); }
.kpi-icon{
    width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:17px; margin-bottom:12px;
}
.kpi-card.c-indigo .kpi-icon{ background:rgba(99,102,241,.12); }
.kpi-card.c-green .kpi-icon{ background:rgba(16,185,129,.12); }
.kpi-card.c-sky .kpi-icon{ background:rgba(14,165,233,.12); }
.kpi-card.c-violet .kpi-icon{ background:rgba(139,92,246,.12); }
.kpi-label{ font-size:11px; font-weight:700; color:var(--muted-2); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
.kpi-value{ font-size:28px; font-weight:900; color:var(--navy); letter-spacing:-.03em; }
.kpi-sub{ font-size:11px; color:var(--muted-2); margin-top:4px; }
.kpi-sub.good{ color:#15803d; font-weight:700; }
.kpi-sub.bad{ color:#dc2626; font-weight:700; }
.kpi-progress{ height:6px; border-radius:3px; background:var(--border-light); margin-top:10px; overflow:hidden; }
.kpi-progress-fill{ height:100%; border-radius:3px; transition:width .4s; }

/* Chips secundários (meses acima/abaixo da meta etc) */
.stat-row{ display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; }
.stat-chip{
    background:white; border-radius:12px; padding:14px 18px; border:1px solid var(--border);
    box-shadow:0 1px 3px rgba(15,23,42,.04); flex:1; min-width:180px; text-align:center;
}
.stat-chip .lbl{ font-size:11px; font-weight:700; color:var(--muted-2); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
.stat-chip .val{ font-size:22px; font-weight:900; }
.stat-chip.good .val{ color:#15803d; }
.stat-chip.bad .val{ color:#dc2626; }
.stat-chip.neutral .val{ color:var(--navy); }

/* charts grid */
.charts-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-top:20px; }
.chart-card{ background:white; border-radius:16px; padding:20px; border:1px solid var(--border); box-shadow:0 1px 3px rgba(15,23,42,.04); }
.chart-card.full{ grid-column:1 / -1; }
.chart-title{ font-size:14px; font-weight:800; color:var(--navy); margin-bottom:2px; display:flex; align-items:center; gap:8px; }
.chart-title::before{ content:""; width:3px; height:14px; border-radius:2px; display:inline-block; }
.chart-title.t-blue::before{ background:linear-gradient(180deg,var(--blue),var(--indigo)); }
.chart-title.t-green::before{ background:linear-gradient(180deg,var(--green),var(--sky)); }
.chart-title.t-violet::before{ background:linear-gradient(180deg,var(--violet),var(--pink)); }
.chart-title.t-orange::before{ background:linear-gradient(180deg,var(--orange),var(--amber)); }
.chart-sub{ font-size:12px; color:var(--muted); margin-bottom:16px; }
.chart-container{ position:relative; height:280px; }
.chart-container.tall{ height:340px; }

/* legenda de mapa de calor */
.heat-legend{ display:flex; gap:16px; margin-top:14px; flex-wrap:wrap; }
.heat-legend-item{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); }
.heat-dot{ width:10px; height:10px; border-radius:3px; display:inline-block; }

/* tabela */
.table-card{ background:white; border-radius:16px; border:1px solid var(--border); overflow:hidden; box-shadow:0 1px 3px rgba(15,23,42,.04); margin-top:20px; }
.table-card-header{ padding:18px 22px 4px; }
table.data{ width:100%; border-collapse:collapse; font-size:13px; }
table.data thead tr{ background:var(--navy); }
table.data th{
    padding:10px 14px; text-align:left; font-size:11px; font-weight:700; color:var(--muted-2);
    text-transform:uppercase; letter-spacing:.05em; white-space:nowrap;
}
table.data td{ padding:10px 14px; border-bottom:1px solid var(--border-light); color:#374151; vertical-align:middle; }
table.data tbody tr:hover{ background:#eff6ff; }
table.heat td, table.heat th{ text-align:center; }
.heat-cell{ font-weight:800; border-radius:8px; padding:6px 10px; display:inline-block; min-width:52px; }
.heat-green{ background:#dcfce7; color:#15803d; }
.heat-amber{ background:#fef3c7; color:#b45309; }
.heat-red{ background:#fee2e2; color:#dc2626; }
.heat-gray{ background:#f1f5f9; color:#94a3b8; }

.badge{ border-radius:6px; padding:3px 10px; font-size:11px; font-weight:700; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
.badge-green{ background:#dcfce7; color:#15803d; }
.badge-amber{ background:#fef9c3; color:#a16207; }
.badge-red{ background:#fee2e2; color:#dc2626; }

.loading-box, .error-box{ text-align:center; padding:100px 0; }
.loading-box{ color:var(--muted); font-size:13px; }
.error-box{ color:var(--red); font-size:13px; }

.footer-note{ font-size:11px; color:var(--muted-2); margin-top:14px; text-align:right; }

::-webkit-scrollbar{ width:6px; height:6px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:#cbd5e1; border-radius:3px; }
::-webkit-scrollbar-thumb:hover{ background:#94a3b8; }

@media(max-width:900px){
    .charts-grid{ grid-template-columns:1fr; }
    .kpi-value{ font-size:24px; }
}
</style>
</head>
<body>

<div class="header">
    <div class="header-inner">
        <div>
            <div class="title-main">Histórico Anual — Chamados de Rede</div>
            <div class="title-sub">Manutenção Emergencial · Fibra GPON · Santa Catarina</div>
        </div>
        <div class="header-right">
            <div class="status-line" id="statusLine"></div>
            <a href="painel.html" class="btn-refresh btn-outline" style="text-decoration:none;">← Voltar ao Painel</a>
            <button class="btn-refresh" id="btnRefresh" onclick="carregar()">
                <span id="refreshIcon">⟳</span> Atualizar
            </button>
        </div>
    </div>
</div>

<div class="wrap">

    <div class="meta-row">
        <span class="badge-periodo">📅 Ano 2026 (acumulado até o mês mais recente)</span>
        <span class="meta-label" style="margin-left:auto;">Meta de SLA:</span>
        <button class="meta-chip active" data-meta="90" onclick="setMeta(90,this)">90%</button>
        <button class="meta-chip" data-meta="95" onclick="setMeta(95,this)">95%</button>
        <button class="meta-chip" data-meta="85" onclick="setMeta(85,this)">85%</button>
    </div>

    <div id="conteudo">
        <div class="loading-box">Carregando dados da planilha...</div>
    </div>

</div>

<script>
/* ==========================================================
   CONFIG
   ========================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycby-4fOy9HAEmCUMndlLrPWJC7Gq62K5kSd3VWlo3EHEcug_68A5Uyv8hzzbJHtxh0t-Ig/exec?type=historico-ano-resumo";

const MES_LABEL = { "01":"Jan","02":"Fev","03":"Mar","04":"Abr","05":"Mai","06":"Jun","07":"Jul","08":"Ago","09":"Set","10":"Out","11":"Nov","12":"Dez" };
function labelMes(mesKey){ const p = mesKey.split("-"); return MES_LABEL[p[1]] || mesKey; }

const CLUSTER_CORES = ["#4f46e5","#0ea5e9","#8b5cf6","#ec4899","#f97316","#10b981","#f59e0b","#64748b"];

let META_SLA = 90;
let ultimoResumo = null;
let charts = {}; // guarda instâncias do Chart.js pra poder destruir/redesenhar

function esc(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtNum(n){ return (n ?? 0).toLocaleString("pt-BR"); }
function fmtPct(n){ return (n === null || n === undefined) ? "—" : n.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}) + "%"; }
function fmtHoras(n){ return (n === null || n === undefined) ? "—" : n.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}) + "h"; }

function setMeta(v, btnEl){
    META_SLA = v;
    document.querySelectorAll(".meta-chip").forEach(b => b.classList.remove("active"));
    btnEl.classList.add("active");
    if(ultimoResumo) renderTudo(ultimoResumo);
}

/* ==========================================================
   CARREGAMENTO
   ========================================================== */
async function carregar(){
    const icon = document.getElementById("refreshIcon");
    const statusLine = document.getElementById("statusLine");
    icon.classList.add("spin");
    statusLine.textContent = "Atualizando...";

    try{
        const res = await fetch(`${API_URL}&cache=${Date.now()}`);
        if(!res.ok) throw new Error("Erro HTTP " + res.status);
        const json = await res.json();
        if(!json.resumo) throw new Error("Resposta sem 'resumo' — confira o endpoint no Apps Script.");

        ultimoResumo = json.resumo;
        renderTudo(ultimoResumo);

        const agora = new Date();
        statusLine.textContent = "Atualizado às " + agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    }catch(err){
        document.getElementById("conteudo").innerHTML = `
            <div class="error-box">
                ⚠ Não foi possível carregar os dados.<br>
                <span style="font-size:11px;color:var(--muted-2);">${esc(err.message)}</span>
            </div>`;
        statusLine.textContent = "Erro ao atualizar";
    }finally{
        icon.classList.remove("spin");
    }
}

/* ==========================================================
   RENDER PRINCIPAL
   ========================================================== */
function renderTudo(resumo){
    const el = document.getElementById("conteudo");

    if(!resumo.porMes || !resumo.porMes.length){
        el.innerHTML = `<div class="error-box">Nenhum registro encontrado na aba "historico-ano".</div>`;
        return;
    }

    el.innerHTML = `
        <div id="kpiBar" class="kpi-bar"></div>
        <div id="statRow" class="stat-row"></div>

        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title t-blue">Chamados por Mês</div>
                <div class="chart-sub">Total aberto vs. concluídos, mês a mês</div>
                <div class="chart-container"><canvas id="chartTendencia"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title t-orange">Chamados Fora do SLA por Mês</div>
                <div class="chart-sub">Quantidade fora do prazo — verde quando o mês bate a meta de SLA</div>
                <div class="chart-container"><canvas id="chartForaSLA"></canvas></div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title t-green">Taxa de Cumprimento de SLA</div>
                <div class="chart-sub">% de chamados dentro do prazo, por mês</div>
                <div class="chart-container"><canvas id="chartSlaRate"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title t-blue">Chamados Acumulados no Ano</div>
                <div class="chart-sub">Total e concluídos, em soma acumulada</div>
                <div class="chart-container"><canvas id="chartAcumulado"></canvas></div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title t-violet">Variação Mês a Mês (%)</div>
                <div class="chart-sub">Crescimento do volume de chamados vs. crescimento dos fora de SLA</div>
                <div class="chart-container"><canvas id="chartVariacao"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="chart-title t-orange">Mapa de Calor — % SLA por Cluster</div>
                <div class="chart-sub">Cruzamento mês x cluster (verde = dentro da meta)</div>
                <div id="heatmapWrap"></div>
            </div>
        </div>

        <div class="chart-card full" style="margin-top:16px;">
            <div class="chart-title t-blue">Comparativo entre Clusters</div>
            <div class="chart-sub">Volume total de chamados por cluster, mês a mês</div>
            <div class="chart-container tall"><canvas id="chartClusters"></canvas></div>
        </div>

        <div class="table-card">
            <div class="table-card-header">
                <div class="chart-title t-violet" style="margin-bottom:2px;">Detalhamento Mensal Completo</div>
                <div class="chart-sub">Todos os indicadores, mês a mês</div>
            </div>
            <div style="overflow-x:auto;">
                <table class="data" id="tabelaDetalhe"></table>
            </div>
        </div>

        <div class="footer-note">Fonte: aba "historico-ano" — atualizado via Apps Script (cache de 5 min)</div>
    `;

    renderKpis(resumo);
    renderStatRow(resumo);
    renderChartTendencia(resumo);
    renderChartForaSLA(resumo);
    renderChartSlaRate(resumo);
    renderChartAcumulado(resumo);
    renderChartVariacao(resumo);
    renderHeatmap(resumo);
    renderChartClusters(resumo);
    renderTabelaDetalhe(resumo);
}

/* ---------- KPIs ---------- */
function renderKpis(resumo){
    const k = resumo.kpis;
    const slaOk = (k.pctSLA ?? 0) >= META_SLA;
    document.getElementById("kpiBar").innerHTML = `
        <div class="kpi-card c-indigo">
            <div class="kpi-icon">📋</div>
            <div class="kpi-label">Total de Chamados</div>
            <div class="kpi-value">${fmtNum(k.total)}</div>
            <div class="kpi-sub">${fmtNum(k.concluidos)} concluídos · ${fmtNum(k.cancelados)} cancelados</div>
        </div>
        <div class="kpi-card c-green">
            <div class="kpi-icon">🎯</div>
            <div class="kpi-label">SLA Cumprido</div>
            <div class="kpi-value">${fmtPct(k.pctSLA)}</div>
            <div class="kpi-sub ${slaOk ? "good" : "bad"}">${slaOk ? "Dentro da meta" : "Abaixo da meta"} (meta ${META_SLA}%)</div>
            <div class="kpi-progress"><div class="kpi-progress-fill" style="width:${Math.min(k.pctSLA ?? 0,100)}%;background:${slaOk ? "var(--green)" : "var(--red)"};"></div></div>
        </div>
        <div class="kpi-card c-sky">
            <div class="kpi-icon">⏱️</div>
            <div class="kpi-label">TTR Médio</div>
            <div class="kpi-value">${fmtHoras(k.ttrMedioH)}</div>
            <div class="kpi-sub">Tempo até o início do reparo</div>
        </div>
        <div class="kpi-card c-violet">
            <div class="kpi-icon">🔧</div>
            <div class="kpi-label">TMR Médio</div>
            <div class="kpi-value">${fmtHoras(k.tmrMedioH)}</div>
            <div class="kpi-sub">Tempo médio de reparo</div>
        </div>
    `;
}

/* ---------- Chips (meses acima/abaixo da meta) ---------- */
function renderStatRow(resumo){
    const meses = resumo.porMes.filter(m => m.pctSLA !== null);
    const acima = meses.filter(m => m.pctSLA >= META_SLA).length;
    const abaixo = meses.filter(m => m.pctSLA < META_SLA).length;
    const media = meses.length ? (meses.reduce((s,m)=>s+m.pctSLA,0)/meses.length) : null;

    document.getElementById("statRow").innerHTML = `
        <div class="stat-chip good"><div class="lbl">Meses Acima da Meta</div><div class="val">${acima}</div></div>
        <div class="stat-chip bad"><div class="lbl">Meses Abaixo da Meta</div><div class="val">${abaixo}</div></div>
        <div class="stat-chip neutral"><div class="lbl">SLA Médio no Período</div><div class="val">${fmtPct(media)}</div></div>
    `;
}

/* ---------- Chart: Tendência (total vs concluídos) ---------- */
function renderChartTendencia(resumo){
    const labels = resumo.porMes.map(m => labelMes(m.mes));
    if(charts.tendencia) charts.tendencia.destroy();
    charts.tendencia = new Chart(document.getElementById("chartTendencia"), {
        type: "line",
        data: {
            labels,
            datasets: [
                { label:"Total Aberto", data: resumo.porMes.map(m=>m.total), borderColor:"#4f46e5", backgroundColor:"#4f46e5", tension:.35, pointRadius:3 },
                { label:"Concluídos", data: resumo.porMes.map(m=>m.concluidos), borderColor:"#0ea5e9", backgroundColor:"#0ea5e9", borderDash:[6,4], tension:.35, pointRadius:3 },
            ]
        },
        options: baseLineOptions()
    });
}

/* ---------- Chart: Fora do SLA (barras coloridas) ---------- */
function renderChartForaSLA(resumo){
    const labels = resumo.porMes.map(m => labelMes(m.mes));
    const cores = resumo.porMes.map(m => (m.pctSLA ?? 0) >= META_SLA ? "#10b981" : "#ef4444");
    if(charts.foraSla) charts.foraSla.destroy();
    charts.foraSla = new Chart(document.getElementById("chartForaSLA"), {
        type:"bar",
        data:{ labels, datasets:[{ label:"Fora do SLA", data: resumo.porMes.map(m=>m.foraSLA), backgroundColor: cores, borderRadius:6 }] },
        options: baseBarOptions()
    });
}

/* ---------- Chart: Taxa de SLA ---------- */
function renderChartSlaRate(resumo){
    const labels = resumo.porMes.map(m => labelMes(m.mes));
    if(charts.slaRate) charts.slaRate.destroy();
    charts.slaRate = new Chart(document.getElementById("chartSlaRate"), {
        type:"line",
        data:{ labels, datasets:[{ label:"% Dentro do SLA", data: resumo.porMes.map(m=>m.pctSLA), borderColor:"#10b981", backgroundColor:"rgba(16,185,129,.12)", fill:true, tension:.35, pointRadius:3 }] },
        options: baseLineOptions(true)
    });
}

/* ---------- Chart: Acumulado ---------- */
function renderChartAcumulado(resumo){
    const labels = resumo.porMes.map(m => labelMes(m.mes));
    let accTotal = 0, accConc = 0;
    const totalAcum = resumo.porMes.map(m => accTotal += m.total);
    const concAcum = resumo.porMes.map(m => accConc += m.concluidos);
    if(charts.acumulado) charts.acumulado.destroy();
    charts.acumulado = new Chart(document.getElementById("chartAcumulado"), {
        type:"line",
        data:{
            labels,
            datasets:[
                { label:"Total Acumulado", data: totalAcum, borderColor:"#4f46e5", backgroundColor:"rgba(79,70,229,.10)", fill:true, tension:.3, pointRadius:2 },
                { label:"Concluídos Acumulado", data: concAcum, borderColor:"#0ea5e9", backgroundColor:"rgba(14,165,233,.08)", fill:true, tension:.3, pointRadius:2 },
            ]
        },
        options: baseLineOptions()
    });
}

/* ---------- Chart: Variação mês a mês ---------- */
function renderChartVariacao(resumo){
    const meses = resumo.porMes;
    const labels = meses.slice(1).map(m => labelMes(m.mes));
    const varTotal = [], varFora = [];
    for(let i=1;i<meses.length;i++){
        const ant = meses[i-1], atu = meses[i];
        varTotal.push(ant.total > 0 ? +(100*(atu.total-ant.total)/ant.total).toFixed(1) : null);
        varFora.push(ant.foraSLA > 0 ? +(100*(atu.foraSLA-ant.foraSLA)/ant.foraSLA).toFixed(1) : null);
    }
    if(charts.variacao) charts.variacao.destroy();
    charts.variacao = new Chart(document.getElementById("chartVariacao"), {
        type:"bar",
        data:{
            labels,
            datasets:[
                { label:"Var. Total de Chamados %", data: varTotal, backgroundColor:"#8b5cf6", borderRadius:6 },
                { label:"Var. Fora do SLA %", data: varFora, backgroundColor:"#ec4899", borderRadius:6 },
            ]
        },
        options: baseBarOptions(true)
    });
}

/* ---------- Heatmap mês x cluster ---------- */
function renderHeatmap(resumo){
    const clusters = resumo.porCluster.map(c => c.cluster).slice(0, 8); // top 8 clusters
    const meses = [...new Set(resumo.porMesCluster.map(x => x.mes))].sort();

    const mapa = {}; // mes -> cluster -> pctSLA
    resumo.porMesCluster.forEach(x => {
        if(!mapa[x.mes]) mapa[x.mes] = {};
        mapa[x.mes][x.cluster] = x.pctSLA;
    });

    function classePct(p){
        if(p === null || p === undefined) return "heat-gray";
        if(p >= META_SLA) return "heat-green";
        if(p >= META_SLA - 15) return "heat-amber";
        return "heat-red";
    }

    let html = `<div style="overflow-x:auto;"><table class="data heat"><thead><tr><th>Mês</th>`;
    clusters.forEach(c => html += `<th>${esc(c)}</th>`);
    html += `</tr></thead><tbody>`;
    meses.forEach(mes => {
        html += `<tr><td style="font-weight:800;color:var(--navy);">${labelMes(mes)}</td>`;
        clusters.forEach(c => {
            const p = mapa[mes] && mapa[mes][c] !== undefined ? mapa[mes][c] : null;
            html += `<td><span class="heat-cell ${classePct(p)}">${p===null?"—":fmtPct(p)}</span></td>`;
        });
        html += `</tr>`;
    });
    html += `</tbody></table></div>
    <div class="heat-legend">
        <span class="heat-legend-item"><span class="heat-dot" style="background:#dcfce7;"></span>Dentro da meta (≥ ${META_SLA}%)</span>
        <span class="heat-legend-item"><span class="heat-dot" style="background:#fef3c7;"></span>Atenção</span>
        <span class="heat-legend-item"><span class="heat-dot" style="background:#fee2e2;"></span>Fora da meta</span>
    </div>`;

    document.getElementById("heatmapWrap").innerHTML = html;
}

/* ---------- Chart: comparativo entre clusters ---------- */
function renderChartClusters(resumo){
    const clusters = resumo.porCluster.map(c => c.cluster).slice(0, 6); // top 6 pra não poluir
    const meses = [...new Set(resumo.porMesCluster.map(x => x.mes))].sort();
    const labels = meses.map(labelMes);

    const mapa = {};
    resumo.porMesCluster.forEach(x => {
        if(!mapa[x.cluster]) mapa[x.cluster] = {};
        mapa[x.cluster][x.mes] = x.total;
    });

    const datasets = clusters.map((c, i) => ({
        label: c,
        data: meses.map(m => mapa[c] && mapa[c][m] !== undefined ? mapa[c][m] : 0),
        borderColor: CLUSTER_CORES[i % CLUSTER_CORES.length],
        backgroundColor: CLUSTER_CORES[i % CLUSTER_CORES.length],
        tension:.3, pointRadius:2,
    }));

    if(charts.clusters) charts.clusters.destroy();
    charts.clusters = new Chart(document.getElementById("chartClusters"), {
        type:"line",
        data:{ labels, datasets },
        options: baseLineOptions()
    });
}

/* ---------- Tabela detalhada ---------- */
function renderTabelaDetalhe(resumo){
    const linhas = resumo.porMes.map(m => {
        const ok = (m.pctSLA ?? 0) >= META_SLA;
        return `
        <tr>
            <td style="font-weight:800;color:var(--navy);">${labelMes(m.mes)}</td>
            <td>${fmtNum(m.total)}</td>
            <td>${fmtNum(m.concluidos)}</td>
            <td>${fmtNum(m.cancelados)}</td>
            <td>${fmtNum(m.dentroSLA)}</td>
            <td>${fmtNum(m.foraSLA)}</td>
            <td>${fmtPct(m.pctSLA)}</td>
            <td>${fmtHoras(m.ttrMedioH)}</td>
            <td>${fmtHoras(m.tmrMedioH)}</td>
            <td><span class="badge ${ok ? "badge-green" : "badge-red"}">${ok ? "✓ Na meta" : "✕ Abaixo"}</span></td>
        </tr>`;
    }).join("");

    document.getElementById("tabelaDetalhe").innerHTML = `
        <thead><tr>
            <th>Mês</th><th>Total</th><th>Concluídos</th><th>Cancelados</th>
            <th>Dentro SLA</th><th>Fora SLA</th><th>% SLA</th><th>TTR Médio</th><th>TMR Médio</th><th>Status</th>
        </tr></thead>
        <tbody>${linhas}</tbody>
    `;
}

/* ---------- Opções padrão dos gráficos (tema claro) ---------- */
function baseLineOptions(isPercent){
    return {
        responsive:true, maintainAspectRatio:false,
        interaction:{ mode:"index", intersect:false },
        plugins:{
            legend:{ position:"bottom", labels:{ usePointStyle:true, boxWidth:8, font:{ size:11 }, color:"#64748b" } },
            tooltip:{ backgroundColor:"#0f172a", padding:10, cornerRadius:8 }
        },
        scales:{
            x:{ grid:{ color:"#f1f5f9" }, ticks:{ color:"#94a3b8", font:{ size:11 } } },
            y:{ grid:{ color:"#f1f5f9" }, ticks:{ color:"#94a3b8", font:{ size:11 }, callback: v => isPercent ? v+"%" : v }, beginAtZero:true }
        }
    };
}
function baseBarOptions(centerZero){
    const opt = baseLineOptions();
    if(centerZero) opt.scales.y.ticks.callback = v => v+"%";
    return opt;
}
