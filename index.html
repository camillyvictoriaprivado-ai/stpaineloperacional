<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background: linear-gradient(135deg, #ff7a00, #111);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.box{
    background:#fff;
    padding:30px;
    border-radius:12px;
    width:320px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

button{
    width:100%;
    padding:12px;
    background:#ff7a00;
    border:none;
    color:#fff;
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#ff8f2f;
}

.msg{
    text-align:center;
    margin-top:10px;
    font-size:13px;
    color:red;
}
</style>

</head>

<body>

<div class="box">
    <h2>LOGIN</h2>

    <input type="text" id="user" placeholder="Usuário">
    <input type="password" id="pass" placeholder="Senha">

    <button onclick="login()">Entrar</button>

    <div class="msg" id="msg"></div>
</div>

<script>

function login(){

    const user = document.getElementById("user").value;
    const pass = document.getElementById("pass").value;

    if(user === "admin" && pass === "1234"){

        localStorage.setItem("logado", "true");

        // 👉 agora vai pro index.html
        window.location.href = "painel.html";

    } else {
        alert("Usuário ou senha inválidos");
    }
}

</script>

</body>
</html>
