<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Dashboard</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
    --indigo:#4f46e5;
    --violet:#7c3aed;
    --pink:#db2777;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at top left,
            rgba(124,58,237,.22),
            transparent 35%
        ),

        radial-gradient(
            circle at bottom right,
            rgba(79,70,229,.45),
            transparent 40%
        ),

        linear-gradient(
            135deg,
            #08111f,
            #0f1c31
        );

    position:relative;
    overflow:hidden;
}

body::before{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            rgba(255,255,255,.02) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.02) 1px,
            transparent 1px
        );

    background-size:40px 40px;

    pointer-events:none;
}

.box{
    width:100%;
    max-width:430px;

    padding:45px;

    border-radius:24px;

    background:
        rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    border:
        1px solid rgba(255,255,255,.12);

    box-shadow:
        0 30px 80px rgba(0,0,0,.45);

    position:relative;
    z-index:1;
}

h2{
    text-align:center;

    color:white;

    font-size:24px;

    font-weight:800;

    margin-bottom:30px;
}

input{
    width:100%;

    padding:15px 18px;

    margin-bottom:16px;

    border:none;

    border-radius:12px;

    background:
        rgba(255,255,255,.08);

    color:white;

    font-size:15px;

    font-family:'Inter',sans-serif;

    transition:.25s;
}

input::placeholder{
    color:rgba(255,255,255,.55);
}

input:focus{
    outline:none;

    background:
        rgba(255,255,255,.12);

    box-shadow:
        0 0 0 2px rgba(124,58,237,.55);
}

button{
    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            var(--indigo),
            var(--violet)
        );

    color:white;

    font-size:15px;

    font-weight:700;

    font-family:'Inter',sans-serif;

    cursor:pointer;

    transition:.25s;
}

button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 15px 30px rgba(79,70,229,.4);
}

button:active{
    transform:scale(.98);
}

.msg{
    text-align:center;

    margin-top:15px;

    color:#fb7185;

    font-size:14px;

    font-weight:600;
}

.msg.info{
    color:#fbbf24;
}

.footer{
    margin-top:25px;

    text-align:center;

    color:rgba(255,255,255,.45);

    font-size:12px;
}

.footer a{
    color:rgba(255,255,255,.75);
    font-weight:700;
    text-decoration:none;
}

.footer a:hover{
    text-decoration:underline;
}

.admin-link-wrap{
    margin-top:14px;
}

.admin-link{
    display:inline-block;
    padding:8px 16px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.65) !important;
    font-size:12px;
    font-weight:600;
    text-decoration:none !important;
    transition:.2s;
}

.admin-link:hover{
    background:rgba(255,255,255,.08);
    color:rgba(255,255,255,.9) !important;
    border-color:rgba(255,255,255,.3);
}

@media(max-width:480px){

    .box{
        padding:35px 25px;
    }

    h2{
        font-size:20px;
    }
}
</style>

</head>

<body>

<div class="box">

    <h2>Acesso ao Sistema</h2>

    <input type="text" id="user" placeholder="Usuário">

    <input type="password" id="pass" placeholder="Senha">

    <button onclick="login()">Entrar</button>

    <div class="msg" id="msg"></div>

    <div class="footer">
        Portal Operacional ST<br><br>
        Não tem conta? <a href="cadastro.html">Cadastre-se</a>
        <div class="admin-link-wrap">
            <a class="admin-link" href="admin.html">Aprovar cadastro</a>
        </div>
    </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxiJQKC3BIdr9d-CcsZgrakZgLFxdxINigTZLNZP61mh5moL414ssZqiZ7H_sQKhvlmHA/exec";

async function login(){

    const msg = document.getElementById("msg");
    msg.className = "msg";
    msg.textContent = "";

    const user = document.getElementById("user").value.trim();
    const pass = document.getElementById("pass").value.trim();

    if(!user || !pass){
        msg.textContent = "Preencha usuário e senha.";
        return;
    }

    const url = `${API_URL}?type=login&email=${encodeURIComponent(user)}&senha=${encodeURIComponent(pass)}`;

    try {
        const res = await fetch(url);
        const data = await res.json();

        if(data.status === "ok"){

            localStorage.setItem("token", data.token);
            localStorage.setItem("nivel", data.nivel);

            window.location.href = "painel.html";

        } else if (data.status === "pendente") {
            msg.className = "msg info";
            msg.textContent = "Seu cadastro ainda não foi aprovado pelo administrador.";
        } else {
            msg.textContent = "Usuário ou senha inválidos.";
        }
    } catch (err) {
        console.error(err);
        msg.textContent = "Não foi possível conectar. Tente novamente.";
    }
}

document.getElementById("pass").addEventListener("keydown", e => {
    if (e.key === "Enter") login();
});

</script>

</body>
</html>
