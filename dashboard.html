<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Diário</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

body{
    margin:0;
    font-family:'Orbitron', Arial, sans-serif;
    background:#f5f7fb;
    color:#111;
}

/* HEADER PADRONIZADO */
.header{
    background:#fff;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #ff7a00;
}

.header h1{ margin:0; }

.header div{
    display:flex;
    gap:10px;
}

/* BOTÕES */
.btn{
    border:none;
    padding:10px 14px;
    border-radius:6px;
    cursor:pointer;
    font-family:'Orbitron', sans-serif;
    transition:0.2s;
}

/* PRETO */
.btn-dark-custom{
    background:#111;
    color:#fff;
}

.btn-dark-custom:hover{
    background:#333;
}

/* AMARELO */
.btn-yellow{
    background:#ffcc00;
    color:#111;
    font-weight:600;
}

.btn-yellow:hover{
    background:#ffd633;
}

.back{
    padding:15px 20px;
}

.back button{
    background:#fff;
    border:1px solid #ff7a00;
    color:#ff7a00;
    padding:10px 14px;
    cursor:pointer;
}

.back button:hover{
    background:#ff7a00;
    color:#fff;
}

/* KPIS */
.kpis{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    padding:20px;
}

.kpi{
    background:#fff;
    border:1px solid #eee;
    border-radius:12px;
    padding:18px;
}

.kpi h3{ margin:0; font-size:13px; }

.kpi p{
    font-size:24px;
    margin:10px 0 0;
    color:#ff7a00;
    font-weight:bold;
}

/* GRÁFICOS */
.middle{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    padding:20px;
}

.panel{
    background:#fff;
    border:1px solid #eee;
    border-radius:12px;
    padding:15px;
}

.circle{
    width:140px;
    height:140px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    font-size:26px;
    background:conic-gradient(#ff7a00 0%, #eee 0%);
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
    <h1>Dashboard operacional</h1>

    <div>
        <button class="btn btn-dark-custom" onclick="window.location.href='painel.html'">
            ← VOLTAR AO PAINEL
        </button>

        <button class="btn btn-yellow" onclick="exportarExcel()">
            EXPORTAR EXCEL
        </button>
    </div>
</div>

<!-- KPIS -->
<div class="kpis">

    <div class="kpi">
        <h3>Aguardando Fechamento</h3>
        <p id="aguardando">0</p>
    </div>

    <div class="kpi">
        <h3>Cancelado</h3>
        <p id="cancelado">0</p>
    </div>

    <div class="kpi">
        <h3>Concluído</h3>
        <p id="concluido">0</p>
    </div>

    <div class="kpi">
        <h3>EPS / Baixa Incorreta</h3>
        <p id="eps">0</p>
    </div>

    <div class="kpi">
        <h3>Supervisor Cidade</h3>
        <p id="supervisor">0</p>
    </div>

    <div class="kpi">
        <h3>Responsável Fibra</h3>
        <p id="fibra">-</p>
    </div>

</div>

<!-- GRÁFICOS -->
<div class="middle">

    <div class="panel">
        <h3>Status Geral</h3>
        <canvas id="barChart"></canvas>
    </div>

    <div class="panel">
        <h3>Distribuição</h3>
        <canvas id="pieChart"></canvas>
    </div>

    <div class="panel">
        <h3>Por Cluster</h3>
        <canvas id="clusterChart"></canvas>
    </div>

    <div class="panel">
        <h3>Por Operadora</h3>
        <canvas id="operadoraChart"></canvas>
    </div>

    <div class="panel">
        <h3>Produtividade</h3>
        <div class="circle" id="circle">0%</div>
    </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby-4fOy9HAEmCUMndlLrPWJC7Gq62K5kSd3VWlo3EHEcug_68A5Uyv8hzzbJHtxh0t-Ig/exec";

let barChart, pieChart, clusterChart, operadoraChart;

function uniqueById(arr, key = "id") {
    const seen = new Set();
    return arr.filter(item => {
        const id = item[key];
        if (!id || seen.has(id)) return false;
        seen.add(id);
        return true;
    });
}

function get(obj, key){
    return (obj[key] || "").toString();
}

function getStatus(v){
    return (v || "").toString().trim().toUpperCase();
}

async function load(){

    const res = await fetch(API_URL);
    const data = await res.json();

    const base = uniqueById(data.base || [], "id");

    const aguardando = base.filter(i => getStatus(i.status) === "AGUARDANDO FECHAMENTO").length;
    const cancelado = base.filter(i => getStatus(i.status) === "CANCELADO").length;
    const concluido = base.filter(i => getStatus(i.status) === "CONCLUIDO").length;
    const eps = base.filter(i => getStatus(i.status) === "EPS/BAIXA DE MATERIAL INCORRETA").length;
    const supervisor = base.filter(i => getStatus(i.status) === "SUPERVISOR CIDADE").length;

    const fibraLista = base.map(i => get(i,"responsavel fibra").trim()).filter(v => v);
    const freqFibra = {};
    fibraLista.forEach(n => freqFibra[n] = (freqFibra[n] || 0) + 1);

    const fibraNome = Object.entries(freqFibra).sort((a,b)=>b[1]-a[1])[0]?.[0] || "-";

    const clusterMap = {};
    base.forEach(i=>{
        const c = get(i,"cluster") || "SEM CLUSTER";
        clusterMap[c] = (clusterMap[c] || 0) + 1;
    });

    const operadoraMap = {};
    base.forEach(i=>{
        const o = get(i,"responsavel fibra") || "SEM RESPONSAVEL";
        operadoraMap[o] = (operadoraMap[o] || 0) + 1;
    });

    document.getElementById("aguardando").innerText = aguardando;
    document.getElementById("cancelado").innerText = cancelado;
    document.getElementById("concluido").innerText = concluido;
    document.getElementById("eps").innerText = eps;
    document.getElementById("supervisor").innerText = supervisor;
    document.getElementById("fibra").innerText = fibraNome;

    const total = base.length;
    const perc = total ? Math.round((concluido / total) * 100) : 0;

    document.getElementById("circle").innerText = perc + "%";
    document.getElementById("circle").style.background =
        `conic-gradient(#ff7a00 ${perc}%, #eee ${perc}%)`;

    if(barChart) barChart.destroy();
    barChart = new Chart(document.getElementById("barChart"),{
        type:"bar",
        data:{
            labels:["Aguardando","Cancelado","Concluído","EPS","Supervisor"],
            datasets:[{ data:[aguardando,cancelado,concluido,eps,supervisor], backgroundColor:["#ff7a00","#111","#00aa55","#ff0055","#5555ff"] }]
        },
        options:{ plugins:{ legend:{ display:false } } }
    });

    if(pieChart) pieChart.destroy();
    pieChart = new Chart(document.getElementById("pieChart"),{
        type:"doughnut",
        data:{
            labels:["Concluído","Restante"],
            datasets:[{ data:[concluido, total-concluido], backgroundColor:["#ff7a00","#eee"] }]
        }
    });

    if(clusterChart) clusterChart.destroy();
    clusterChart = new Chart(document.getElementById("clusterChart"),{
        type:"bar",
        data:{
            labels:Object.keys(clusterMap),
            datasets:[{ data:Object.values(clusterMap), backgroundColor:"#ff7a00" }]
        },
        options:{ plugins:{ legend:{ display:false } } }
    });

    if(operadoraChart) operadoraChart.destroy();
    operadoraChart = new Chart(document.getElementById("operadoraChart"),{
        type:"bar",
        data:{
            labels:Object.keys(operadoraMap),
            datasets:[{ data:Object.values(operadoraMap), backgroundColor:"#111" }]
        },
        options:{ plugins:{ legend:{ display:false } } }
    });
}

async function exportarExcel(){

    try {

        const res = await fetch(API_URL);
        const data = await res.json();

        const base = uniqueById(data.base || [], "id");

        console.log("EXPORTANDO BASE:", base); // DEBUG

        if (!base || base.length === 0) {
            alert("Nenhum dado encontrado na base");
            return;
        }

        const ws = XLSX.utils.json_to_sheet(base);
        const wb = XLSX.utils.book_new();

        XLSX.utils.book_append_sheet(wb, ws, "Base");

        XLSX.writeFile(wb, "dashboard_diario.xlsx");

    } catch (err) {
        console.error("Erro no export:", err);
        alert("Erro ao exportar Excel. Veja o console.");
    }
}

load();
setInterval(load, 30000);

</script>

</body>
</html>
