<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Diário · TLP</title>

<script src="auth.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
    --indigo:#4f46e5;
    --violet:#7c3aed;
    --pink:#db2777;
    --orange:#f97316;
    --navy:#0f172a;
    --bg:#f1f5f9;
    --white:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --border-light:#f1f5f9;

    --emerald:#10b981;
    --emerald-bg:#f0fdf4;
    --emerald-text:#16a34a;

    --rose:#f43f5e;
    --rose-bg:#fff1f2;
    --rose-text:#e11d48;

    --amber:#fbbf24;
    --amber-bg:#fffbeb;
    --amber-text:#d97706;

    --indigo-bg:#eef2ff;
    --indigo-text:#4f46e5;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    opacity:0;
    transition:opacity .15s ease;
}

body.auth-ready{
    opacity:1;
}

/* HEADER */

.header{
    background:var(--white);

    padding:0 24px;
    height:64px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 1px 0 var(--border);

    position:sticky;
    top:0;
    z-index:20;
}

.header-left{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo-badge{
    width:36px;
    height:36px;
    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;
    shrink:0;

    background:linear-gradient(135deg,var(--orange),var(--indigo));

    color:white;
    font-weight:900;
    font-size:11px;
    letter-spacing:.02em;
}

.header h1{
    margin:0;
    color:var(--navy);
    font-size:16px;
    font-weight:800;
    line-height:1.2;
}

.header .subtitle{
    font-size:12px;
    color:var(--muted);
    font-weight:500;
    margin-top:2px;
}

.header-actions{
    display:flex;
    gap:10px;
}

/* BOTÕES */

.btn{
    border:none;

    padding:10px 16px;

    border-radius:12px;

    cursor:pointer;

    font-family:'Inter',sans-serif;

    font-size:13px;

    font-weight:700;

    display:inline-flex;
    align-items:center;
    gap:8px;

    transition:.2s ease;
}

.btn-ghost{
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--border);
}

.btn-ghost:hover{
    border-color:var(--indigo);
    color:var(--indigo);
}

.btn-primary{
    background:linear-gradient(135deg,var(--indigo),var(--violet));
    color:white;
    box-shadow:0 4px 12px rgba(79,70,229,.25);
}

.btn-primary:hover{
    opacity:.92;
    transform:translateY(-1px);
}

/* WRAPPER */

.content{
    max-width:1400px;
    margin:0 auto;
    padding:24px;
}

/* KPIs */

.kpis{
    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

    gap:16px;

    margin-bottom:20px;
}

.kpi{
    background:var(--white);

    border:1px solid var(--border-light);

    border-radius:20px;

    padding:20px 22px;

    box-shadow:0 1px 2px rgba(15,23,42,.04);

    transition:.2s ease;

    position:relative;
    overflow:hidden;
}

.kpi:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(15,23,42,.08);
    border-color:transparent;
}

.kpi-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.kpi h3{
    margin:0;
    color:var(--muted);
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.05em;
}

.kpi-dot{
    width:9px;
    height:9px;
    border-radius:999px;
    flex-shrink:0;
}

.kpi p{
    font-size:28px;
    margin:0;
    color:var(--navy);
    font-weight:900;
    line-height:1.15;
}

.kpi p.small-multiline{
    font-size:14px;
    font-weight:700;
    line-height:1.6;
    color:var(--navy);
}

.kpi p.small-multiline b{
    font-weight:900;
}

/* PAINÉIS */

.middle{
    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(440px,1fr));

    gap:16px;
}

.panel{
    background:var(--white);

    border:1px solid var(--border-light);

    border-radius:20px;

    padding:22px;

    box-shadow:0 1px 2px rgba(15,23,42,.04);
}

.panel-head{
    display:flex;
    align-items:center;
    justify-content:between;
    margin-bottom:16px;
}

/* GRÁFICO CIRCULAR */

.circle-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px 0;
}

.circle{
    width:160px;
    height:160px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;

    font-weight:900;

    color:var(--navy);

    background:conic-gradient(
        var(--indigo) 0%,
        var(--violet) 65%,
        #e7ebf0 65%
    );

    position:relative;
}

.circle::before{
    content:"";

    position:absolute;

    width:118px;
    height:118px;

    background:white;

    border-radius:50%;
}

.circle span{
    position:relative;
    z-index:1;
}

/* TÍTULOS DOS PAINÉIS */

.panel h3,
.panel h4,
.panel h5{
    color:var(--navy);
    font-weight:800;
    font-size:14px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:8px;
}

.panel h3::before{
    content:"";
    width:4px;
    height:14px;
    border-radius:4px;
    background:linear-gradient(180deg,var(--indigo),var(--violet));
    display:inline-block;
}

/* badge pill usado opcionalmente */
.pill{
    font-size:10px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:3px 9px;
    border-radius:999px;
}

/* RESPONSIVO */

@media(max-width:768px){

    .header{
        padding:0 16px;
    }

    .header h1{
        font-size:14px;
    }

    .header .subtitle{
        display:none;
    }

    .btn span.btn-text{
        display:none;
    }

    .content{
        padding:16px;
    }

    .middle{
        grid-template-columns:1fr;
    }

    .circle{
        width:140px;
        height:140px;
    }

    .circle::before{
        width:104px;
        height:104px;
    }
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="header-left">
        <div class="logo-badge">TLP</div>
        <div>
            <h1>Dashboard operacional</h1>
            <div class="subtitle">Visão geral em tempo real</div>
        </div>
    </div>

    <div class="header-actions">
        <button class="btn btn-ghost" onclick="window.location.href='painel.html'">
            ← <span class="btn-text">Voltar ao Painel</span>
        </button>

        <button class="btn btn-primary" onclick="exportarExcel()">
            ⬇ <span class="btn-text">Exportar Excel</span>
        </button>
    </div>
</div>

<div class="content">

<!-- KPIS -->
<div class="kpis">

    <div class="kpi">
        <div class="kpi-top">
            <h3>Aguardando Fechamento</h3>
            <span class="kpi-dot" style="background:#f97316"></span>
        </div>
        <p id="aguardando">0</p>
    </div>

    <div class="kpi">
        <div class="kpi-top">
            <h3>Cancelado</h3>
            <span class="kpi-dot" style="background:#0f172a"></span>
        </div>
        <p id="cancelado">0</p>
    </div>

    <div class="kpi">
        <div class="kpi-top">
            <h3>Concluído</h3>
            <span class="kpi-dot" style="background:#10b981"></span>
        </div>
        <p id="concluido">0</p>
    </div>

    <div class="kpi">
        <div class="kpi-top">
            <h3>EPS / Baixa Incorreta</h3>
            <span class="kpi-dot" style="background:#f43f5e"></span>
        </div>
        <p id="eps">0</p>
    </div>

    <div class="kpi">
        <div class="kpi-top">
            <h3>Supervisor Cidade</h3>
            <span class="kpi-dot" style="background:#4f46e5"></span>
        </div>
        <p id="supervisor">0</p>
    </div>

    <div class="kpi">
        <div class="kpi-top">
            <h3>Responsável Fibra</h3>
            <span class="kpi-dot" style="background:#7c3aed"></span>
        </div>
        <p id="fibra">-</p>
    </div>

    <div class="kpi">
        <div class="kpi-top">
            <h3>Previsão Mensal</h3>
            <span class="kpi-dot" style="background:#db2777"></span>
        </div>
        <p class="small-multiline" id="previsao">0</p>
    </div>

</div>

<!-- GRÁFICOS -->
<div class="middle">

    <div class="panel">
        <h3>Status Geral</h3>
        <canvas id="barChart"></canvas>
    </div>

    <div class="panel">
        <h3>Distribuição</h3>
        <canvas id="pieChart"></canvas>
    </div>

    <div class="panel">
        <h3>Por Cluster</h3>
        <canvas id="clusterChart"></canvas>
    </div>

    <div class="panel">
        <h3>Produtividade</h3>
        <div class="circle-wrap">
            <div class="circle" id="circle"><span>0%</span></div>
        </div>
    </div>

    <div class="panel">
        <h3>Projeção Mensal</h3>
        <canvas id="forecastChart"></canvas>
    </div>

</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby-4fOy9HAEmCUMndlLrPWJC7Gq62K5kSd3VWlo3EHEcug_68A5Uyv8hzzbJHtxh0t-Ig/exec";

let barChart, pieChart, clusterChart, forecastChart;

const CHART_FONT = "'Inter', sans-serif";
Chart.defaults.font.family = CHART_FONT;
Chart.defaults.color = "#64748b";

function uniqueById(arr, key = "id") {
    const seen = new Set();
    return arr.filter(item => {
        const id = item[key];
        if (!id || seen.has(id)) return false;
        seen.add(id);
        return true;
    });
}

function get(obj, key){
    return (obj[key] || "").toString();
}

function getStatus(v){
    return (v || "").toString().trim().toUpperCase();
}

async function load(){

    const res = await fetch(API_URL);
    const data = await res.json();

    const base = uniqueById(data.base || [], "id");

    const aguardando = base.filter(i => getStatus(i.status) === "AGUARDANDO FECHAMENTO").length;
    const cancelado = base.filter(i => getStatus(i.status) === "CANCELADO").length;
    const concluido = base.filter(i => getStatus(i.status) === "CONCLUIDO").length;
    const eps = base.filter(i => getStatus(i.status) === "EPS/BAIXA DE MATERIAL INCORRETA").length;
    const supervisor = base.filter(i => getStatus(i.status) === "SUPERVISOR CIDADE").length;

    const fibraLista = base.map(i => get(i,"responsavel fibra").trim()).filter(v => v);
    const freqFibra = {};
    fibraLista.forEach(n => freqFibra[n] = (freqFibra[n] || 0) + 1);

    const fibraNome = Object.entries(freqFibra).sort((a,b)=>b[1]-a[1])[0]?.[0] || "-";

    const clusterMap = {};
    base.forEach(i=>{
        const c = get(i,"cluster") || "SEM CLUSTER";
        clusterMap[c] = (clusterMap[c] || 0) + 1;
    });

    document.getElementById("aguardando").innerText = aguardando;
    document.getElementById("cancelado").innerText = cancelado;
    document.getElementById("concluido").innerText = concluido;
    document.getElementById("eps").innerText = eps;
    document.getElementById("supervisor").innerText = supervisor;
    document.getElementById("fibra").innerText = fibraNome;

    const total = base.length;
const perc = total ? Math.round((concluido / total) * 100) : 0;

// ===== PREVISÃO MENSAL =====

const hoje = new Date();

const diasNoMes = new Date(
    hoje.getFullYear(),
    hoje.getMonth() + 1,
    0
).getDate();

const diaAtual = hoje.getDate();

const mediaDia = diaAtual > 0
    ? total / diaAtual
    : 0;

const totalPrevisto =
    Math.round(mediaDia * diasNoMes);

const previsaoAdicional =
    totalPrevisto - total;

const metaMensal = 1400;

const faltamMeta = Math.max(
    0,
    metaMensal - total
);

document.getElementById("previsao").innerHTML = `
    Atual: <b>${total.toLocaleString("pt-BR")}</b><br>
    Prev.: <b>+${previsaoAdicional.toLocaleString("pt-BR")}</b><br>
    Total: <b>${totalPrevisto.toLocaleString("pt-BR")}</b>
`;

document.querySelector("#circle span").innerText = perc + "%";
    document.getElementById("circle").style.background =
        `conic-gradient(#4f46e5 ${perc}%, #e7ebf0 ${perc}%)`;

    const gridColor = "#f1f5f9";

    if(barChart) barChart.destroy();
    barChart = new Chart(document.getElementById("barChart"),{
        type:"bar",
        data:{
            labels:["Aguardando","Cancelado","Concluído","EPS","Supervisor"],
            datasets:[{
                data:[aguardando,cancelado,concluido,eps,supervisor],
                backgroundColor:["#f97316","#0f172a","#10b981","#f43f5e","#4f46e5"],
                borderRadius:8,
                maxBarThickness:48
            }]
        },
        options:{
            plugins:{ legend:{ display:false } },
            scales:{
                x:{ grid:{ display:false } },
                y:{ grid:{ color:gridColor }, beginAtZero:true }
            }
        }
    });

    if(pieChart) pieChart.destroy();
    pieChart = new Chart(document.getElementById("pieChart"),{
        type:"doughnut",
        data:{
            labels:["Concluído","Restante"],
            datasets:[{ data:[concluido, total-concluido], backgroundColor:["#4f46e5","#e7ebf0"], borderWidth:0 }]
        },
        options:{
            cutout:"68%",
            plugins:{ legend:{ position:"bottom", labels:{ usePointStyle:true, boxWidth:8, padding:16, font:{ weight:600, size:12 } } } }
        }
    });

    if(clusterChart) clusterChart.destroy();
    clusterChart = new Chart(document.getElementById("clusterChart"),{
        type:"bar",
        data:{
            labels:Object.keys(clusterMap),
            datasets:[{ data:Object.values(clusterMap), backgroundColor:"#7c3aed", borderRadius:8, maxBarThickness:40 }]
        },
        options:{
            plugins:{ legend:{ display:false } },
            scales:{
                x:{ grid:{ display:false } },
                y:{ grid:{ color:gridColor }, beginAtZero:true }
            }
        }
    });

    // ===== GRÁFICO DE PROJEÇÃO =====

if(forecastChart) forecastChart.destroy();

forecastChart = new Chart(
    document.getElementById("forecastChart"),
    {
        type:"bar",
        data:{
            labels:[
    "Atual",
    "Previsão",
    "Total Previsto"
],
datasets:[{
    data:[
        total,
        previsaoAdicional,
        totalPrevisto
    ],
                backgroundColor:[
                    "#0f172a",
                    "#f97316",
                    "#10b981"
                ],
                borderRadius:8,
                maxBarThickness:56
            }]
        },
        options:{
            responsive:true,
            plugins:{
                legend:{
                    display:false
                },
                tooltip:{
                    callbacks:{
                        label:(ctx)=>
                            ctx.raw.toLocaleString("pt-BR")
                    }
                }
            },
            scales:{
                x:{ grid:{ display:false } },
                y:{
                    grid:{ color:gridColor },
                    beginAtZero:true
                }
            }
        }
    }
);

}

async function exportarExcel(){

    try {

        const res = await fetch(API_URL);
        const data = await res.json();

        const base = uniqueById(data.base || [], "id");

        console.log("EXPORTANDO BASE:", base); // DEBUG

        if (!base || base.length === 0) {
            alert("Nenhum dado encontrado na base");
            return;
        }

        const ws = XLSX.utils.json_to_sheet(base);
        const wb = XLSX.utils.book_new();

        XLSX.utils.book_append_sheet(wb, ws, "Base");

        XLSX.writeFile(wb, "dashboard_diario.xlsx");

    } catch (err) {
        console.error("Erro no export:", err);
        alert("Erro ao exportar Excel. Veja o console.");
    }
}

load();
setInterval(load, 30000);

</script>

</body>
</html>
