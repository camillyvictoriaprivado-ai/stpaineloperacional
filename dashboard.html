<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Diário</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

:root{
    --primary:#f58220;
    --primary-light:#ff9f43;
    --secondary:#003a70;
    --bg:#f4f6f9;
    --white:#ffffff;
    --text:#222;
    --border:#e6eaef;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* HEADER */

.header{
    background:white;

    padding:18px 25px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:
        0 2px 12px rgba(0,0,0,.05);
}

.header h1{
    margin:0;

    color:var(--secondary);

    font-size:24px;

    font-weight:800;
}

.header div{
    display:flex;
    gap:10px;
}

/* BOTÕES */

.btn{
    border:none;

    padding:11px 16px;

    border-radius:10px;

    cursor:pointer;

    font-family:'Montserrat',sans-serif;

    font-weight:600;

    transition:.25s;
}

.btn-dark-custom{
    background:var(--secondary);
    color:white;
}

.btn-dark-custom:hover{
    background:#004d91;
}

.btn-yellow{
    background:var(--primary);
    color:white;
    font-weight:700;
}

.btn-yellow:hover{
    background:var(--primary-light);
}

/* VOLTAR */

.back{
    padding:20px;
}

.back button{
    background:white;

    border:1px solid var(--border);

    color:var(--secondary);

    padding:10px 16px;

    border-radius:10px;

    cursor:pointer;

    transition:.25s;
}

.back button:hover{
    background:var(--secondary);
    color:white;
}

/* KPIs */

.kpis{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(240px,1fr));

    gap:20px;

    padding:20px;
}

.kpi{
    background:white;

    border:none;

    border-radius:18px;

    padding:22px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.06);

    transition:.25s;
}

.kpi:hover{
    transform:translateY(-3px);

    box-shadow:
        0 10px 25px rgba(0,0,0,.08);
}

.kpi h3{
    margin:0;

    color:#666;

    font-size:14px;

    font-weight:600;
}

.kpi p{
    font-size:30px;

    margin-top:12px;

    color:var(--secondary);

    font-weight:800;

    line-height:1.2;
}

/* PAINÉIS */

.middle{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(450px,1fr));

    gap:20px;

    padding:20px;
}

.panel{
    background:white;

    border:none;

    border-radius:18px;

    padding:20px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.06);
}

/* GRÁFICO CIRCULAR */

.circle{
    width:160px;
    height:160px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:auto;

    font-size:30px;

    font-weight:800;

    color:var(--secondary);

    background:
        conic-gradient(
            var(--primary) 0%,
            var(--primary-light) 65%,
            #e7ebf0 65%
        );

    position:relative;
}

.circle::before{
    content:"";

    position:absolute;

    width:120px;
    height:120px;

    background:white;

    border-radius:50%;
}

.circle span{
    position:relative;
    z-index:1;
}

/* TÍTULOS DOS PAINÉIS */

.panel h3,
.panel h4,
.panel h5{
    color:var(--secondary);
    font-weight:700;
    margin-bottom:15px;
}

/* RESPONSIVO */

@media(max-width:768px){

    .header{
        flex-direction:column;
        gap:15px;
    }

    .header h1{
        font-size:20px;
    }

    .middle{
        grid-template-columns:1fr;
    }

    .circle{
        width:140px;
        height:140px;
    }

    .circle::before{
        width:105px;
        height:105px;
    }

}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
    <h1>Dashboard operacional</h1>

    <div>
        <button class="btn btn-dark-custom" onclick="window.location.href='painel.html'">
            ← Voltar ao Painel
        </button>

        <button class="btn btn-yellow" onclick="exportarExcel()">
            EXPORTAR EXCEL
        </button>
    </div>
</div>

<!-- KPIS -->
<div class="kpis">

    <div class="kpi">
        <h3>Aguardando Fechamento</h3>
        <p id="aguardando">0</p>
    </div>

    <div class="kpi">
        <h3>Cancelado</h3>
        <p id="cancelado">0</p>
    </div>

    <div class="kpi">
        <h3>Concluído</h3>
        <p id="concluido">0</p>
    </div>

    <div class="kpi">
        <h3>EPS / Baixa Incorreta</h3>
        <p id="eps">0</p>
    </div>

    <div class="kpi">
        <h3>Supervisor Cidade</h3>
        <p id="supervisor">0</p>
    </div>

    <div class="kpi">
        <h3>Responsável Fibra</h3>
        <p id="fibra">-</p>
    </div>

    <div class="kpi">
        <h3>Previsão Mensal</h3>
        <p id="previsao">0</p>
    </div>

</div>

<!-- GRÁFICOS -->
<div class="middle">

    <div class="panel">
        <h3>Status Geral</h3>
        <canvas id="barChart"></canvas>
    </div>

    <div class="panel">
        <h3>Distribuição</h3>
        <canvas id="pieChart"></canvas>
    </div>

    <div class="panel">
        <h3>Por Cluster</h3>
        <canvas id="clusterChart"></canvas>
    </div>

    <div class="panel">
        <h3>Produtividade</h3>
        <div class="circle" id="circle">0%</div>
    </div>

    <div class="panel">
        <h3>Projeção Mensal</h3>
        <canvas id="forecastChart"></canvas>
    </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby-4fOy9HAEmCUMndlLrPWJC7Gq62K5kSd3VWlo3EHEcug_68A5Uyv8hzzbJHtxh0t-Ig/exec";

let barChart, pieChart, clusterChart, forecastChart;

function uniqueById(arr, key = "id") {
    const seen = new Set();
    return arr.filter(item => {
        const id = item[key];
        if (!id || seen.has(id)) return false;
        seen.add(id);
        return true;
    });
}

function get(obj, key){
    return (obj[key] || "").toString();
}

function getStatus(v){
    return (v || "").toString().trim().toUpperCase();
}

async function load(){

    const res = await fetch(API_URL);
    const data = await res.json();

    const base = uniqueById(data.base || [], "id");

    const aguardando = base.filter(i => getStatus(i.status) === "AGUARDANDO FECHAMENTO").length;
    const cancelado = base.filter(i => getStatus(i.status) === "CANCELADO").length;
    const concluido = base.filter(i => getStatus(i.status) === "CONCLUIDO").length;
    const eps = base.filter(i => getStatus(i.status) === "EPS/BAIXA DE MATERIAL INCORRETA").length;
    const supervisor = base.filter(i => getStatus(i.status) === "SUPERVISOR CIDADE").length;

    const fibraLista = base.map(i => get(i,"responsavel fibra").trim()).filter(v => v);
    const freqFibra = {};
    fibraLista.forEach(n => freqFibra[n] = (freqFibra[n] || 0) + 1);

    const fibraNome = Object.entries(freqFibra).sort((a,b)=>b[1]-a[1])[0]?.[0] || "-";

    const clusterMap = {};
    base.forEach(i=>{
        const c = get(i,"cluster") || "SEM CLUSTER";
        clusterMap[c] = (clusterMap[c] || 0) + 1;
    });

    document.getElementById("aguardando").innerText = aguardando;
    document.getElementById("cancelado").innerText = cancelado;
    document.getElementById("concluido").innerText = concluido;
    document.getElementById("eps").innerText = eps;
    document.getElementById("supervisor").innerText = supervisor;
    document.getElementById("fibra").innerText = fibraNome;

    const total = base.length;
const perc = total ? Math.round((concluido / total) * 100) : 0;

// ===== PREVISÃO MENSAL =====

const hoje = new Date();

const diasNoMes = new Date(
    hoje.getFullYear(),
    hoje.getMonth() + 1,
    0
).getDate();

const diaAtual = hoje.getDate();

const mediaDia = diaAtual > 0
    ? total / diaAtual
    : 0;

const totalPrevisto =
    Math.round(mediaDia * diasNoMes);

const previsaoAdicional =
    totalPrevisto - total;

const metaMensal = 1400;

const faltamMeta = Math.max(
    0,
    metaMensal - total
);

document.getElementById("previsao").innerHTML = `
    Atual: ${total.toLocaleString("pt-BR")}<br>
    Prev.: +${previsaoAdicional.toLocaleString("pt-BR")}<br>
    Total: ${totalPrevisto.toLocaleString("pt-BR")}
`;

document.getElementById("circle").innerText = perc + "%";
    document.getElementById("circle").style.background =
        `conic-gradient(#ff7a00 ${perc}%, #eee ${perc}%)`;

    if(barChart) barChart.destroy();
    barChart = new Chart(document.getElementById("barChart"),{
        type:"bar",
        data:{
            labels:["Aguardando","Cancelado","Concluído","EPS","Supervisor"],
            datasets:[{ data:[aguardando,cancelado,concluido,eps,supervisor], backgroundColor:["#ff7a00","#111","#00aa55","#ff0055","#5555ff"] }]
        },
        options:{ plugins:{ legend:{ display:false } } }
    });

    if(pieChart) pieChart.destroy();
    pieChart = new Chart(document.getElementById("pieChart"),{
        type:"doughnut",
        data:{
            labels:["Concluído","Restante"],
            datasets:[{ data:[concluido, total-concluido], backgroundColor:["#ff7a00","#eee"] }]
        }
    });

    if(clusterChart) clusterChart.destroy();
    clusterChart = new Chart(document.getElementById("clusterChart"),{
        type:"bar",
        data:{
            labels:Object.keys(clusterMap),
            datasets:[{ data:Object.values(clusterMap), backgroundColor:"#ff7a00" }]
        },
        options:{ plugins:{ legend:{ display:false } } }
    });

    // ===== GRÁFICO DE PROJEÇÃO =====

if(forecastChart) forecastChart.destroy();

forecastChart = new Chart(
    document.getElementById("forecastChart"),
    {
        type:"bar",
        data:{
            labels:[
    "Atual",
    "Previsão",
    "Total Previsto"
],
datasets:[{
    data:[
        total,
        previsaoAdicional,
        totalPrevisto
    ],
                backgroundColor:[
                    "#111",
                    "#ff7a00",
                    "#00aa55"
                ]
            }]
        },
        options:{
            responsive:true,
            plugins:{
                legend:{
                    display:false
                },
                tooltip:{
                    callbacks:{
                        label:(ctx)=>
                            ctx.raw.toLocaleString("pt-BR")
                    }
                }
            },
            scales:{
                y:{
                    beginAtZero:true
                }
            }
        }
    }
);

}

async function exportarExcel(){

    try {

        const res = await fetch(API_URL);
        const data = await res.json();

        const base = uniqueById(data.base || [], "id");

        console.log("EXPORTANDO BASE:", base); // DEBUG

        if (!base || base.length === 0) {
            alert("Nenhum dado encontrado na base");
            return;
        }

        const ws = XLSX.utils.json_to_sheet(base);
        const wb = XLSX.utils.book_new();

        XLSX.utils.book_append_sheet(wb, ws, "Base");

        XLSX.writeFile(wb, "dashboard_diario.xlsx");

    } catch (err) {
        console.error("Erro no export:", err);
        alert("Erro ao exportar Excel. Veja o console.");
    }
}

load();
setInterval(load, 30000);

</script>

</body>
</html>
