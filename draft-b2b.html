<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard B2B</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

body{
    background:#f5f7fb;
    font-family:'Orbitron',sans-serif;
    color:#111;
}

.card-kpi,
.chart-card{
    background:#fff;
    border:none;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.kpi-value{
    font-size:32px;
    font-weight:700;
    color:#ff7a00;
}

.chart-card{
    padding:15px;
}

h2{
    font-weight:700;
    color:#111;
}

.table thead th{
    background:#111 !important;
    color:#fff;
    border:none;
}

.table tbody tr:hover{
    background:rgba(255,122,0,.08);
}

/* BOTÕES PADRÃO ERP */
.btn-dark{
    background:#111;
    border:none;
}

.btn-warning{
    background:#ffcc00;
    border:none;
    color:#111;
    font-weight:600;
}

.btn-warning:hover{
    background:#ffd633;
}

</style>

</head>
<body>

<div class="container-fluid p-4">

<h2 class="mb-4">Dashboard Projetos B2B</h2>

<!-- BOTÕES ALINHADOS À DIREITA -->
<div class="d-flex justify-content-end gap-2 mb-3">

    <a href="painel.html" class="btn btn-dark px-4">
        ← Voltar ao Painel
    </a>

    <button class="btn btn-warning px-4" onclick="exportarExcel()">
        Exportar Excel
    </button>

</div>

<!-- KPI -->
<div class="row g-3 mb-4">

<div class="col-md-4">
<div class="card card-kpi">
<div class="card-body text-center">
<div>Total Projetos</div>
<div id="totalProjetos" class="kpi-value">0</div>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card card-kpi">
<div class="card-body text-center">
<div>Entregues</div>
<div id="entregues" class="kpi-value">0</div>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card card-kpi">
<div class="card-body text-center">
<div>Pendentes</div>
<div id="pendentes" class="kpi-value">0</div>
</div>
</div>
</div>

</div>

<!-- GRÁFICOS -->
<div class="row g-4 mb-4">

    <div class="col-lg-6">
        <div class="card chart-card">
            <h5>Entregues x Pendentes</h5>
            <canvas id="entregaChart"></canvas>
        </div>
    </div>

    <div class="col-lg-6">
        <div class="card chart-card">
            <h5>Status AutoCAD</h5>
            <canvas id="autocadChart"></canvas>
        </div>
    </div>

</div>

<div class="row g-4 mb-4">

    <div class="col-lg-6">
        <div class="card chart-card">
            <h5>Projetos por Responsável</h5>
            <canvas id="responsavelChart"></canvas>
        </div>
    </div>

    <div class="col-lg-6">
        <div class="card chart-card">
            <h5>Projetos por Projetista</h5>
            <canvas id="projetistaChart"></canvas>
        </div>
    </div>

</div>

<!-- TABELA -->
<div class="card chart-card">
<div class="card-body">

<h5 class="mb-3">Projetos B2B</h5>

<div class="table-responsive">

<table class="table table-striped table-hover">

<thead>
<tr>
<th>Projeto</th>
<th>Projetista</th>
<th>AutoCAD</th>
<th>Responsável</th>
<th>Entregue</th>
<th>Previsão</th>
</tr>
</thead>

<tbody id="tabelaProjetos"></tbody>

</table>

</div>

</div>
</div>

</div>

<script>

let projetosGlobais = [];

const API_URL =
"https://script.google.com/macros/s/AKfycby-4fOy9HAEmCUMndlLrPWJC7Gq62K5kSd3VWlo3EHEcug_68A5Uyv8hzzbJHtxh0t-Ig/exec";

function agrupar(lista, campo){
    const mapa = {};
    lista.forEach(item=>{
        const chave = item[campo] || "Sem Informação";
        mapa[chave] = (mapa[chave] || 0) + 1;
    });
    return mapa;
}

async function carregar(){

    const res = await fetch(API_URL + "?v=" + Date.now());
    const data = await res.json();

    const projetos = data.b2b || [];
    projetosGlobais = projetos;

    const entregues = projetos.filter(p =>
        String(p.entregue || "").trim().toUpperCase() === "OK"
    ).length;

    const pendentes = projetos.filter(p =>
        String(p.entregue || "").trim().toUpperCase() === "PENDENTE"
    ).length;

    document.getElementById("totalProjetos").innerText = projetos.length;
    document.getElementById("entregues").innerText = entregues;
    document.getElementById("pendentes").innerText = pendentes;

    montarGraficos(projetos, entregues, pendentes);
    montarTabela(projetos);
}

function montarGraficos(projetos, entregues, pendentes){

    new Chart(document.getElementById("entregaChart"), {
        type:"doughnut",
        data:{
            labels:["Entregues","Pendentes"],
            datasets:[{
                data:[entregues, pendentes],
                backgroundColor:["#ff7a00","#111111"]
            }]
        }
    });

    const responsavel = agrupar(projetos,"responsavel");

    new Chart(document.getElementById("responsavelChart"), {
        type:"bar",
        data:{
            labels:Object.keys(responsavel),
            datasets:[{
                label:"Projetos",
                data:Object.values(responsavel),
                backgroundColor:"#ff7a00"
            }]
        }
    });

    const projetista = agrupar(projetos,"projetista");

    new Chart(document.getElementById("projetistaChart"), {
        type:"bar",
        data:{
            labels:Object.keys(projetista),
            datasets:[{
                label:"Projetos",
                data:Object.values(projetista),
                backgroundColor:"#111111"
            }]
        }
    });

    let concluido = 0;
    let elaboracao = 0;

    projetos.forEach(p=>{
        const status = String(p["projeto autocad"] || "").trim().toUpperCase();
        if(status === "SIM"){
            concluido++;
        } else {
            elaboracao++;
        }
    });

    new Chart(document.getElementById("autocadChart"), {
        type:"pie",
        data:{
            labels:["Concluído","Em Elaboração"],
            datasets:[{
                data:[concluido, elaboracao],
                backgroundColor:["#ff7a00","#111111"]
            }]
        }
    });
}

function montarTabela(projetos){

    const tbody = document.getElementById("tabelaProjetos");
    tbody.innerHTML = "";

    projetos.forEach(p=>{

        const status = String(p.entregue || "").trim().toUpperCase();

        let statusClass = "";
        if(status === "OK"){
            statusClass = "status-ok";
        } else if(status === "PENDENTE"){
            statusClass = "status-pendente";
        }

        tbody.innerHTML += `
        <tr>
            <td>${p.projeto || ""}</td>
            <td>${p.projetista || ""}</td>
            <td>${p["projeto autocad"] || ""}</td>
            <td>${p.responsavel || ""}</td>
            <td class="${statusClass}">${p.entregue || ""}</td>
            <td>${p.previsao || ""}</td>
        </tr>
        `;
    });
}

function exportarExcel(){

    if(!projetosGlobais.length){
        alert("Nenhum dado para exportar");
        return;
    }

    const dados = projetosGlobais.map(p=>({
        Projeto: p.projeto || "",
        Projetista: p.projetista || "",
        AutoCAD: p["projeto autocad"] || "",
        Responsavel: p.responsavel || "",
        Entregue: p.entregue || "",
        Previsao: p.previsao || ""
    }));

    const ws = XLSX.utils.json_to_sheet(dados);
    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, ws, "B2B");

    XLSX.writeFile(wb, "projetos_b2b.xlsx");
}

carregar();

</script>

</body>
</html>
