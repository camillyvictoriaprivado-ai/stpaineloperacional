<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard B2B</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

body{
    background:#f5f7fb;
    font-family:'Orbitron',sans-serif;
    color:#111;
}

.card-kpi,
.chart-card{
    background:#fff;
    border:none;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.kpi-value{
    font-size:32px;
    font-weight:700;
    color:#ff7a00;
}

.chart-card{
    padding:15px;
}

h2{
    font-weight:700;
    color:#111;
}

.table thead th{
    background:#111 !important;
    color:#fff;
    border:none;
}

.table tbody tr:hover{
    background:rgba(255,122,0,.08);
}

.btn-dark{
    background:#111;
    border:none;
}

.btn-warning{
    background:#ffcc00;
    border:none;
    color:#111;
    font-weight:600;
}

.btn-warning:hover{
    background:#ffd633;
}

.filter-box{
    background:#fff;
    padding:10px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.06);
}

</style>

</head>

<body>

<div class="container-fluid p-4">

<h2 class="mb-4">Dashboard Projetos B2B</h2>

<div class="d-flex justify-content-end gap-2 mb-3">
    <a href="painel.html" class="btn btn-dark px-4">← Voltar ao Painel</a>
    <button class="btn btn-warning px-4" onclick="exportarExcel()">Exportar Excel</button>
</div>

<!-- KPI -->
<div class="row g-3 mb-4">

<div class="col-md-4">
<div class="card card-kpi"><div class="card-body text-center">
<div>Total Projetos</div>
<div id="totalProjetos" class="kpi-value">0</div>
</div></div>
</div>

<div class="col-md-4">
<div class="card card-kpi"><div class="card-body text-center">
<div>Entregues</div>
<div id="entregues" class="kpi-value">0</div>
</div></div>
</div>

<div class="col-md-4">
<div class="card card-kpi"><div class="card-body text-center">
<div>Pendentes</div>
<div id="pendentes" class="kpi-value">0</div>
</div></div>
</div>

</div>

<!-- GRÁFICOS -->
<div class="row g-4 mb-4">

<div class="col-lg-4">
<div class="card chart-card">
<h5>Entregues x Pendentes</h5>
<canvas id="entregaChart"></canvas>
</div>
</div>

<div class="col-lg-4">
<div class="card chart-card">
<h5>Status AutoCAD</h5>
<canvas id="autocadChart"></canvas>
</div>
</div>

<div class="col-lg-4">
<div class="card chart-card">
<h5>Responsáveis</h5>
<canvas id="responsavelChart"></canvas>
</div>
</div>

</div>

<!-- FILTROS -->
<div class="filter-box mb-3">

<div class="row g-2">

<div class="col-md-4">
<select id="filtroResponsavel" class="form-select" onchange="filtrarTabela()">
<option value="">Todos responsáveis</option>
</select>
</div>

<div class="col-md-4">
<select id="ordemPrevisao" class="form-select" onchange="filtrarTabela()">
<option value="">Ordenar por previsão</option>
<option value="asc">Mais próximo</option>
<option value="desc">Mais distante</option>
</select>
</div>

<div class="col-md-4">
<button class="btn btn-warning w-100" onclick="limparFiltros()">Limpar Filtros</button>
</div>

</div>

</div>

<!-- TABELA -->
<div class="card chart-card">
<div class="card-body">

<h5 class="mb-3">Projetos B2B</h5>

<div class="table-responsive">

<table class="table table-striped table-hover">

<thead>
<tr>
<th>Projeto</th>
<th>Projetista</th>
<th>AutoCAD</th>
<th>Responsável</th>
<th>Entregue</th>
<th>Previsão</th>
</tr>
</thead>

<tbody id="tabelaProjetos"></tbody>

</table>

</div>

</div>
</div>

</div>

<script>

let projetosGlobais = [];
let projetosFiltrados = [];

let chartEntrega;
let chartAutocad;
let chartResponsavel;

let filtroEntrega = "";
let filtroAutocad = "";
let filtroResponsavelGrafico = "";

const API_URL =
"https://script.google.com/macros/s/AKfycby-4fOy9HAEmCUMndlLrPWJC7Gq62K5kSd3VWlo3EHEcug_68A5Uyv8hzzbJHtxh0t-Ig/exec";

function agrupar(lista, campo){
    const mapa = {};
    lista.forEach(item=>{
        const chave = item[campo] || "Sem Informação";
        mapa[chave] = (mapa[chave] || 0) + 1;
    });
    return mapa;
}

function aplicarFiltros(){

    let dados = [...projetosGlobais];

    if(filtroEntrega){

        if(filtroEntrega === "Entregues"){
            dados = dados.filter(p =>
                (p.entregue || "").toUpperCase() === "OK"
            );
        }

        if(filtroEntrega === "Pendentes"){
            dados = dados.filter(p =>
                (p.entregue || "").toUpperCase() !== "OK"
            );
        }
    }

    if(filtroAutocad){
        dados = dados.filter(p =>
            (p["projeto autocad"] || "Sem Informação") === filtroAutocad
        );
    }

    if(filtroResponsavelGrafico){
        dados = dados.filter(p =>
            (p.responsavel || "Sem Informação") === filtroResponsavelGrafico
        );
    }

    const respSelect =
        document.getElementById("filtroResponsavel").value;

    if(respSelect){
        dados = dados.filter(p =>
            p.responsavel === respSelect
        );
    }

    const ordem =
        document.getElementById("ordemPrevisao").value;

    if(ordem){

        dados.sort((a,b)=>{

            return ordem === "asc"

                ? new Date(a.previsao) - new Date(b.previsao)

                : new Date(b.previsao) - new Date(a.previsao);
        });
    }

    projetosFiltrados = dados;

    montarTabela(dados);
    montarGraficos(dados);
}

async function carregar(){

    const res = await fetch(API_URL + "?v=" + Date.now());
    const data = await res.json();

    const projetos = data.b2b || [];
    projetosGlobais = projetos;
    projetosFiltrados = [...projetos];

    document.getElementById("totalProjetos").innerText = projetos.length;

    preencherFiltroResponsavel(projetos);

    montarGraficos(projetos);
    montarTabela(projetos);
}

function preencherFiltroResponsavel(dados){
    const select = document.getElementById("filtroResponsavel");
    const resp = [...new Set(dados.map(d => d.responsavel).filter(Boolean))];

    resp.forEach(r=>{
        const opt = document.createElement("option");
        opt.value = r;
        opt.innerText = r;
        select.appendChild(opt);
    });
}

function montarGraficos(projetos){

    if(chartEntrega) chartEntrega.destroy();
    if(chartAutocad) chartAutocad.destroy();
    if(chartResponsavel) chartResponsavel.destroy();

    const entregues = projetos.filter(p => (p.entregue||"").toUpperCase()=="OK").length;
    const pendentes = projetos.length - entregues;

    document.getElementById("entregues").innerText = entregues;
    document.getElementById("pendentes").innerText = pendentes;

    // ENTREGUES x PENDENTES
    chartEntrega = new Chart(
    document.getElementById("entregaChart"),
{
        type:"bar",
        data:{
            labels:["Entregues","Pendentes"],
            datasets:[{
                data:[entregues, pendentes],
                backgroundColor:["#ff7a00","#111"]
            }]
        },
        options:{
            responsive:true,
            plugins:{ legend:{ display:false } },
            scales:{ y:{ beginAtZero:true } },
            onClick:(evt,elements)=>{

    if(!elements.length) return;

    const valor =
        ["Entregues","Pendentes"][elements[0].index];

    filtroEntrega =
        filtroEntrega === valor ? "" : valor;

    aplicarFiltros();
},
        }
    });

    // AUTOCAD
    const autocad = agrupar(projetos,"projeto autocad");

    chartAutocad = new Chart(
    document.getElementById("autocadChart"),
{
        type:"bar",
        data:{
            labels:Object.keys(autocad),
            datasets:[{
                label:"AutoCAD",
                data:Object.values(autocad),
                backgroundColor:"#ff7a00"
            }]
        },
        options:{
            responsive:true,
            plugins:{ legend:{ display:false } },
            scales:{ y:{ beginAtZero:true } },
            onClick:(evt,elements)=>{

    if(!elements.length) return;

    const valor =
        Object.keys(autocad)[elements[0].index];

    filtroAutocad =
        filtroAutocad === valor ? "" : valor;

    aplicarFiltros();
},
        }
    });

    // RESPONSÁVEIS (NOVO)
    const responsavel = agrupar(projetos,"responsavel");

    chartResponsavel = new Chart(
    document.getElementById("responsavelChart"),
{
        type:"bar",
        data:{
            labels:Object.keys(responsavel),
            datasets:[{
                label:"Projetos",
                data:Object.values(responsavel),
                backgroundColor:"#111"
            }]
        },
        options:{
            responsive:true,
            plugins:{ legend:{ display:false } },
            scales:{ y:{ beginAtZero:true } },
            onClick:(evt,elements)=>{

    if(!elements.length) return;

    const valor =
        Object.keys(responsavel)[elements[0].index];

    filtroResponsavelGrafico =
        filtroResponsavelGrafico === valor ? "" : valor;

    aplicarFiltros();
},
        }
    });
}

function filtrarTabela(){
    aplicarFiltros();
}

function limparFiltros(){

    filtroEntrega = "";
    filtroAutocad = "";
    filtroResponsavelGrafico = "";

    document.getElementById("filtroResponsavel").value = "";
    document.getElementById("ordemPrevisao").value = "";

    aplicarFiltros();
}

function montarTabela(projetos){

    const tbody = document.getElementById("tabelaProjetos");
    tbody.innerHTML = "";

    projetos.forEach(p=>{
        tbody.innerHTML += `
        <tr>
            <td>${p.projeto||""}</td>
            <td>${p.projetista||""}</td>
            <td>${p["projeto autocad"]||""}</td>
            <td>${p.responsavel||""}</td>
            <td>${p.entregue||""}</td>
            <td>${p.previsao||""}</td>
        </tr>`;
    });
}

function exportarExcel(){

    const dados = projetosFiltrados.map(p=>({
        Projeto:p.projeto||"",
        Projetista:p.projetista||"",
        AutoCAD:p["projeto autocad"]||"",
        Responsavel:p.responsavel||"",
        Entregue:p.entregue||"",
        Previsao:p.previsao||""
    }));

    const ws = XLSX.utils.json_to_sheet(dados);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "B2B");
    XLSX.writeFile(wb, "projetos_b2b.xlsx");
}

carregar();

</script>

</body>
</html>
