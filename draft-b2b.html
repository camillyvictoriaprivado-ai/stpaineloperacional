<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard B2B</title>

<script src="auth.js"></script>
<script>protegerPagina(["admin_sc"]);</script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
    --indigo:#4f46e5;
    --violet:#7c3aed;
    --pink:#db2777;
    --orange:#f97316;
    --navy:#0f172a;
    --bg:#f1f5f9;
    --white:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --border-light:#f1f5f9;
}

body{
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    opacity:0;
    transition:opacity .15s ease;
}

body.auth-ready{
    opacity:1;
}

/* KPI */

.card-kpi{
    background:var(--white);

    border:1px solid var(--border-light);

    border-radius:20px;

    box-shadow:0 1px 2px rgba(15,23,42,.04);

    transition:.2s ease;
}

.card-kpi:hover{
    transform:translateY(-2px);

    box-shadow:0 10px 24px rgba(15,23,42,.08);

    border-color:transparent;
}

.kpi-value{
    font-size:30px;

    font-weight:900;

    color:var(--navy);
}

/* CHARTS */

.chart-card{
    background:var(--white);

    border:1px solid var(--border-light);

    border-radius:20px;

    padding:22px;

    box-shadow:0 1px 2px rgba(15,23,42,.04);
}

/* TITULOS */

h2{
    color:var(--navy);

    font-weight:900;

    margin-bottom:20px;
}

h5{
    color:var(--navy);

    font-weight:800;

    font-size:14px;

    display:flex;
    align-items:center;
    gap:8px;
}

h5::before{
    content:"";
    width:4px;
    height:14px;
    border-radius:4px;
    background:linear-gradient(180deg,var(--indigo),var(--violet));
    display:inline-block;
}

/* TABELAS */

.table{
    background:white;

    border-radius:12px;

    overflow:hidden;
}

.table thead th{
    background:var(--navy) !important;

    color:white;

    border:none;

    font-weight:700;

    font-size:12px;

    text-transform:uppercase;
    letter-spacing:.04em;
}

.table tbody td{
    vertical-align:middle;

    font-size:13px;
}

.table tbody tr{
    transition:.15s;
}

.table tbody tr:hover{
    background:rgba(79,70,229,.06);
}

/* BOTÕES */

.btn-dark{
    background:var(--bg);

    border:1px solid var(--border);

    color:var(--text);

    font-weight:700;
}

.btn-dark:hover{
    border-color:var(--indigo);
    color:var(--indigo);
}

.btn-warning{
    background:linear-gradient(135deg,var(--indigo),var(--violet));

    border:none;

    color:white;

    font-weight:700;

    box-shadow:0 4px 12px rgba(79,70,229,.25);
}

.btn-warning:hover{
    opacity:.92;
    color:white;
}

/* FILTROS */

.filter-box{
    background:white;

    padding:18px;

    border-radius:16px;

    border:1px solid var(--border-light);

    box-shadow:0 1px 2px rgba(15,23,42,.04);

    margin-bottom:20px;
}

/* INPUTS */

.form-control,
.form-select{
    border:1px solid var(--border);

    border-radius:12px;

    padding:10px 14px;

    font-size:13px;
}

.form-control:focus,
.form-select:focus{
    border-color:var(--indigo);

    box-shadow:0 0 0 4px rgba(79,70,229,.12);
}

/* CARDS GENÉRICOS */

.card{
    border:1px solid var(--border-light);

    border-radius:20px;

    box-shadow:0 1px 2px rgba(15,23,42,.04);
}

/* BADGES */

.badge{
    border-radius:8px;

    padding:8px 10px;

    font-weight:600;
}

/* RESPONSIVO */

@media(max-width:768px){

    .kpi-value{
        font-size:26px;
    }

    h2{
        font-size:22px;
    }

}

</style>

</head>

<body>

<div class="container-fluid p-4">

<div class="d-flex align-items-center gap-3 mb-4">
    <div style="width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--orange),var(--indigo));color:white;font-weight:900;font-size:11px;">TLP</div>
    <h2 class="mb-0">Dashboard Projetos B2B</h2>
</div>

<div class="d-flex justify-content-end gap-2 mb-3">
    <a href="painel.html" class="btn btn-dark px-4">← Voltar ao Painel</a>
    <button class="btn btn-warning px-4" onclick="exportarExcel()">Exportar Excel</button>
</div>

<!-- KPI -->
<div class="row g-3 mb-4">

<div class="col-md-4">
<div class="card card-kpi"><div class="card-body text-center">
<div>Total Projetos</div>
<div id="totalProjetos" class="kpi-value">0</div>
</div></div>
</div>

<div class="col-md-4">
<div class="card card-kpi"><div class="card-body text-center">
<div>Entregues</div>
<div id="entregues" class="kpi-value">0</div>
</div></div>
</div>

<div class="col-md-4">
<div class="card card-kpi"><div class="card-body text-center">
<div>Pendentes</div>
<div id="pendentes" class="kpi-value">0</div>
</div></div>
</div>

</div>

<!-- GRÁFICOS -->
<div class="row g-4 mb-4">

<div class="col-lg-4">
<div class="card chart-card">
<h5>Entregues x Pendentes</h5>
<canvas id="entregaChart"></canvas>
</div>
</div>

<div class="col-lg-4">
<div class="card chart-card">
<h5>Status AutoCAD</h5>
<canvas id="autocadChart"></canvas>
</div>
</div>

<div class="col-lg-4">
<div class="card chart-card">
<h5>Responsáveis</h5>
<canvas id="responsavelChart"></canvas>
</div>
</div>

</div>

<!-- FILTROS -->
<div class="filter-box mb-3">

<div class="row g-2">

<div class="col-md-4">
<select id="filtroResponsavel" class="form-select" onchange="filtrarTabela()">
<option value="">Todos responsáveis</option>
</select>
</div>

<div class="col-md-4">
<select id="ordemPrevisao" class="form-select" onchange="filtrarTabela()">
<option value="">Ordenar por previsão</option>
<option value="asc">Mais próximo</option>
<option value="desc">Mais distante</option>
</select>
</div>

<div class="col-md-4">
<button class="btn btn-warning w-100" onclick="limparFiltros()">Limpar Filtros</button>
</div>

</div>

</div>

<!-- TABELA -->
<div class="card chart-card">
<div class="card-body">

<h5 class="mb-3">Projetos B2B</h5>

<div class="table-responsive">

<table class="table table-striped table-hover">

<thead>
<tr>
<th>Projeto</th>
<th>Projetista</th>
<th>AutoCAD</th>
<th>Responsável</th>
<th>Entregue</th>
<th>Previsão</th>
</tr>
</thead>

<tbody id="tabelaProjetos"></tbody>

</table>

</div>

</div>
</div>

</div>

<script>

let projetosGlobais = [];
let projetosFiltrados = [];

let chartEntrega;
let chartAutocad;
let chartResponsavel;

let filtroEntrega = "";
let filtroAutocad = "";
let filtroResponsavelGrafico = "";

const API_URL =
"https://script.google.com/macros/s/AKfycbwPe5hUMTqNdlbLAj3DhkgBeYlhwqb4p8AWfoRcO7XCoPXvUEbrzUQVVky2AZfqHPZr/exec";

function agrupar(lista, campo){
    const mapa = {};
    lista.forEach(item=>{
        const chave = item[campo] || "Sem Informação";
        mapa[chave] = (mapa[chave] || 0) + 1;
    });
    return mapa;
}

function aplicarFiltros(){

    let dados = [...projetosGlobais];

    if(filtroEntrega){

        if(filtroEntrega === "Entregues"){
            dados = dados.filter(p =>
                (p.entregue || "").toUpperCase() === "OK"
            );
        }

        if(filtroEntrega === "Pendentes"){
            dados = dados.filter(p =>
                (p.entregue || "").toUpperCase() !== "OK"
            );
        }
    }

    if(filtroAutocad){
        dados = dados.filter(p =>
            (p["projeto autocad"] || "Sem Informação") === filtroAutocad
        );
    }

    if(filtroResponsavelGrafico){
        dados = dados.filter(p =>
            (p.responsavel || "Sem Informação") === filtroResponsavelGrafico
        );
    }

    const respSelect =
        document.getElementById("filtroResponsavel").value;

    if(respSelect){
        dados = dados.filter(p =>
            p.responsavel === respSelect
        );
    }

    const ordem =
        document.getElementById("ordemPrevisao").value;

    if(ordem){

        dados.sort((a,b)=>{

            return ordem === "asc"

                ? new Date(a.previsao) - new Date(b.previsao)

                : new Date(b.previsao) - new Date(a.previsao);
        });
    }

    projetosFiltrados = dados;

    montarTabela(dados);
    montarGraficos(dados);
}

async function carregar(){

    const res = await fetch(API_URL + "?v=" + Date.now());
    const data = await res.json();

    const projetos = data.b2b || [];
    projetosGlobais = projetos;
    projetosFiltrados = [...projetos];

    document.getElementById("totalProjetos").innerText = projetos.length;

    preencherFiltroResponsavel(projetos);

    montarGraficos(projetos);
    montarTabela(projetos);
}

function preencherFiltroResponsavel(dados){
    const select = document.getElementById("filtroResponsavel");
    const resp = [...new Set(dados.map(d => d.responsavel).filter(Boolean))];

    resp.forEach(r=>{
        const opt = document.createElement("option");
        opt.value = r;
        opt.innerText = r;
        select.appendChild(opt);
    });
}

function montarGraficos(projetos){

    if(chartEntrega) chartEntrega.destroy();
    if(chartAutocad) chartAutocad.destroy();
    if(chartResponsavel) chartResponsavel.destroy();

    const entregues = projetos.filter(p => (p.entregue||"").toUpperCase()=="OK").length;
    const pendentes = projetos.length - entregues;

    document.getElementById("entregues").innerText = entregues;
    document.getElementById("pendentes").innerText = pendentes;

    // ENTREGUES x PENDENTES
    chartEntrega = new Chart(
    document.getElementById("entregaChart"),
{
        type:"bar",
        data:{
            labels:["Entregues","Pendentes"],
            datasets:[{
                data:[entregues, pendentes],
                backgroundColor:["#4f46e5","#0f172a"]
            }]
        },
        options:{
            responsive:true,
            plugins:{ legend:{ display:false } },
            scales:{ y:{ beginAtZero:true } },
            onClick:(evt,elements)=>{

    if(!elements.length) return;

    const valor =
        ["Entregues","Pendentes"][elements[0].index];

    filtroEntrega =
        filtroEntrega === valor ? "" : valor;

    aplicarFiltros();
},
        }
    });

    // AUTOCAD
    const autocad = agrupar(projetos,"projeto autocad");

    chartAutocad = new Chart(
    document.getElementById("autocadChart"),
{
        type:"bar",
        data:{
            labels:Object.keys(autocad),
            datasets:[{
                label:"AutoCAD",
                data:Object.values(autocad),
                backgroundColor:"#7c3aed"
            }]
        },
        options:{
            responsive:true,
            plugins:{ legend:{ display:false } },
            scales:{ y:{ beginAtZero:true } },
            onClick:(evt,elements)=>{

    if(!elements.length) return;

    const valor =
        Object.keys(autocad)[elements[0].index];

    filtroAutocad =
        filtroAutocad === valor ? "" : valor;

    aplicarFiltros();
},
        }
    });

    // RESPONSÁVEIS (NOVO)
    const responsavel = agrupar(projetos,"responsavel");

    chartResponsavel = new Chart(
    document.getElementById("responsavelChart"),
{
        type:"bar",
        data:{
            labels:Object.keys(responsavel),
            datasets:[{
                label:"Projetos",
                data:Object.values(responsavel),
                backgroundColor:"#0f172a"
            }]
        },
        options:{
            responsive:true,
            plugins:{ legend:{ display:false } },
            scales:{ y:{ beginAtZero:true } },
            onClick:(evt,elements)=>{

    if(!elements.length) return;

    const valor =
        Object.keys(responsavel)[elements[0].index];

    filtroResponsavelGrafico =
        filtroResponsavelGrafico === valor ? "" : valor;

    aplicarFiltros();
},
        }
    });
}

function filtrarTabela(){
    aplicarFiltros();
}

function limparFiltros(){

    filtroEntrega = "";
    filtroAutocad = "";
    filtroResponsavelGrafico = "";

    document.getElementById("filtroResponsavel").value = "";
    document.getElementById("ordemPrevisao").value = "";

    aplicarFiltros();
}

function montarTabela(projetos){

    const tbody = document.getElementById("tabelaProjetos");
    tbody.innerHTML = "";

    projetos.forEach(p=>{
        tbody.innerHTML += `
        <tr>
            <td>${p.projeto||""}</td>
            <td>${p.projetista||""}</td>
            <td>${p["projeto autocad"]||""}</td>
            <td>${p.responsavel||""}</td>
            <td>${p.entregue||""}</td>
            <td>${p.previsao||""}</td>
        </tr>`;
    });
}

function exportarExcel(){

    const dados = projetosFiltrados.map(p=>({
        Projeto:p.projeto||"",
        Projetista:p.projetista||"",
        AutoCAD:p["projeto autocad"]||"",
        Responsavel:p.responsavel||"",
        Entregue:p.entregue||"",
        Previsao:p.previsao||""
    }));

    const ws = XLSX.utils.json_to_sheet(dados);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "B2B");
    XLSX.writeFile(wb, "projetos_b2b.xlsx");
}

carregar();

</script>

</body>
</html>
