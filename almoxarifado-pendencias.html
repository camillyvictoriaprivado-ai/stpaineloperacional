<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Pendências</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

body{
    margin:0;
    font-family:'Orbitron', Arial, sans-serif;
    background:#f5f7fb;
    color:#111;
}

/* HEADER */
.header{
    background:#fff;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #ff7a00;
}

.header h1{
    margin:0;
    font-size:18px;
}

.header div{
    display:flex;
    gap:10px;
}

/* BOTÕES PADRÃO */
.btn{
    border:none;
    padding:10px 14px;
    border-radius:6px;
    cursor:pointer;
    font-family:'Orbitron', sans-serif;
    transition:0.2s;
}

/* PRETO */
.btn-dark-custom{
    background:#111;
    color:#fff;
}

.btn-dark-custom:hover{
    background:#333;
}

/* AMARELO */
.btn-yellow{
    background:#ffcc00;
    color:#111;
    font-weight:600;
}

.btn-yellow:hover{
    background:#ffd633;
}

/* KPIs */
.kpis{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    padding:20px;
}

.kpi{
    background:#fff;
    border:1px solid rgba(0,0,0,0.08);
    border-radius:12px;
    padding:18px;
}

.kpi h3{
    margin:0;
    font-size:14px;
}

.kpi p{
    font-size:28px;
    margin:10px 0 0;
    color:#ff7a00;
    font-weight:bold;
}

/* FILTER */
.filter{
    padding:0 20px 20px;
}

input{
    padding:10px;
    width:100%;
    max-width:300px;
    border:1px solid #ddd;
    border-radius:8px;
    font-family:'Orbitron', sans-serif;
}

/* TABLE */
.table{
    padding:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#111;
    color:#fff;
    padding:12px;
    text-align:left;
}

td{
    padding:12px;
    border-bottom:1px solid #eee;
}

.status-aguardando{
    color:#ff7a00;
    font-weight:bold;
}

.status-tratada{
    color:#2ecc71;
    font-weight:bold;
}

</style>

</head>

<body>

<!-- HEADER PADRONIZADO -->
<div class="header">
    <h1>CONTROLE DE PENDÊNCIAS</h1>

    <div>
        <button class="btn btn-dark-custom" onclick="window.location.href='painel.html'">
            ← VOLTAR AO PAINEL
        </button>

        <button class="btn btn-yellow" onclick="exportarExcel()">
            EXPORTAR EXCEL
        </button>
    </div>
</div>

<!-- KPIs -->
<div class="kpis">

    <div class="kpi">
        <h3>Total Pendências</h3>
        <p id="total">0</p>
    </div>

    <div class="kpi">
        <h3>Aguardando</h3>
        <p id="aguardando">0</p>
    </div>

    <div class="kpi">
        <h3>Tratadas</h3>
        <p id="tratadas">0</p>
    </div>

</div>

<!-- FILTER -->
<div class="filter">
    <input id="search" onkeyup="filter()" placeholder="Buscar pendência...">
</div>

<!-- TABLE -->
<div class="table">
<table>
<thead>
<tr>
    <th>Título</th>
    <th>Responsável</th>
    <th>Prioridade</th>
    <th>Status</th>
</tr>
</thead>

<tbody id="tbody"></tbody>
</table>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby-4fOy9HAEmCUMndlLrPWJC7Gq62K5kSd3VWlo3EHEcug_68A5Uyv8hzzbJHtxh0t-Ig/exec";

let dados = [];

function get(obj, key){
    return (obj[key] || obj[key.toLowerCase()] || "").toString();
}

function norm(v){
    return (v || "").toString().trim().toUpperCase();
}

async function load(){

    const res = await fetch(API_URL + "?v=" + Date.now());
    const data = await res.json();

    const pend = data.pendencias || [];
    dados = pend;

    document.getElementById("total").innerText = pend.length;

    const aguardando = pend.filter(i =>
        norm(i.status) === "AGUARDANDO"
        || norm(i.status) === "AGUARDANDO SALDO"
    ).length;

    const tratadas = pend.filter(i =>
        norm(i.status).includes("TRATADA")
    ).length;

    document.getElementById("aguardando").innerText = aguardando;
    document.getElementById("tratadas").innerText = tratadas;

    render(pend);
}

function render(lista){

    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    lista.forEach(i=>{

        const material = get(i,"material");
        const operadora = get(i,"operadora");
        const cluster = get(i,"cluster");
        const status = get(i,"status");

        tbody.innerHTML += `
        <tr>
            <td>${material}</td>
            <td>${operadora}</td>
            <td>${cluster}</td>
            <td class="${
                norm(status).includes("TRATADA")
                ? "status-tratada"
                : "status-aguardando"
            }">
                ${status}
            </td>
        </tr>`;
    });
}

function filter(){

    const v = document.getElementById("search").value.toLowerCase();

    const filtrado = dados.filter(i =>
        get(i,"material").toLowerCase().includes(v) ||
        get(i,"operadora").toLowerCase().includes(v) ||
        get(i,"cluster").toLowerCase().includes(v) ||
        get(i,"codigo").toLowerCase().includes(v)
    );

    render(filtrado);
}

/* EXPORT EXCEL */
function exportarExcel(){

    if(!dados.length){
        alert("Nenhum dado para exportar");
        return;
    }

    const dadosExport = dados.map(i=>({
        Titulo: get(i,"material"),
        Responsavel: get(i,"operadora"),
        Prioridade: get(i,"cluster"),
        Status: get(i,"status")
    }));

    const ws = XLSX.utils.json_to_sheet(dadosExport);
    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, ws, "Pendencias");

    XLSX.writeFile(wb, "pendencias.xlsx");
}

load();

</script>

</body>
</html>
