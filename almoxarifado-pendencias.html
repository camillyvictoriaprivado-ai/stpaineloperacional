<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Pendências</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

body{
    margin:0;
    font-family:'Orbitron', Arial, sans-serif;
    background:#f5f7fb;
    color:#111;
}

.header{
    background:#fff;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #ff7a00;
}

.btn{
    border:none;
    padding:10px 14px;
    border-radius:6px;
    cursor:pointer;
    font-family:'Orbitron', sans-serif;
}

.btn-dark-custom{ background:#111; color:#fff; }
.btn-yellow{ background:#ffcc00; color:#111; font-weight:600; }

.kpis{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    padding:20px;
}

.kpi{
    background:#fff;
    border-radius:12px;
    padding:18px;
}

.kpi p{
    font-size:28px;
    margin:10px 0 0;
    color:#ff7a00;
    font-weight:bold;
}

.charts{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    padding:0 20px 20px;
}

.card-chart{
    background:#fff;
    padding:15px;
    border-radius:12px;
}

/* FILTROS AGORA ABAIXO DOS GRÁFICOS */
.filter{
    padding:0 20px 20px;
}

input, select{
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
    font-family:'Orbitron';
    margin-right:10px;
}

/* TABELA */
.table{
    padding:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#111;
    color:#fff;
    padding:12px;
}

td{
    padding:12px;
    border-bottom:1px solid #eee;
}

.status-aguardando{ color:#ff7a00; font-weight:bold; }
.status-tratada{ color:#2ecc71; font-weight:bold; }

.btn-red{
    background:#e74c3c;
    color:#fff;
    font-weight:600;
}

.btn-red:hover{
    background:#c0392b;
}

.filter {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
}

</style>

</head>

<body>

<div class="header">
    <h1>CONTROLE DE PENDÊNCIAS</h1>

    <div>
        <button class="btn btn-dark-custom" onclick="window.location.href='painel.html'">← Voltar ao Painel</button>
        <button class="btn btn-yellow" onclick="exportarExcel()">EXPORTAR EXCEL</button>
    </div>
</div>

<!-- KPIs -->
<div class="kpis">
    <div class="kpi"><h3>Total</h3><p id="total">0</p></div>
    <div class="kpi"><h3>Aguardando</h3><p id="aguardando">0</p></div>
    <div class="kpi"><h3>Tratadas</h3><p id="tratadas">0</p></div>
    <div class="kpi">
    <h3>Duplicados</h3>
    <p id="duplicados">0</p>
</div>
</div>

<!-- CHARTS PRIMEIRO -->
<div class="charts">

    <div class="card-chart">
        <canvas id="statusChart"></canvas>
    </div>

    <div class="card-chart">
        <canvas id="clusterChart"></canvas>
    </div>

</div>

<div class="charts">

    <div class="card-chart" style="grid-column:1 / span 2;">
        <canvas id="materialChart"></canvas>
    </div>

</div>

</div>

<div id="modalID" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
z-index:9999;
">

    <div style="
        background:#fff;
        width:80%;
        max-width:900px;
        margin:50px auto;
        border-radius:12px;
        padding:20px;
        max-height:80vh;
        overflow:auto;
    ">

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        ">

            <h2 id="tituloModalID"></h2>

            <button
                class="btn btn-dark-custom"
                onclick="fecharModalID()">
                Fechar
            </button>

        </div>

        <table>
            <thead>
                <tr>
                    <th>Material</th>
                    <th>Operadora</th>
                    <th>Cluster</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="tbodyModalID"></tbody>

        </table>

    </div>

</div>

<!-- 🔥 FILTROS AGORA AQUI EMBAIXO -->
<div class="filter">
    <input id="searchMaterial" placeholder="Buscar material..." oninput="aplicarFiltros()">

    <input id="searchID" placeholder="Buscar ID..." oninput="aplicarFiltros()">

    <select id="filtroCluster" onchange="aplicarFiltros()">
        <option value="">Todos clusters</option>
    </select>

    <select id="filtroStatus" onchange="aplicarFiltros()">
        <option value="">Todos status</option>
        <option value="AGUARDANDO">Aguardando</option>
        <option value="TRATADA">Tratada</option>
    </select>

    <button class="btn btn-red" onclick="toggleDuplicados()">
    Filtrar Duplicados
    </button>

    <button class="btn btn-yellow" onclick="limparFiltros()">
    Limpar Filtros
    </button>

    <button class="btn btn-yellow" onclick="abrirIAInsights()">
    🤖 Insights Inteligentes
    </button>

    </div>

</button>

</div>

<!-- TABELA -->
<div class="table">
<table>
<thead>
    <tr>
    <th>ID</th>
    <th>Material</th>
    <th>Operadora</th>
    <th>Cluster</th>
    <th>Status</th>
    <th>Pendência</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div id="modalIA" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
z-index:99999;
">

    <div style="
        background:#fff;
        width:90%;
        max-width:900px;
        margin:50px auto;
        border-radius:12px;
        padding:20px;
        max-height:85vh;
        overflow:auto;
    ">

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:15px;
        ">
            <h2>🤖 Insights Inteligentes</h2>

            <button class="btn btn-dark-custom" onclick="fecharIAInsights()">
                Fechar
            </button>
        </div>

        <div id="conteudoIA">⏳ Gerando insights...</div>

    </div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycby-4fOy9HAEmCUMndlLrPWJC7Gq62K5kSd3VWlo3EHEcug_68A5Uyv8hzzbJHtxh0t-Ig/exec";

let dadosOriginais = [];
let dadosFiltrados = [];

let filtroDuplicadosAtivo = false;

let chartStatus, chartCluster, chartMaterial;

let filtroGraficoStatus = "";
let filtroGraficoCluster = "";
let filtroGraficoMaterial = "";

function norm(v){
    return (v||"").toString().toUpperCase();
}

function get(o,k){
    return (o[k]||"").toString();
}

function agrupar(lista,campo){
    const m={};
    lista.forEach(i=>{
        const k=i[campo]||"Sem Info";
        m[k]=(m[k]||0)+1;
    });
    return m;
}

 async function load(){

    const res = await fetch(API_URL + "?v=" + Date.now());
    const data = await res.json();

    dadosOriginais = (data.pendencias || []).sort((a, b) =>
        (get(a, "id") || "").localeCompare(
            get(b, "id") || "",
            undefined,
            { numeric: true }
        )
    );

    // 🔥 AGORA SIM: depois de carregar os dados
    window.resumoID = calcularPendenciaPorID(dadosOriginais);

    dadosFiltrados = [...dadosOriginais];

    preencherFiltroCluster();
    renderTudo(dadosFiltrados);
}

function preencherFiltroCluster(){
    const clusters = [...new Set(dadosOriginais.map(d=>d.cluster))];

    const select = document.getElementById("filtroCluster");
    clusters.forEach(c=>{
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
    });
}

function aplicarFiltros(){

    const txtMaterial = document.getElementById("searchMaterial").value.toLowerCase();
    const txtID = document.getElementById("searchID").value.toLowerCase();
    const cluster = document.getElementById("filtroCluster").value;
    const status = document.getElementById("filtroStatus").value;

    const idsDuplicados = getDuplicatedIds(dadosOriginais);

    dadosFiltrados = dadosOriginais.filter(i=>{

        const okText =
            (txtMaterial === "" || get(i,"material").toLowerCase().includes(txtMaterial)) &&
            (txtID === "" || get(i,"id").toLowerCase().includes(txtID));

        const okCluster =
            cluster ? i.cluster === cluster : true;

        const okStatus =
            status ? norm(i.status).includes(status) : true;

        const okGraficoCluster =
            filtroGraficoCluster
            ? (i.cluster || "Sem Info") === filtroGraficoCluster
            : true;

        const okGraficoMaterial =
            filtroGraficoMaterial
            ? (i.material || "Sem Info") === filtroGraficoMaterial
            : true;

        const okGraficoStatus =
            filtroGraficoStatus
            ? norm(i.status).includes(filtroGraficoStatus)
            : true;

        const okDuplicados =
            filtroDuplicadosAtivo
                ? idsDuplicados.has(get(i,"id"))
                : true;

        return okText &&
               okCluster &&
               okStatus &&
               okGraficoCluster &&
               okGraficoMaterial &&
               okGraficoStatus &&
               okDuplicados;
    });

    renderTudo(dadosFiltrados);
}

function renderTudo(lista){
    atualizarKPIs(lista);
    render(lista);
    charts(lista);
}

function atualizarKPIs(lista){

    const ag = lista.filter(i=>norm(i.status).includes("AGUARDANDO")).length;
    const tr = lista.filter(i=>norm(i.status).includes("TRATADA")).length;

    const dup = contarDuplicados(lista);

    document.getElementById("total").innerText = lista.length;
    document.getElementById("aguardando").innerText = ag;
    document.getElementById("tratadas").innerText = tr;
    document.getElementById("duplicados").innerText = dup;

    // ALERTA VISUAL
    if(dup > 0){
        console.warn(`⚠️ Existem ${dup} materiais duplicados`);
    }
}

function charts(lista){

    const ag = lista.filter(i=>norm(i.status).includes("AGUARDANDO")).length;
    const tr = lista.filter(i=>norm(i.status).includes("TRATADA")).length;

    if(chartStatus) chartStatus.destroy();

chartStatus = new Chart(document.getElementById("statusChart"),{
    type:"doughnut",
    data:{
        labels:["Aguardando","Tratadas"],
        datasets:[{
            data:[ag,tr],
            backgroundColor:["#ff7a00","#2ecc71"]
        }]
    },
    options:{
        onClick:(event,elements)=>{

            if(!elements.length) return;

            const index = elements[0].index;

            const valor =
    index === 0
    ? "AGUARDANDO"
    : "TRATADA";

filtroGraficoStatus =
    filtroGraficoStatus === valor
        ? ""
        : valor;

aplicarFiltros();
        }
    }
});

    if(chartCluster) chartCluster.destroy();

const cluster = agrupar(lista,"cluster");

chartCluster = new Chart(document.getElementById("clusterChart"),{
    type:"bar",
    data:{
        labels:Object.keys(cluster),
        datasets:[{
            label:"Clusters",
            data:Object.values(cluster),
            backgroundColor:"#111"
        }]
    },
    options:{
        onClick:(event,elements)=>{

            if(!elements.length) return;

            const index = elements[0].index;

            const valor =
    Object.keys(cluster)[index];

filtroGraficoCluster =
    filtroGraficoCluster === valor
        ? ""
        : valor;

aplicarFiltros();
        }
    }
});

    if(chartMaterial) chartMaterial.destroy();

const material = agrupar(lista,"material");

chartMaterial = new Chart(document.getElementById("materialChart"),{
    type:"bar",
    data:{
        labels:Object.keys(material),
        datasets:[{
            label:"Material Ofensor",
            data:Object.values(material),
            backgroundColor:"#ff7a00"
        }]
    },
    options:{
        indexAxis:'y',

        onClick:(event,elements)=>{

            if(!elements.length) return;

            const index = elements[0].index;

            const valor =
    Object.keys(material)[index];

filtroGraficoMaterial =
    filtroGraficoMaterial === valor
        ? ""
        : valor;

document.getElementById("searchMaterial").value =
    filtroGraficoMaterial;

aplicarFiltros();
        }
    }
});

}

function render(lista){

    // 🔥 MAPA DE PENDÊNCIAS POR ID
    const resumoMap = {};
    window.resumoID?.forEach(r => {
        resumoMap[r.id] = r;
    });

    const idsDuplicados = getDuplicatedIds(lista);

    // 🔽 ORDENA POR ID (crescente)
    const listaOrdenada = [...lista].sort((a, b) => {
        return (get(a, "id") || "").localeCompare(
            get(b, "id") || "",
            undefined,
            { numeric: true }
        );
    });

    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    listaOrdenada.forEach(i => {

        const idAtual = get(i,"id");
        const isDup = idsDuplicados.has(idAtual);

        // 🔥 pega resumo do ID
        const pend = resumoMap[idAtual];

        const faltando = pend ? pend.faltam : 0;
        const total = pend ? pend.total : 0;
        const concluido = pend ? pend.concluido : false;

        tbody.innerHTML += `
        <tr style="${isDup ? 'background:#ffe5e5;' : ''}">
            
            <td 
                style="cursor:pointer; ${isDup ? 'color:#d60000;font-weight:bold;' : ''}"
                onclick="verMateriaisDoID('${idAtual}')"
            >
                ${idAtual}
            </td>

            <td>${get(i,"material")}</td>
            <td>${get(i,"operadora")}</td>
            <td>${get(i,"cluster")}</td>

            <td class="${norm(i.status).includes("TRATADA") ? "status-tratada" : "status-aguardando"}">
                ${get(i,"status")}
            </td>

            <td style="
                font-weight:bold;
                color:${concluido ? '#2ecc71' : '#ff7a00'};
            ">
                ${faltando} faltando
            </td>

        </tr>`;
    });
}

function exportarExcel(){

    const ws=XLSX.utils.json_to_sheet(dadosFiltrados.map(i=>({
    ID:get(i,"id"),
    Material:get(i,"material"),
    Operadora:get(i,"operadora"),
    Cluster:get(i,"cluster"),
    Status:get(i,"status")
})));

    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"pendencias");
    XLSX.writeFile(wb,"pendencias.xlsx");
}

load();

function limparFiltros(){

    document.getElementById("searchMaterial").value = "";
    document.getElementById("searchID").value = "";
    document.getElementById("filtroCluster").value = "";
    document.getElementById("filtroStatus").value = "";

    filtroGraficoStatus = "";
    filtroGraficoCluster = "";
    filtroGraficoMaterial = "";

    dadosFiltrados = [...dadosOriginais];

    renderTudo(dadosFiltrados);
}

function contarDuplicados(lista){
    const mapa = {};

    lista.forEach(i=>{
        const id = get(i,"id");
        const material = get(i,"material");

        const key = id + "||" + material;

        mapa[key] = (mapa[key] || 0) + 1;
    });

    let duplicados = 0;

    Object.values(mapa).forEach(qtd=>{
        if(qtd > 1) duplicados++;
    });

    return duplicados;
}

function getDuplicatedIds(lista){
    const mapa = {};

    lista.forEach(i=>{
        const id = get(i,"id");
        const material = get(i,"material");

        if(!id || !material) return;

        const key = id + "||" + material;

        mapa[key] = (mapa[key] || 0) + 1;
    });

    const duplicados = new Set();

    Object.entries(mapa).forEach(([key, qtd])=>{
        if(qtd > 1){
            const [id] = key.split("||");
            duplicados.add(id); // ainda marcamos por ID na tabela
        }
    });

    return duplicados;
}

function toggleDuplicados(){
    filtroDuplicadosAtivo = !filtroDuplicadosAtivo;

    const btn = document.querySelector("[onclick='toggleDuplicados()']");

    btn.innerText = filtroDuplicadosAtivo
        ? "Mostrando Apenas Duplicados"
        : "Filtrar Duplicados";

    aplicarFiltros();
}

function abrirModalID(idSelecionado){

    const registros =
        dadosOriginais.filter(
            i => get(i,"id") === idSelecionado
        );

    document.getElementById("tituloModalID").innerText =
        "ID: " + idSelecionado +
        " (" + registros.length + " registros)";

    const tbody =
        document.getElementById("tbodyModalID");

    tbody.innerHTML = "";

    registros.forEach(i=>{

        tbody.innerHTML += `
        <tr>
            <td>${get(i,"material")}</td>
            <td>${get(i,"operadora")}</td>
            <td>${get(i,"cluster")}</td>
            <td>${get(i,"status")}</td>
        </tr>`;
    });

    document.getElementById("modalID").style.display =
        "block";
}

function fecharModalID(){
    document.getElementById("modalID").style.display =
        "none";
}

function verMateriaisDoID(idSelecionado){
    abrirModalID(idSelecionado);
}

function scoreItem(i){
    let score = 0;

    if(norm(i.status).includes("AGUARDANDO")) score += 5;
    if(get(i,"material")) score += 2;
    if(get(i,"cluster")) score += 2;

    return score;
}

function gerarInsightsIA(){

    const el = document.getElementById("conteudoIA");
    const lista = dadosFiltrados;

// 🔥 FILTRO REAL
const listaAguardando = lista.filter(i =>
    norm(i.status).includes("AGUARDANDO")
);

const total = lista.length;

const aguardando = listaAguardando.length;
const tratadas = lista.filter(x => norm(x.status).includes("TRATADA")).length;

const duplicados = contarDuplicados(lista);

const clusterMap = agrupar(listaAguardando, "cluster");
const materialMap = agrupar(listaAguardando, "material");

const topCluster = Object.entries(clusterMap).sort((a,b)=>b[1]-a[1])[0];
const topMaterial = Object.entries(materialMap).sort((a,b)=>b[1]-a[1])[0];

    // 🔥 cálculo de prioridade real
    const backlogRate = total > 0 ? (aguardando / total) * 100 : 0;

    let prioridade = "BAIXA";

    if(backlogRate > 70 || duplicados > 10){
        prioridade = "ALTA";
    } else if(backlogRate > 40){
        prioridade = "MÉDIA";
    }

    let texto = "";

    texto += `<h3>📊 Diagnóstico do Sistema</h3>`;
    texto += `<p>Total de registros: <b>${total}</b></p>`;
    texto += `<p>Backlog: <b>${backlogRate.toFixed(1)}%</b></p>`;
    texto += `<p>Prioridade operacional: <b>${prioridade}</b></p>`;

    texto += `<hr>`;

    texto += `<h3>🚨 Problemas Identificados</h3>`;

    if(duplicados > 0){
        texto += `<p>🔁 Duplicidade detectada: <b>${duplicados}</b> grupos</p>`;
    }

    if(topMaterial){
        texto += `<p>📦 Principal causa: <b>${topMaterial[0]}</b></p>`;
    }

    if(topCluster){
        texto += `<p>📍 Cluster crítico: <b>${topCluster[0]}</b></p>`;
    }

    texto += `<hr>`;

    texto += `<h3>🧠 Análise de Causa Provável</h3>`;

    if(aguardando > tratadas){
        texto += `<p>⚠️ Fluxo está acumulando mais do que resolve → possível gargalo operacional.</p>`;
    }

    if(duplicados > 0){
        texto += `<p>⚠️ Possível falha de entrada de dados (duplicação recorrente).</p>`;
    }

    texto += `<hr>`;

    texto += `<h3>💡 Plano de Ação Recomendado</h3>`;
    texto += `<ul>
        <li>Atacar cluster ${topCluster?.[0] || "N/A"} primeiro</li>
        <li>Corrigir origem do material ${topMaterial?.[0] || "N/A"}</li>
        <li>Implementar validação contra duplicados</li>
        <li>Reduzir backlog abaixo de 30%</li>
    </ul>`;

    el.innerHTML = texto;
}

function abrirIAInsights(){
    document.getElementById("modalIA").style.display = "block";

    gerarInsightsIA();
    const listaAguardando = lista.filter(i =>
    norm(i.status).includes("AGUARDANDO")
);
}

function fecharIAInsights(){
    document.getElementById("modalIA").style.display = "none";
}

function calcularPendenciaPorID(lista){
    const mapa = {};

    lista.forEach(i => {
        const id = get(i,"id");
        const status = norm(i.status);

        if(!id) return;

        if(!mapa[id]){
            mapa[id] = {
                total: 0,
                aguardando: 0,
                tratada: 0
            };
        }

        mapa[id].total++;

        if(status.includes("AGUARDANDO")){
            mapa[id].aguardando++;
        }

        if(status.includes("TRATADA")){
            mapa[id].tratada++;
        }
    });

    // transforma em lista
    return Object.entries(mapa).map(([id, v]) => ({
        id,
        ...v,
        faltam: v.aguardando,
        concluido: v.tratada === v.total
    }));
}

function calcularMaiorMaterialOfensor(lista) {

    const aguardando = apenasAguardando(lista);

    const mapa = {};

    aguardando.forEach(i => {
        const material = get(i, "material") || "Sem Info";
        mapa[material] = (mapa[material] || 0) + 1;
    });

    let topMaterial = null;
    let topQtd = 0;

    Object.entries(mapa).forEach(([material, qtd]) => {
        if (qtd > topQtd) {
            topMaterial = material;
            topQtd = qtd;
        }
    });

    return {
        material: topMaterial,
        qtd: topQtd
    };
}

function apenasAguardando(lista){
    return lista.filter(i => norm(i.status).includes("AGUARDANDO"));
}

</script>

</body>
</html>
