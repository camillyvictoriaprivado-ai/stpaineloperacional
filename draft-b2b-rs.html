<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard B2B RS</title>

<script src="auth.js"></script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
    --indigo:#4f46e5;
    --violet:#7c3aed;
    --pink:#db2777;
    --orange:#f97316;
    --navy:#0f172a;
    --bg:#f1f5f9;
    --white:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --border-light:#f1f5f9;
}

body{
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    opacity:0;
    transition:opacity .15s ease;
}

body.auth-ready{
    opacity:1;
}

/* KPI */

.card-kpi{
    background:var(--white);
    border:1px solid var(--border-light);
    border-radius:20px;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
    transition:.2s ease;
}

.card-kpi:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(15,23,42,.08);
    border-color:transparent;
}

.kpi-value{
    font-size:26px;
    font-weight:900;
    color:var(--navy);
}

/* CHARTS */

.chart-card{
    background:var(--white);
    border:1px solid var(--border-light);
    border-radius:20px;
    padding:22px;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
}

/* TITULOS */

h2{
    color:var(--navy);
    font-weight:900;
    margin-bottom:20px;
}

h5{
    color:var(--navy);
    font-weight:800;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:8px;
}

h5::before{
    content:"";
    width:4px;
    height:14px;
    border-radius:4px;
    background:linear-gradient(180deg,var(--indigo),var(--violet));
    display:inline-block;
}

/* TABELAS */

.table{
    background:white;
    border-radius:12px;
    overflow:hidden;
}

.table thead th{
    background:var(--navy) !important;
    color:white;
    border:none;
    font-weight:700;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.04em;
}

.table tbody td{
    vertical-align:middle;
    font-size:13px;
}

.table tbody tr{
    transition:.15s;
}

.table tbody tr:hover{
    background:rgba(79,70,229,.06);
}

/* BOTÕES */

.btn-dark{
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    font-weight:700;
}

.btn-dark:hover{
    border-color:var(--indigo);
    color:var(--indigo);
}

.btn-warning{
    background:linear-gradient(135deg,var(--indigo),var(--violet));
    border:none;
    color:white;
    font-weight:700;
    box-shadow:0 4px 12px rgba(79,70,229,.25);
}

.btn-warning:hover{
    opacity:.92;
    color:white;
}

/* FILTROS */

.filter-box{
    background:white;
    padding:18px;
    border-radius:16px;
    border:1px solid var(--border-light);
    box-shadow:0 1px 2px rgba(15,23,42,.04);
    margin-bottom:20px;
}

/* INPUTS */

.form-control,
.form-select{
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 14px;
    font-size:13px;
}

.form-control:focus,
.form-select:focus{
    border-color:var(--indigo);
    box-shadow:0 0 0 4px rgba(79,70,229,.12);
}

/* CARDS GENÉRICOS */

.card{
    border:1px solid var(--border-light);
    border-radius:20px;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
}

/* RESPONSIVO */

@media(max-width:768px){
    .kpi-value{
        font-size:22px;
    }
    h2{
        font-size:22px;
    }
}

</style>

</head>

<body>

<div class="container-fluid p-4">

<div class="d-flex align-items-center gap-3 mb-4">
    <div style="width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--orange),var(--indigo));color:white;font-weight:900;font-size:11px;">TLP</div>
    <h2 class="mb-0">Dashboard Projetos B2B RS</h2>
</div>

<div class="d-flex justify-content-end gap-2 mb-3">
    <a href="painel.html" class="btn btn-dark px-4">← Voltar ao Painel</a>
    <button class="btn btn-warning px-4" onclick="exportarExcel()">Exportar Excel</button>
</div>

<!-- KPI -->
<div class="row g-3 mb-4">

<div class="col-md-3">
<div class="card card-kpi"><div class="card-body text-center">
<div>Total Projetos</div>
<div id="totalProjetos" class="kpi-value">0</div>
</div></div>
</div>

<div class="col-md-3">
<div class="card card-kpi"><div class="card-body text-center">
<div>Executados</div>
<div id="executados" class="kpi-value">0</div>
</div></div>
</div>

<div class="col-md-3">
<div class="card card-kpi"><div class="card-body text-center">
<div>Pendentes</div>
<div id="pendentes" class="kpi-value">0</div>
</div></div>
</div>

<div class="col-md-3">
<div class="card card-kpi"><div class="card-body text-center">
<div>Valor Total Draft</div>
<div id="valorTotal" class="kpi-value" style="font-size: 22px;">R$ 0,00</div>
</div></div>
</div>

</div>

<!-- GRÁFICOS -->
<div class="row g-4 mb-4">

<div class="col-lg-4">
<div class="card chart-card">
<h5>Status Draft</h5>
<canvas id="statusChart"></canvas>
</div>
</div>

<div class="col-lg-4">
<div class="card chart-card">
<h5>Cidades</h5>
<canvas id="cidadeChart"></canvas>
</div>
</div>

<div class="col-lg-4">
<div class="card chart-card">
<h5>Projetos</h5>
<canvas id="projetoChart"></canvas>
</div>
</div>

</div>

<!-- FILTROS -->
<div class="filter-box mb-3">

<div class="row g-2">

<div class="col-md-3">
<select id="filtroCidade" class="form-select" onchange="filtrarTabela()">
<option value="">Todas cidades</option>
</select>
</div>

<div class="col-md-3">
<select id="filtroStatus" class="form-select" onchange="filtrarTabela()">
<option value="">Todos status draft</option>
</select>
</div>

<div class="col-md-3">
<select id="filtroExecutado" class="form-select" onchange="filtrarTabela()">
<option value="">Todos (Executado)</option>
<option value="SIM">Sim</option>
<option value="NÃO">Não</option>
</select>
</div>

<div class="col-md-3">
<button class="btn btn-warning w-100" onclick="limparFiltros()">Limpar Filtros</button>
</div>

</div>

</div>

<!-- TABELA -->
<div class="card chart-card">
<div class="card-body">

<h5 class="mb-3">Lista de Projetos B2B RS</h5>

<div class="table-responsive">

<table class="table table-striped table-hover">

<thead>
<tr>
<th>Internal</th>
<th>Status Draft</th>
<th>Pedido</th>
<th>OSP Control</th>
<th>Cidade</th>
<th>EPS</th>
<th>Projeto</th>
<th>Local</th>
<th>Executado</th>
<th>Valor Draft</th>
</tr>
</thead>

<tbody id="tabelaProjetos"></tbody>

</table>

</div>

</div>
</div>

</div>

<script>

let projetosGlobais = [];
let projetosFiltrados = [];

let chartStatus;
let chartCidade;
let chartProjeto;

let filtroStatusGrafico = "";
let filtroCidadeGrafico = "";
let filtroProjetoGrafico = "";

const API_URL = "https://script.google.com/macros/s/AKfycby-4fOy9HAEmCUMndlLrPWJC7Gq62K5kSd3VWlo3EHEcug_68A5Uyv8hzzbJHtxh0t-Ig/exec";

function agrupar(lista, campo){
    const mapa = {};
    lista.forEach(item=>{
        const chave = item[campo] || "Sem Informação";
        mapa[chave] = (mapa[chave] || 0) + 1;
    });
    return mapa;
}

function formatarMoeda(valor){
    if(!valor) return "R$ 0,00";
    if(typeof valor === 'number') {
        return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }
    return valor;
}

function converterValorParaNumero(val){
    if(!val) return 0;
    if(typeof val === 'number') return val;
    // Remove "R$", espaços, troca ponto por vazio e vírgula por ponto
    let limpo = val.toString().replace(/[R$\s]/g, '').replace(/\./g, '').replace(',', '.');
    let num = parseFloat(limpo);
    return isNaN(num) ? 0 : num;
}

function aplicarFiltros(){

    let dados = [...projetosGlobais];

    if(filtroStatusGrafico){
        dados = dados.filter(p => (p["status draft"] || "Sem Informação") === filtroStatusGrafico);
    }

    if(filtroCidadeGrafico){
        dados = dados.filter(p => (p.cidade || "Sem Informação") === filtroCidadeGrafico);
    }

    if(filtroProjetoGrafico){
        dados = dados.filter(p => (p.projeto || "Sem Informação") === filtroProjetoGrafico);
    }

    const cidadeSelect = document.getElementById("filtroCidade").value;
    if(cidadeSelect){
        dados = dados.filter(p => p.cidade === cidadeSelect);
    }

    const statusSelect = document.getElementById("filtroStatus").value;
    if(statusSelect){
        dados = dados.filter(p => p["status draft"] === statusSelect);
    }

    const executadoSelect = document.getElementById("filtroExecutado").value;
    if(executadoSelect){
        dados = dados.filter(p => (p.executado || "").toUpperCase() === executadoSelect);
    }

    projetosFiltrados = dados;

    montarTabela(dados);
    montarGraficos(dados);
    atualizarKPIs(dados);
}

async function carregar(){

    const res = await fetch(API_URL + "?v=" + Date.now());
    const data = await res.json();

    const projetos = data.b2b_rs || [];
    projetosGlobais = projetos;
    projetosFiltrados = [...projetos];

    preencherSelects(projetos);
    atualizarKPIs(projetos);
    montarGraficos(projetos);
    montarTabela(projetos);
}

function preencherSelects(dados){
    const selectCidade = document.getElementById("filtroCidade");
    const cidades = [...new Set(dados.map(d => d.cidade).filter(Boolean))].sort();
    cidades.forEach(c=>{
        const opt = document.createElement("option");
        opt.value = c;
        opt.innerText = c;
        selectCidade.appendChild(opt);
    });

    const selectStatus = document.getElementById("filtroStatus");
    const statuses = [...new Set(dados.map(d => d["status draft"]).filter(Boolean))].sort();
    statuses.forEach(s=>{
        const opt = document.createElement("option");
        opt.value = s;
        opt.innerText = s;
        selectStatus.appendChild(opt);
    });
}

function atualizarKPIs(projetos){
    document.getElementById("totalProjetos").innerText = projetos.length;

    const executados = projetos.filter(p => (p.executado || "").toUpperCase() === "SIM").length;
    const pendentes = projetos.length - executados;

    document.getElementById("executados").innerText = executados;
    document.getElementById("pendentes").innerText = pendentes;

    let somaTotal = 0;
    projetos.forEach(p => {
        somaTotal += converterValorParaNumero(p["valor draft"]);
    });
    document.getElementById("valorTotal").innerText = formatarMoeda(somaTotal);
}

function montarGraficos(projetos){

    if(chartStatus) chartStatus.destroy();
    if(chartCidade) chartCidade.destroy();
    if(chartProjeto) chartProjeto.destroy();

    // STATUS DRAFT
    const statusData = agrupar(projetos, "status draft");
    chartStatus = new Chart(
        document.getElementById("statusChart"),
        {
            type:"bar",
            data:{
                labels:Object.keys(statusData),
                datasets:[{
                    data:Object.values(statusData),
                    backgroundColor:"#4f46e5"
                }]
            },
            options:{
                responsive:true,
                plugins:{ legend:{ display:false } },
                scales:{ y:{ beginAtZero:true } },
                onClick:(evt,elements)=>{
                    if(!elements.length) return;
                    const valor = Object.keys(statusData)[elements[0].index];
                    filtroStatusGrafico = filtroStatusGrafico === valor ? "" : valor;
                    aplicarFiltros();
                },
            }
        }
    );

    // CIDADES
    const cidadeData = agrupar(projetos, "cidade");
    chartCidade = new Chart(
        document.getElementById("cidadeChart"),
        {
            type:"bar",
            data:{
                labels:Object.keys(cidadeData),
                datasets:[{
                    data:Object.values(cidadeData),
                    backgroundColor:"#7c3aed"
                }]
            },
            options:{
                responsive:true,
                plugins:{ legend:{ display:false } },
                scales:{ y:{ beginAtZero:true } },
                onClick:(evt,elements)=>{
                    if(!elements.length) return;
                    const valor = Object.keys(cidadeData)[elements[0].index];
                    filtroCidadeGrafico = filtroCidadeGrafico === valor ? "" : valor;
                    aplicarFiltros();
                },
            }
        }
    );

    // PROJETOS
    const projetoData = agrupar(projetos, "projeto");
    chartProjeto = new Chart(
        document.getElementById("projetoChart"),
        {
            type:"bar",
            data:{
                labels:Object.keys(projetoData),
                datasets:[{
                    data:Object.values(projetoData),
                    backgroundColor:"#0f172a"
                }]
            },
            options:{
                responsive:true,
                plugins:{ legend:{ display:false } },
                scales:{ y:{ beginAtZero:true } },
                onClick:(evt,elements)=>{
                    if(!elements.length) return;
                    const valor = Object.keys(projetoData)[elements[0].index];
                    filtroProjetoGrafico = filtroProjetoGrafico === valor ? "" : valor;
                    aplicarFiltros();
                },
            }
        }
    );
}

function filtrarTabela(){
    aplicarFiltros();
}

function limparFiltros(){
    filtroStatusGrafico = "";
    filtroCidadeGrafico = "";
    filtroProjetoGrafico = "";

    document.getElementById("filtroCidade").value = "";
    document.getElementById("filtroStatus").value = "";
    document.getElementById("filtroExecutado").value = "";

    aplicarFiltros();
}

function montarTabela(projetos){
    const tbody = document.getElementById("tabelaProjetos");
    tbody.innerHTML = "";

    projetos.forEach(p=>{
        tbody.innerHTML += `
        <tr>
            <td>${p.internal || ""}</td>
            <td>${p["status draft"] || ""}</td>
            <td>${p.pedido || ""}</td>
            <td>${p["osp control"] || ""}</td>
            <td>${p.cidade || ""}</td>
            <td>${p.eps || ""}</td>
            <td>${p.projeto || ""}</td>
            <td>${p.local || ""}</td>
            <td>${p.executado || ""}</td>
            <td>${p["valor draft"] || ""}</td>
        </tr>`;
    });
}

function exportarExcel(){
    const dados = projetosFiltrados.map(p=>({
        Internal: p.internal || "",
        "Status Draft": p["status draft"] || "",
        Pedido: p.pedido || "",
        "OSP Control": p["osp control"] || "",
        Cidade: p.cidade || "",
        EPS: p.eps || "",
        Projeto: p.projeto || "",
        Local: p.local || "",
        Executado: p.executado || "",
        "Valor Draft": p["valor draft"] || ""
    }));

    const ws = XLSX.utils.json_to_sheet(dados);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "B2B_RS");
    XLSX.writeFile(wb, "projetos_b2b_rs.xlsx");
}

carregar();

</script>

</body>
</html>
